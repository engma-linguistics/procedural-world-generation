# A peoples-robustness tree (tools/peoples_robust.py): see native_fey.toml for the keys. A scale test: dnd's 23 peoples plus 29 more
# D&D kinds (52 peoples, with dnd's dragons and giants). Stems and dates are plausible, not canon; each kind's habitat and way of life
# copy an existing template's. Its rationale line per kind is the comment on its id.
rationale = "The menagerie: dnd plus 29 more D&D kinds on plausible stems (52 peoples): does the history scale, and do many peoples crowd into slivers or die out?"
base = "dnd"

[edit.dwarf]
persists = true  # (duergar split from it)
[edit.gnome]
persists = true  # (svirfneblin split from it)

