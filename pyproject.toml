[project]
name = "procgen-world"
version = "0.1.0"
description = "Toy procedural planet generators + a browser globe viewer"
requires-python = ">=3.14"
dependencies = [
    "espeakng-loader>=0.2.4",
    "numba>=0.68.0",
    "numpy>=1.24",
    "onnx>=1.23.2",
    "piper-tts>=1.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
# parallel by default (pytest-xdist); loadscope keeps a module's shared fixtures on one worker. -n0 for a serial run
addopts = "-n 16 --dist loadscope"
