# ---- kinds: who starts with what -----------------------------------------------------------------------
# of = a line id, or a list of ids (the same kind under another tree's name); the rule applies to them and every line below
# them in the tree, and the tech tree warns about an id the peoples tree doesn't have (PW-1041). elder: an old kind (elder_kyr applies).
# hands = false: cannot knap, haft, pot or forge (dragons); hands = "node": hands only from its stem's sapiens node, once
# genetically modern (owner 10-29, PW-987: the cats and the bird-peoples; the saurians likewise), no tool before it but what a beak can
# hold. beak = true: can hold a tool in its beak (grip "beak" or "any"). kit: what it knows from its start (an arrival brings it from
# elsewhere: the feywild, the sea; a split or group otherwise inherits its parent's). rate_x scales its own inventing.
[[kind]]
of = "draconic"
elder = true
hands = false
# (no rate_x: their few heads and long lives are the pool and its learners now, from the history)
kit = ["innate_magic"]  # breath and flight-craft are part of being a dragon
[[kind]]
of = "avian"  # PW-987: birds probe and hook with the beak before their minds (crows); hands with the sapiens node
hands = "node"
beak = true
[[kind]]
of = "feline"  # PW-987: paws until the sapiens node; cats use no tools before it
hands = "node"
[[kind]]
of = "saurian"  # PW-988: the tortles, lizardfolk and troglodytes: clawed feet until the sapiens node, as the cats
hands = "node"
[[kind]]
of = "kobold"  # (dragon-blooded, but neither elder nor handless: the rule of the nearest kind holds)
[[kind]]
of = "dragonborn"
[[kind]]
of = ["true_giant", "giant"]  # (the D&D tree's true giants; Seven Meals' giants stem, PW-1041)
elder = true
[[kind]]
of = "elf"
kit = ["language", "song", "counting", "marks", "fire_control", "cooking", "knapping", "hafting", "projectiles", "bow", "cordage", "sewing", "burial", "music", "ornament", "foraging_lore", "fishing", "trapping", "huts", "rafts", "spirit_ritual", "druidcraft", "fey_glamour", "runes"]
[[kind]]
of = "gnome"  # owner: early comers like gnomes have it when they arrive (50 kyr)
kit = ["language", "song", "counting", "marks", "tallies", "fire_control", "cooking", "earth_oven", "knapping", "hafting", "cordage", "sewing", "grinding", "projectiles", "burial", "music", "ornament", "foraging_lore", "trapping", "huts", "pit_houses", "spirit_ritual", "fey_glamour", "illusion"]
rate_x = 1.5   # tinkerers
[[kind]]
of = "triton"
kit = ["language", "song", "counting", "marks", "foraging_lore", "fishing", "shellfish", "cordage", "ornament", "spirit_ritual", "tide_lore", "elemental_pact"]
[[kind]]
of = "edge_folk"
kit = ["language", "song", "foraging_lore", "shellfish"]
[[kind]]
of = "dwarf"  # (their mining is the miner trait's craft factor, [culture])

