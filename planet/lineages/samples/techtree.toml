# The technology tree, first pass (PW-675 prototype; planet/lineages/techtree.py reads it). Nothing here is final.
#
# A tech: id, name, track, needs (techs that must be known first), env (goods of the land, land.GOODS, that must be in the
# people's country: all of them), env_any (at least one of them), earliest_kyr (no ordinary people invents it before this,
# kyr before the present: the real-world anchor, see `source`), elder_kyr (the same for the elder kinds, [[kind]] elder = true;
# left out: as earliest_kyr), rate (chance per kyr a people that could invent it does, once possible; [defaults] by track),
# traded = true (taken up by contact without the goods: the metal comes by trade), spread (x the contact rate at which a neighbour takes it up), hands (false: a people without hands can know it: dragons),
# era (the era it belongs to: the tree's meta.era caps what any people reaches), mode = "fantasy" (left out in real mode),
# stock = "crops" | "animals" (also known by whoever first tames a crop or an animal in the history: crops.py, animals.py).
#
# Dates are the real-world (Earth) archaeological firsts the ordering leans on, in kyr before the present. Sources are
# given as author, year, journal; "unverified" marks a date the author of this file could not tie to a source it is sure
# of (provenance epic PW-938). Never invent a citation here. The fantasy (arcane) rows cite nothing: they are D&D flavour.

[defaults]
rate = 0.02          # per kyr, a tech with no rate of its own
spread = 1.0
track_rate = { communication = 0.01, fire = 0.02, tools = 0.02, food = 0.03, shelter = 0.03, travel = 0.02, social = 0.02, arcane = 0.02 }
contact_rate = 0.15  # per kyr: a tech known across a border of CONTACT_FULL_KM is taken up at this rate (x spread, x the taker's openness)
contact_full_km = 1500
env_min = 0.3        # a good counts where it reaches this (0..1) ...
env_share = 0.04     # ... on this share of the people's cells
deposit_min = 0.5    # a deposit (ore, salt, stone: techtree.DEPOSITS) counts where it reaches this (mining.ORE_MIN) ...
deposit_share = 0.005  # ... on this share of the people's cells (at least 2): a mine is a point, not a plain
late_kyr = 12        # techs no older than this with no rate of their own ...
late_rate = 0.12     # ... are found at least this often per kyr once possible

[[track]]
id = "communication"
name = "Communication"
[[track]]
id = "fire"
name = "Fire and cooking"
[[track]]
id = "tools"
name = "Tools and materials"
[[track]]
id = "food"
name = "Food getting"
[[track]]
id = "shelter"
name = "Shelter and settlement"
[[track]]
id = "travel"
name = "Travel"
[[track]]
id = "social"
name = "Social and ritual"
[[track]]
id = "arcane"
name = "Magic and the arcane"

# ---- kinds: who starts with what -----------------------------------------------------------------------
# of = a line id; the rule applies to it and every line below it in the tree. elder: an old kind (elder_kyr applies).
# hands = false: cannot knap, haft, pot or forge (dragons). kit: what it knows from its start (an arrival brings it from
# elsewhere: the feywild, the sea; a split or group otherwise inherits its parent's). rate_x scales its own inventing.
[[kind]]
of = "draconic"
elder = true
hands = false
rate_x = 0.6   # few and long-lived: slow to invent, but they have had a long time
kit = ["innate_magic"]  # breath and flight-craft are part of being a dragon
[[kind]]
of = "kobold"  # (dragon-blooded, but neither elder nor handless: the rule of the nearest kind holds)
[[kind]]
of = "dragonborn"
[[kind]]
of = "true_giant"
elder = true
[[kind]]
of = "elf"
kit = ["language", "song", "counting", "marks", "fire_control", "cooking", "knapping", "hafting", "projectiles", "bow", "cordage", "sewing", "burial", "music", "ornament", "foraging_lore", "fishing", "trapping", "huts", "rafts", "spirit_ritual", "druidcraft", "fey_glamour", "runes"]
[[kind]]
of = "gnome"  # owner: early comers like gnomes have it when they arrive (50 kyr)
kit = ["language", "song", "counting", "marks", "tallies", "fire_control", "cooking", "earth_oven", "knapping", "hafting", "cordage", "sewing", "grinding", "projectiles", "burial", "music", "ornament", "foraging_lore", "trapping", "huts", "pit_houses", "spirit_ritual", "fey_glamour", "illusion"]
rate_x = 1.5   # tinkerers
[[kind]]
of = "triton"
kit = ["language", "song", "counting", "marks", "foraging_lore", "fishing", "shellfish", "cordage", "ornament", "spirit_ritual", "tide_lore", "elemental_pact"]
[[kind]]
of = "edge_folk"
kit = ["language", "song", "foraging_lore", "shellfish"]
[[kind]]
of = "dwarf"
rate_x = 1.2  # miners: metals come easier (the env still has to hold the ore)

