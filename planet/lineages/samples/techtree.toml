# The technology tree, first pass (PW-675 prototype; planet/lineages/techtree.py reads it). Nothing here is final.
# Invention model v1 (lane 64; techtree.py's docstring, docs/references/techtree/README.md): every tech has `domains` (some of war, food,
# craft, build, move, know, ritual, trade: the tech catalogue's tags) and may set `pool` ("all", "specialists", "none"; default: "all"
# in the stone age, "specialists" after). earliest_kyr is a hard floor only at gate_kyr or older; younger, it is a soft anchor that sets
# the rate (leave `rate` out: techtree.rate_of). rate and elder_kyr below matter for the floored techs only, unless given as an override.
#
# A tech: id, name, track, needs (techs that must be known first), env (goods of the land, land.GOODS, that must be in the
# people's country: all of them), env_any (at least one of them), earliest_kyr (no ordinary people invents it before this,
# kyr before the present: the real-world anchor, see `source`), elder_kyr (the same for the elder kinds, [[kind]] elder = true;
# left out: as earliest_kyr), rate (chance per kyr a people that could invent it does, once possible; [defaults] by track),
# traded = true (taken up by contact without the goods: the metal comes by trade), spread (x the contact rate at which a neighbour takes it up), hands (false: a people without hands can know it: dragons),
# era (the era it belongs to: the tree's meta.era caps what any people reaches), mode = "fantasy" (left out in real mode),
# stock = "crops" | "animals" (also known by whoever first tames a crop or an animal in the history: crops.py, animals.py).
# bare = true (PW-971): bare-bones tool use, allowed in a stem before its sapiens node (Lomekwi, Oldowan, Acheulean). Every other tech
# waits for the node, gesture and language included. Each body plan has its own (PW-987): knapping and handaxes need hands, found and
# hooked tools take a beak (grip, below), so the bird stems use found tools before their minds and the cats, saurians and dragons none.
# grip (PW-987): what a tech needs to hold its tool, when it needs one (hands not false): "hands" (the default), "beak" or "any" (either). modern_contact = true: spreads by contact (x spread) to any people under a sapiens node.
#
# Dates are the real-world (Earth) archaeological firsts the ordering leans on, in kyr before the present. Sources are
# given as author, year, journal; "unverified" marks a date the author of this file could not tie to a source it is sure
# of (provenance epic PW-938). Never invent a citation here. The fantasy (arcane) rows cite nothing: they are D&D flavour.

[defaults]
rate = 0.02          # per kyr, a tech with no rate of its own
spread = 1.0
track_rate = { communication = 0.01, fire = 0.02, tools = 0.02, food = 0.03, shelter = 0.03, travel = 0.02, social = 0.02, arcane = 0.02 }
contact_rate = 0.15  # per kyr: a tech known across a border of CONTACT_FULL_KM is taken up at this rate (x spread, x the taker's openness)
contact_full_km = 1500
env_min = 0.3        # a good counts where it reaches this (0..1) ...
env_share = 0.04     # ... on this share of the people's cells
deposit_min = 0.5    # a deposit (ore, salt, stone: techtree.DEPOSITS) counts where it reaches this (mining.ORE_MIN) ...
deposit_share = 0.005  # ... on this share of the people's cells (at least 2): a mine is a point, not a plain
# ---- the invention model (PW-675 v1, lane 64; techtree.py's docstring; evidence: docs/references/techtree/README.md) ----------
gate_kyr = 11.6        # a tech dated this old or older keeps its date as a hard floor (the Pleistocene record, one species, and the
                     # glacial gate on farming: the Holocene step ~11.6 kyr, Richerson et al. 2001); a younger tech has no floor, its
                     # date is a soft anchor only ...
lag_max_kyr = 10     # ... unless Earth took longer than this after its prerequisites (the tree lacks its real precondition: floored)
pool_threshold = 300 # N*: a pool of learners this small or smaller invents nothing (Henrich 2004 eq. 3: the threshold, here a judgement)
pool_ref = 1e5       # N0: the pool at which the strength S is 1 (S = ln(pool / N*) / ln(N0 / N*), Henrich's ln N)
pool_max = 2.5       # S at most this (a pool of ~1e10)
pool_default = 1e5   # a line with no saved population (tests, hand-built lines)
specialists_base = 0.002  # s with none of the rungs below: part-time experts only (Childe 1950 p. 6: the Ona flint-worker still hunts)
dens_ref = 10.0      # people per km2 at which the density term on the specialist pool is 1 ...
dens_exp = 0.2       # ... JUDGEMENT after Bettencourt et al. 2007 Table 1 (innovation per head ~ settlement size ^ 0.15-0.3;
dens_x_min = 0.5     #     density stands in for settlement size, which this tree cannot read) ...
dens_x_max = 2.0     # ... clipped
learners_min = 0.5   # the kind's learners (its generation / 25 yr: fewer hand-offs per kyr, less skill lost; Henrich 2004) at least ...
learners_max = 20.0  # ... and at most this (dragons: 430 / 25 = 17)
culture_cap = 1.5    # a culture's factor on a domain at most this (the evidence for culture-domain matches is weak: Turchin et al. 2021)
anchor_pop = 1e7     # the anchor people a soft tech's rate is set by: this many, at anchor_dens per km2, knowing what Earth knew
anchor_dens = 10.0   # when the tech's prerequisites came; its median wait after them is then Earth's lag (techtree.rate_of)
lag_min_kyr = 0.3    # Earth's lag after the prerequisites at least this (two techs dated the same: not at once)

# the specialist ladder, s (the share of a people not getting food): JUDGEMENT after Childe 1950 (no full-time specialists while
# everyone hunts, gathers or farms, p. 6; cities hold full-time craftsmen, merchants, officials and priests fed by the surplus,
# criterion 2, p. 11). The highest rung whose techs the people knows; x the density term. Wanted: Allen 2000 for the top rungs.
[[specialists]]
needs = ["villages"]
share = 0.005  # sedentary foragers (the Natufians)
[[specialists]]
needs = ["cultivation"]
share = 0.01
[[specialists]]
needs = ["herding"]
share = 0.01
[[specialists]]
needs = ["cultivation", "villages"]
share = 0.02
[[specialists]]
needs = ["towns"]
share = 0.05
[[specialists]]
needs = ["cities"]
share = 0.10

# culture: a trait or way of life (spec.TRAITS, spec.WAYS) -> its factor per domain on inventing, and `take` on taking a tech up by
# contact. The best over a people's traits and way, per domain, at most culture_cap. JUDGEMENT; the evidence is weak for inventing
# and better for taking up: military tech spread by connectivity, and polity factors played "no major role" (Turchin et al. 2021),
# so an aggressive people takes war techs up twice as fast and invents them 1.5x. "Warlike with cities" is this x the specialist pool.
[culture]
aggressive = { war = 1.5, take = { war = 2.0 } }
nomadic = { move = 1.3, war = 1.2 }
pastoral_nomad = { move = 1.3, war = 1.2 }   # (mounted warfare was invented once, by stateless steppe herders: Turchin et al. 2022)
transhumant = { move = 1.2 }
seafaring = { move = 1.3 }
sea_nomad = { move = 1.3, food = 1.2 }
fisher_forager = { food = 1.2 }
agricultural = { food = 1.3 }
farmer = { food = 1.3 }
agro_pastoral = { food = 1.3 }
horticulturalist = { food = 1.2 }
hunter = { food = 1.2 }
forager = { food = 1.2 }
miner = { craft = 1.3 }   # (was the dwarves' rate_x 1.2: metals come easier; the land still has to hold the ore)
subterranean = { build = 1.2 }
cosmopolitan = { trade = 1.3 }

