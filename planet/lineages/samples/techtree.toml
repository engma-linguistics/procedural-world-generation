# ==== the tech catalogue (PW-1122, fun lane 69: docs/references/tech-catalogue/, hunt pass 1), in prerequisite order per track ====
# earth_origins: how many independent origins Earth had (the catalogue's `origins`, the hunt's where checked): finds per world are
# checked against it. source: the hunt's where it verified the row, else the catalogue's own, marked (unverified).
# crop_* and animal_* (stock = "crops:<id>"): the history's own crops and herd animals (crop_defs, animal_defs), known only from its
# first cultivations and take-ups (rate 0, spread 0: never invented or passed on here); their dates are the history's anchors.

