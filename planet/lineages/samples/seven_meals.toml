# ---- folk categories (reputation.py): what a people calls a neighbour ---------------------------------------------
# The horned and antlered peoples (PW-734, PW-754, PW-858): the neighbours' "horned ones" and "antlered ones" are what the antelope-kin and cervid-kin
# became in the memory of those they overran (or who overran them). A conquest is remembered as a legend: efold_kyr is the
# memory length of this row, much longer than an ordinary conquest's (1.5 kyr x the era), so the name outlasts the event.
# Honest limit: 30 kyr is a judgement call (the median takeover of a run is ~12 kyr old).
# These names come only from the sim: substrate takeovers and derived incursions (PW-756: a short, sharp advance, with the
# direction it came from). The antelope- and cervid-kin carry the "aggressive" trait (owner 2026-10-24) and the antelope-kin are
# pastoral nomads (spec.WAY_PRESS). Authored conquests (PW-730) are an optional back-fill for the owner (default focus is plausible
# simulation); the mechanism stays, and an [[event]] stands only for a pair where the history found no incursion. Examples:
# [[event]]
# kind = "conquest"
# by = "antelope_folk"
# over = ["human", "cervid_folk"]
# at = "2.1 kyr"
# note = "the antelope-kin came down in a generation and took the best farmland and the strait; the 'contract' is the humans' memory of the vassal treaties they signed"
#
# [[event]]
# kind = "conquest"
# by = "cervid_folk"
# over = ["human"]
# at = "3 kyr"
# note = "the old cervid-led polity over a human majority in forest and upland (it fell ~1.9 kyr ago); an elite overlay, here the humans' memory of being ruled"
#
[[exonym]]
id = "horned"
label = "the horned ones"
body = { display = "horns" }
valence = ["feared", "despised"]
efold_kyr = 30.0

