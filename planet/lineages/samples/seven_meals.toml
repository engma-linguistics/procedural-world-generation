# -- the aquatic clade: sister to the terrestrial clade ~15 Myr. The merfolk are a coast realm (PW-775: the sea cells next to
# land, shelf and tidal flats; their `temp_c` is the water's) and the storm giants the coast realm too (owner, PW-924: coasts and near sea, not open sea); the deep folk stay authored
# (they keep their coastal stand-in here: no trench or vent habitat is built) and cook without fire.
[[lineage]]
id = "aquatic"
name = "aquatic clade"
parents = ["mammalian"]
at = "9 Myr"
temp_c = [4, 28]
rain_mm = [400, 4000]
prefers = ["coast"]
traits = ["swims", "coastal"]
never = [{ what = "coast", is = "absent" }]  # PW-1155 (owner 10-30): sea folk never live away from the water

[[lineage]]
id = "merfolk"
name = "merfolk"
parents = ["aquatic"]
at = "3 Myr"
density = 2
explore = 0.7
sea_share = 0.7
realm = "coast"  # the shore ring, shallow part: the depth band is elev_m (negative metres)
temp_c = [8, 28]
elev_m = [-600, 0]
traits = ["swims", "coastal"]
way = "fisher_forager"

[[lineage]]
id = "deep_folk"
name = "deep folk"
body = { fire = false }  # no fire: fermentation, hyper-saline brine, vent cooking
parents = ["aquatic"]
at = "2.5 Myr"
density = 1
explore = 0.6
sea_share = 0.9
insularity = 0.8
temp_c = [2, 22]
prefers = ["coast", "island"]
traits = ["swims", "coastal", "insular"]
way = "sea_nomad"

