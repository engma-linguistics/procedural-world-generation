group_of = "antelope_folk"
at = "9 kyr"
temp_c = [14, 32]
rain_mm = [500, 1400]
prefers = ["savanna"]
way = "horticulturalist"  # PW-850: some gatherers: browsers of the woodland edge garden half and gather half

[[lineage]]  # desert-edge and dry-grass herds, oryx- and eland-like (both sexes horned)
