# The owner's world (PW-730): the lineage tree of the culinary-dnd repo (docs/genetics.md, docs/decisions/2026-09-24-lineages.md),
# beside dnd.toml, which stays the traditional D&D template. Format: planet/lineages/spec.py (see the header of dnd.toml).
# Source of truth for people facts is the culinary repo (bodies, ancestry, rulings; the check script of intake Q8 is not built);
# procgen owns WHERE and WHEN (PW-734, owner 2026-10-24: the written geography of the culinary repo is not fitted to; homelands,
# neighbours, conquests and dates all come out of the world). Interfertility tiers fall out of the split depths (spec.TIER_KYR:
# T0 same people, T1 under 1.1 Myr: fertile, T2 under 4 Myr: mostly sterile, else T3: PW-851), so the depths below ARE the culinary repo's tier table:
#   humans-orcs-goliaths T1; goblins-hobgoblins T1; leonin-tabaxi T1; the giant kinds T1; dwarves, halflings, giants, bugbears T2
#   with humans and each other; dragonborn-kobolds T2 (the lizardfolk and tortles are T3 to them: dragons are a deep line, PW-855); merfolk-deep folk T2; everything cross-clade T3.
# The ruminant peoples (PW-734, PW-858, owner): antelope-kin and cervid-kin are this world's closest equivalent to tieflings
# (horns and antlers), a deep ruminant branch (~12 Myr from humans: T3, no hybrids with
# them; antelope-kin and cervid-kin both branch ~3 Myr ago, held T3 to one another by an [[interfertile]] row at the end: deer and antelope do not interbreed). What their neighbours call the horned and antlered peoples is in
# the [[exonym]] rows at the end, with a long memory). The tiefling template is not in this tree.
# The antelope-kin are a conquest people (their homeland is wherever the world puts them, not "the western
# steppe"); the sim's substrate takeovers are the conquests the reputation pass reads.
# Not in this tree (cut or absorbed in the canon): drow, sea elves (an exonym for the deep folk), tritons, firbolgs, aasimar,
# genasi, troglodytes, the tiefling template. Half-elves are the canon's exemption (no population, no cline, no community
# anywhere): a contact hybrid with linger = false (PW-758): born where humans and elves meet, living inside the parent groups.
# Placement hints (PW-763), modest: the mammal and reptile lines start apart ("far_from"), birds start by the reptiles ("near").
# Horns and antlers (owner 2026-10-24): by variant, following real species. body.display = horns | antlers; body.display_sex =
# both | males (which sexes carry it); body.shed (antlers) = both | males (who sheds, a yearly cycle).
#   reindeer-like cervids: antlers in both sexes; deer-, elk-, moose-like: males only.
#   oryx-, eland-like antelope: horns in both sexes; impala-, blackbuck-, kudu-, saiga-like: males only.

[meta]
name = "Seven Meals (the owner's world)"
seed = 7
mixing_start = "3 kyr"
era = "renaissance"
viable_pop = 500
dragon_km2 = 5000  # NOMINAL since PW-1068: no longer the density where peoples press them (that is the natural density under the peoples' kill,
# history.megafauna.kill); only the number the competition between lines and the viable-population check take (inbox draft: repurpose).
# Was: one dragon per this many km2 of its country where peoples press them (PW-957; natural, meta.megafauna_natural, where none do). 5000: the default, a few per swamp or range; 10000: rarer, a lone dragon per region; 1000: the skies thick with them
giant_km2 = 2000  # NOMINAL since PW-1068: no longer the density where peoples press them (that is the natural density under the peoples' kill,
# history.megafauna.kill); only the number the competition between lines and the viable-population check take (inbox draft: repurpose).
# Was: one true giant per this many km2 of its country where peoples press them (PW-963; natural ~1 per 130-345 km2 by kind where none do). 2000: the default; 5000, 10000: rarer; 1000: giant country
megafauna_natural = "prey"  # the megafauna's natural density where no people presses them (PW-957, PW-966). Candidates, until the owner's
# PW-967 review: "prey" (from the land's prey, wild herds and livestock: Carbone & Gittleman 2002; ~1 dragon per 530 km2 at 1 t/km2),
# "mesotherm" (uniform from mass, Marshall et al. 2021's dinosaur line: ~1 per 65 km2), "mammal" (the mammal-carnivore line: ~1 per 137)
dragon_ages = "younger"  # the dragons' age schedule (PW-958; owner 10-28: younger is the default): younger (annual mortality 20% wyrmling, 3% young, 0.5% adult, 0.1% ancient; ancients ~3%) | base (ancients ~7%) | harsher | gentler
dragon_generation = "line"  # the dragons' generation time (PW-959; owner 10-28: ~430 yr for now, each dragon line's generation_yr): line | schedule (~460-520 yr under younger) | schedule_mass (~700 at base)
mode = "fantasy"
portal_mode = "off"  # (the elves and gnomes each arrive from outside at their best habitat: "two separate places")
portals = 1
land_pull = 0.5

# ---- one tree of life ----------------------------------------------------------------------------------
# Stems are the last common ancestor of the peoples under them, not the first mammals or reptiles (owner ruling): the root is ~20 Myr old and
# the named peoples are fully realized within ~3 Myr. Worlds sliced shallower than that clamp: every line older than the
# run's first step starts at its first step. The convergence on people-shaped bodies is a premise, not a mechanism.
[[lineage]]
id = "life"
name = "one tree of life"
origin = "root"
at = "20 Myr"
temp_c = [10, 30]
rain_mm = [300, 3500]

# ---- the mammalian line --------------------------------------------------------------------------------
[[lineage]]
id = "mammalian"
name = "mammalian line"
parents = ["life"]
at = "18 Myr"
temp_c = [8, 26]
rain_mm = [400, 2500]

[[lineage]]  # carnivore-like branch ~60 Myr off the terrestrial clade; originates in or near the Near Isles
id = "feline"
name = "cat peoples stem"
body = { sweet = false, diet = "obligate_carnivore", raw_meat = true, smell = "keen", toxic = ["alliums", "theobromine"], teeth = "conical", hours = "crepuscular" }
parents = ["mammalian"]
at = "14 Myr"
temp_c = [16, 30]
rain_mm = [500, 3000]
prefers = ["tropical"]

[[lineage]]
id = "tabaxi"
name = "tabaxi"
parents = ["feline"]
at = "800 kyr"
density = 1.5
explore = 0.8
temp_c = [18, 30]
rain_mm = [900, 3500]
prefers = ["rainforest", "forest"]
traits = ["cosmopolitan", "hunter"]
speed_kmyr = 0.8

[[lineage]]
id = "leonin"
name = "leonin"
parents = ["feline"]
at = "600 kyr"
density = 0.5
explore = 0.6
temp_c = [16, 32]
rain_mm = [300, 1400]
prefers = ["savanna", "open"]
traits = ["nomadic", "hunter"]

# -- the ruminant branch (PW-734): the horned and antlered peoples. ~50 Myr off the line of the humans (T3), ~25 Myr between the two peoples (T2).
[[lineage]]
id = "ruminant"
name = "ruminant stem"
body = { gut = "foregut", cellulose = true, diet = "herbivore", grain = "moderate", teeth = "dental_pad", salt = "craving", hours = "crepuscular", smell = "keen" }  # intake 4.3: rumen (grain in moderation, adapted gradually: PW-850; forage leads their fields), a dental pad and no upper incisors, a sodium craving, crepuscular
parents = ["mammalian"]
at = "12 Myr"
temp_c = [-8, 26]
rain_mm = [200, 2200]
prefers = ["open", "temperate"]

[[lineage]]  # the horned people: the conquest people of the open dry country
id = "antelope_folk"
name = "antelope-kin"
body = { display = "horns", display_sex = "males", milks = false }  # (PW-793: no milking, kin of the herd animals) permanent horns with growth rings; the default variant is males-only (saiga-, impala-like)
parents = ["ruminant"]
at = "3 Myr"
density = 0.8
explore = 0.7
insularity = 0.5
temp_c = [-5, 26]
rain_mm = [150, 900]
prefers = ["steppe", "savanna", "open"]
traits = ["nomadic", "hardy", "aggressive"]  # (aggressive: PW-756, owner 2026-10-24: a data-driven tendency to take ground)
way = "farmer"  # owner 2026-10-24: plant eaters, so mostly farmers whatever their kin graze (PW-784); the steppe and dry-grass cultures are agro-pastoral

[[lineage]]  # cold steppe runners, saiga-like (males only)
id = "antelope_steppe"
name = "antelope-kin of the steppe (saiga-like)"
origin = "group"
group_of = "antelope_folk"
at = "9 kyr"
temp_c = [-12, 20]
rain_mm = [150, 600]
prefers = ["steppe"]
way = "agro_pastoral"

[[lineage]]  # savanna and woodland-edge browsers, impala- and kudu-like (males only)
id = "antelope_savanna"
name = "antelope-kin of the savanna (impala-, kudu-like)"
