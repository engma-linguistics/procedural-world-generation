# The usual D&D peoples: editable defaults (times, niches, traits, wishes are all guesses to change).
# Format: planet/lineages/spec.py. Times are years before the present ("8 Myr", "450 kyr", "12000 yr").
# origin: root | split (parents = [p]) | arrival (from outside the world) | hybrid (two parents) | template (overlay)
# temp_c / rain_mm: comfort range of the annual mean temperature and rain (soft edges).
# enabled = false switches a line off (its split children re-parent to its parent; its hybrids and templates go too).
# extinct = "T": the line dwindles and is gone by T before the present.
# persists = true: the line lives on after its last split. megafauna = true (PW-855): a handful per country (the dragons); its range hardly takes room from the peoples (history.MEGAFAUNA_PUSH); its groups inherit it.
# origin = "group", group_of = <people>: a way of life within a people (steppe and forest orcs; human seafarers, farmers,
# herders, nomads): not a split and not deeper culture. It inherits what it leaves out, takes hold where its own niche
# beats its people's, mixes freely with its people and sister groups, and rolls up into its people in the summaries.
# demography (PW-650; left out: from the traits, spec.DEMOGRAPHY; a split inherits its parent's): density (people
# per km² of full habitat, or band_km2: the land a band of 25 roams), explore (0..1: how readily it pushes into
# new land and over the sea), sea_share (0..1: the share of its frontier that takes to the water), insularity
# (0..1: resistance to mixing and to leaving home); speed_kmyr is the expansion rate (km/yr of frontier).
# way (PW-723): the way of life, a cultural trait inherited from the parent or people and settable on any line: forager,
# fisher_forager, horticulturalist, farmer, pastoral_nomad, transhumant, agro_pastoral, sea_nomad (spec.WAYS). Its goods
# replace the food rows a trait would give; it sets who tames the herd animals, who first cultivates plants, the fuels, the brief.
# body (PW-694): senses and body for the future cuisine pass; only what differs from the human-like baseline, inherited key by
# key from the first parent. Keys: sweet (tastes sweet), milk (digests milk as adults; true/false, or a share 0..1 of the people for the traits that are population frequencies; it decides only fresh or fermented dairy), milks (false: the people does not milk its animals at all; default true, PW-784), capsaicin (feels chili heat), bitter and
# smell (low | normal | high or keen), diet (herbivore | omnivore | carnivore | obligate_carnivore), raw_meat (eats raw meat
# safely), cellulose (digests it), toxic (alliums: onion and garlic; theobromine: chocolate). Real analogues: felines taste no
# sweet, birds feel no capsaicin, herding peoples keep lactase.

[meta]
name = "D&D peoples (preset)"
seed = 7
mixing_start = "3 kyr"
era = "renaissance"  # the era the present is meant to be (stone age | bronze age | classical | medieval | renaissance | industrial). The technology tree caps what the peoples know by the present at it (techtree.py). The history is not run past the present.
viable_pop = 500  # a separate patch of a people with fewer people than this fades (sparse peoples need big lands)
dragon_km2 = 5000  # NOMINAL since PW-1068: no longer the density where peoples press them (that is the natural density under the peoples' kill,
# history.megafauna.kill); only the number the competition between lines and the viable-population check take (inbox draft: repurpose).
# Was: one dragon per this many km2 of its kind's country where peoples press them (PW-957). Where no people holds the
# land they keep nearer their natural density (meta.megafauna_natural below), and were many more before the peoples spread (the age of dragons). 5000: the default, a few per swamp or range in peopled country; 10000: rarer,
# a lone dragon per region; 1000: the skies are thick with them, dozens in every forest
giant_km2 = 2000  # NOMINAL since PW-1068: no longer the density where peoples press them (that is the natural density under the peoples' kill,
# history.megafauna.kill); only the number the competition between lines and the viable-population check take (inbox draft: repurpose).
# Was: one true giant per this many km2 of its kind's country where peoples press them (owner, PW-963 option C). Natural,
# from mass as scaled foragers: ~1 per 130-345 km2 by kind (x the land's productivity under "prey"), kept where few small folk hold the land. 2000: the default, a steading of 10
# to some 20,000 km2; 5000 and 10000: rarer; 1000: giant country, steadings in every upland
megafauna_natural = "food"  # the megafauna's natural density where no people presses them (PW-957, PW-966, PW-990). Owner 10-29 (PW-990 B): "food",
# a dragon's from its part of the land's surplus once the peoples' hunters and the rest of the predator guild have taken theirs (giants as under "prey").
# The others stay as cross-checks: "prey" (from the land's prey, wild herds and livestock: Carbone & Gittleman 2002, checked PDF p. 2; ~1 dragon per 530 km2 at 1 t/km2),
# "mesotherm" (uniform from mass, Marshall et al. 2021's dinosaur line, checked Table 1; ~1 per 65 km2), "mammal" (the mammal-carnivore line: ~1 per 137)
dragon_ages = "younger"  # the dragons' age schedule (PW-958; owner 10-28: younger is the default): younger (annual mortality 20% wyrmling, 3% young, 0.5% adult, 0.1% ancient; ancients ~3%) | base (ancients ~7%) | harsher | gentler
dragon_generation = "line"  # the dragons' generation time (PW-959; owner 10-28: ~430 yr for now, each dragon line's generation_yr): line | schedule (~460-520 yr under younger) | schedule_mass (~700 at base)
mode = "fantasy"  # fantasy (all these peoples, the fantasy goods) | real (only the lines marked real = true: humans; no fantasy goods). PW-695; magic is PW-696.
portal_mode = "sites"  # arrivals from outside the world (origin = "arrival"): off (each at its best habitat) | random | sites (PW-697) | wandering
# (lane 78: thinnings to each arrival's plane that drift over the world, open for some kyr and close; history.portals). Coordinator 10-30: sites, ~8
# portals, the elves a million strong (the owner: "a million through ten portals")
portals = 8  # ...how many portals they come through (portal_mode random / sites; wandering: how many of a plane's thinnings stay open)
portal_sites = ["forest", "desert", "reef", "volcano"]  # ...the places 'sites' draws on: deepest part of a large forest, middle of a desert, a coral reef, the foot of a volcano
growth_rates = true  # PW-1147 (lane 78): each people's growth rate r, from its canon ages (life_history), sets its spread (x sqrt r), how fast
# its rivals displace it, the fade of its small patches and its far jumps. Off: every people at the same rates
wave_kyr = 2  # an arrival's waves come this many kyr apart (a judgement)
land_pull = 0.5  # how strongly the land's goods ([[use]], at the end) move each people within its niche (0: not at all)

# ---- the reptilian line ---------------------------------------------------------------
# Stems are the last common ancestor of the peoples under them, not the first reptiles or mammals (owner ruling): roots are no older than ~20 Myr.
# (The earlier "named peoples within ~3 Myr" was a placeholder like the rest of the timeline; owner 10-29, PW-988.) The reptilian root
# splits near its start into two branches. The draconic stem IS the dragons, the elder line among the reptilian peoples (the ur-dragon,
# ~19.5 Myr, PW-978): extant megafauna at very low density (as the true giants), minds arriving at the stem's sapiens node (PW-965, a marker:
# sapient = ...; the stem ends as animals, animals = true: wyverns, drakes and pseudodragons, untracked; the dragonborn and kobolds are its
# dragon-blooded humanoid peoples, split off recently; the stem ends at its last split, PW-924). Its two great kinds, chromatic and metallic,
# split ~2.5 Myr ago (owner), and the kinds of dragon split from those, each in its own country (below; PW-924: the stems end, no dragon is
# of no set colour). The saurian stem (PW-988, owner 10-29: their own branch) holds the tortles, lizardfolk and troglodytes: minds at
# 4.5 Myr (after the dragons' 5 Myr: the dragons stay the elder line), the tortles off first at 4.2 Myr (the slow, deep, ocean-going branch,
# shelled and beaked), then the lizardfolk and troglodytes from each other at 2.5 Myr (the troglodytes the later, cave-going split).
# Interfertility follows the split depths (PW-851): dragons are kin of dragonborn and kobolds, and of no saurian people (T3); the tortles are
# T3 to the lizardfolk and troglodytes (4.2 Myr), the lizardfolk and troglodytes T2 (2.5 Myr: hybrids born, mostly sterile).
[[lineage]]
id = "reptilian"
name = "reptilian stem"
body = { smell = "keen", raw_meat = true, thermo = "ecto" }  # reptiles flick their tongues to smell; swallow prey raw; ectotherms: appetite and activity follow the weather (feast and fast)
origin = "root"
at = "20 Myr"
temp_c = [18, 30]
rain_mm = [700, 3500]
prefers = ["tropical"]

[[lineage]]
id = "draconic"
sapient = "5 Myr"  # PW-965 sapiens node: minds arrive for the whole draconic stem; PW-978: 5 Myr (owner 10-28), 2.5 Myr of one-people dragons before the chromatic/metallic split
animals = true  # PW-965: at its last split the rest of the stem continues as animals (wyverns, drakes, pseudodragons), untracked
name = "dragons (the draconic stem: the ur-dragon, split from the reptilian stem near the root, a recognizable modern ur-dragon by ~10 Myr; elder, dragon-blooded)"
parents = ["reptilian"]
at = "19.5 Myr"
group_size = [1, 3]  # mostly solitary, now and then a mated pair with young
generation_yr = 430  # PW-924, PW-959: long-lived great wyrms (owner 10-28: ~430 yr for now, the base schedule's mother age); few dragons persist (history.line_mvp). Read only under meta.dragon_generation = "line" (PW-959)
megafauna = true  # a handful per country: their range hardly takes room from the peoples
# (density: natural (meta.megafauna_natural, the age schedule meta.dragon_ages) where no people presses them, meta.dragon_km2 where peoples do, PW-957)
explore = 0.3
sea_share = 0.02
insularity = 0.85
temp_c = [-6, 38]
rain_mm = [150, 3000]
prefers = ["volcanic", "mountain", "desert", "forest", "jungle", "wetland", "tundra", "savanna", "coast", "hills", "steppe"]  # PW-924: the stem lived in every kind's country; it ends at its last split (the kinds live on)
traits = ["hardy", "flies", "insular"]

# the kinds of dragon, by the country they lair in (PW-855): chromatic (red, blue, green, black, white) and metallic (gold, silver, bronze, copper, brass)

[[lineage]]  # the ur-dragon's two great kinds split ~2.5 Myr ago (owner: 1-4 Mya); the kinds below split from them (PW-924), and the stems end
id = "chromatic_dragon"
cohesion = 0.9  # PW-670 round 2 (owner 10-31): one tongue and shared mores per kind, a far-flung folk that still meets to mate. A judgement: cultures.py pulls each culture's drift 90% toward its kind's mean, and sister cultures merge after 0.1 x MERGE_CONTACT_KYR side by side
name = "chromatic dragons (red, blue, green, black, white)"
parents = ["draconic"]
at = "2.5 Myr"
group_size = [1, 3]  # mostly solitary, now and then a mated pair with young
generation_yr = 430  # PW-924, PW-959: long-lived great wyrms (owner 10-28: ~430 yr for now, the base schedule's mother age); few dragons persist (history.line_mvp). Read only under meta.dragon_generation = "line" (PW-959)
megafauna = true
# (density: natural (meta.megafauna_natural, the age schedule meta.dragon_ages) where no people presses them, meta.dragon_km2 where peoples do, PW-957)
explore = 0.3
sea_share = 0.02
insularity = 0.85
temp_c = [-6, 38]
rain_mm = [150, 3000]
prefers = ["volcanic", "mountain", "desert", "forest", "jungle", "wetland", "tundra"]  # PW-924: its colours' countries; it ends as they split
traits = ["hardy", "flies", "insular"]

[[lineage]]  # the ur-dragon's two great kinds split ~2.5 Myr ago (owner: 1-4 Mya); the kinds below split from them (PW-924), and the stems end
id = "metallic_dragon"
cohesion = 0.9  # PW-670 round 2 (owner 10-31): one tongue and shared mores per kind, a far-flung folk that still meets to mate. A judgement: cultures.py pulls each culture's drift 90% toward its kind's mean, and sister cultures merge after 0.1 x MERGE_CONTACT_KYR side by side
name = "metallic dragons (gold, silver, bronze, copper, brass)"
parents = ["draconic"]
at = "2.5 Myr"
rivalry = 0.5  # PW-924: the metallics coexist more readily with other megafauna (weaker competition among them, not with the peoples)
group_size = [1, 3]  # mostly solitary, now and then a mated pair with young
generation_yr = 430  # PW-924, PW-959: long-lived great wyrms (owner 10-28: ~430 yr for now, the base schedule's mother age); few dragons persist (history.line_mvp). Read only under meta.dragon_generation = "line" (PW-959)
megafauna = true
# (density: natural (meta.megafauna_natural, the age schedule meta.dragon_ages) where no people presses them, meta.dragon_km2 where peoples do, PW-957)
explore = 0.3
sea_share = 0.02
insularity = 0.85
temp_c = [-6, 38]
rain_mm = [150, 3000]
prefers = ["savanna", "mountain", "coast", "hills", "steppe"]  # PW-924: its kinds' countries; it ends as they split
traits = ["hardy", "flies", "insular"]

