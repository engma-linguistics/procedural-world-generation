# ---- land use: what each way of life looks for in the world's land ---------------------------
# by: a trait, or a place or climate tag in a line's prefers; good: planet/lineages/land.py GOODS
# (fertile, grazing, foraging, timber, fuel, building, stone, metal, gold, iron, copper, tin, gems,
# mithril, coal, harbour, nav_hazard, coral, lagoon, mangrove, cliff, seabirds, seals, volcanic, hills,
# peaks, frost, storm_coast); weight > 0 favours it, < 0 avoids it. by may also be one line's id; pull
# (0..1, default meta.land_pull) says how strongly that use moves the line (it takes its strongest pull);
# strict = true cuts the habitat off those goods instead of renormalising it to a mean of 1. Each good is 0..1 against the world's own best; ores and coasts reach
# one cell ring inland. A line's habitat is x(1 - pull + pull G), G the best of its goods there
# (each at its own pull: the row's pull x min(weight, 1), so a weight of 0.5 pulls half as hard as 1; PW-635). Farmland, pasture and the coast count from 10 kyr ago (today's climate and sea
