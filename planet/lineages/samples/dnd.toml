# ---- land use: what each way of life looks for in the world's land ---------------------------
# by: a trait, or a place or climate tag in a line's prefers; good: planet/lineages/land.py GOODS
# (fertile, grazing, foraging, timber, fuel, building, stone, metal, gold, iron, copper, tin, gems,
# mithril, coal, harbour, nav_hazard, coral, lagoon, mangrove, cliff, seabirds, seals); weight > 0
# favours it, < 0 avoids it. Each good is 0..1 against the world's own best; ores and coasts reach
# one cell ring inland. A line's habitat is x(1 - pull + pull G), G the best of its goods there
# (by weight / its largest weight). Farmland, pasture and the coast count from 10 kyr ago (today's climate and sea
# level), the geology (ores, stone) in the ice ages too.
[[use]]
by = "agricultural"
good = "fertile"

[[use]]
by = "nomadic"
good = "grazing"

[[use]]
by = "forest"
good = "timber"
weight = 0.5

