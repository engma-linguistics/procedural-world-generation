# ---- hybrids: only where both parents meet ------------------------------------------------
# Who can have children together follows realistic genetics (PW-752, owner 10-29): by how long ago two peoples split (meta.tier_kyr,
# spec.STAGES) their young are viable (under 10 kyr: one people), absorbed into a parent people (under 1.1 Myr: fertile, but no mixed
# people of their own, as the archaic humans' genes in the moderns), sterile (under 4 Myr) or impossible (deeper, or no common ancestor:
# the elves came from outside). No minor mixed peoples are tracked (no half-tortle-half-lizardfolk): the only mixed peoples are the two
# the genre is built on, half-elves and half-orcs, which are always possible (`exempt = true`): human-elf is impossible by descent and
# human-orc absorbed (700 kyr). A preset of its own can mark other hybrids exempt or set a pair's stage with an [[interfertile]] row.
[[lineage]]
id = "half_elf"
adult_yr = 20  # PHB: 20; often over 180
lifespan_yr = 180
name = "half-elves"
origin = "hybrid"
