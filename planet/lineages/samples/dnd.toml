# The usual D&D peoples: editable defaults (times, niches, traits, wishes are all guesses to change).
# Format: planet/lineages/spec.py. Times are years before the present ("8 Myr", "450 kyr", "12000 yr").
# origin: root | split (parents = [p]) | arrival (from outside the world) | hybrid (two parents) | template (overlay)
# temp_c / rain_mm: comfort range of the annual mean temperature and rain (soft edges).
# enabled = false switches a line off (its split children re-parent to its parent; its hybrids and templates go too).
# extinct = "T": the line dwindles and is gone by T before the present.
# origin = "group", group_of = <people>: a way of life within a people (steppe and forest orcs; human seafarers, farmers,
# herders, nomads): not a split and not deeper culture. It inherits what it leaves out, takes hold where its own niche
# beats its people's, mixes freely with its people and sister groups, and rolls up into its people in the summaries.
# demography (PW-650; left out: from the traits, spec.DEMOGRAPHY; a split inherits its parent's): density (people
# per km² of full habitat, or band_km2: the land a band of 25 roams), explore (0..1: how readily it pushes into
# new land and over the sea), sea_share (0..1: the share of its frontier that takes to the water), insularity
# (0..1: resistance to mixing and to leaving home); speed_kmyr is the expansion rate (km/yr of frontier).
# body (PW-694): senses and body for the future cuisine pass; only what differs from the human-like baseline, inherited key by
# key from the first parent. Keys: sweet (tastes sweet), milk (digests milk as adults; true/false, or a share 0..1 of the people for the traits that are population frequencies), capsaicin (feels chili heat), bitter and
# smell (low | normal | high or keen), diet (herbivore | omnivore | carnivore | obligate_carnivore), raw_meat (eats raw meat
# safely), cellulose (digests it), toxic (alliums: onion and garlic; theobromine: chocolate). Real analogues: felines taste no
# sweet, birds feel no capsaicin, herding peoples keep lactase.

[meta]
name = "D&D peoples (preset)"
seed = 7
mixing_start = "3 kyr"
era = "renaissance"  # the era the present is meant to be (stone age | bronze age | classical | medieval | renaissance | industrial). A PLACEHOLDER: stored, not yet read; the technology tree (PW-675) will use it. The history is not run past the present.
viable_pop = 500  # a separate patch of a people with fewer people than this fades (sparse peoples need big lands)
land_pull = 0.5  # how strongly the land's goods ([[use]], at the end) move each people within its niche (0: not at all)

