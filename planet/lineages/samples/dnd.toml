# The usual D&D peoples: editable defaults (times, niches, traits, wishes are all guesses to change).
# Format: planet/lineages/spec.py. Times are years before the present ("8 Myr", "450 kyr", "12000 yr").
# origin: root | split (parents = [p]) | arrival (from outside the world) | hybrid (two parents) | template (overlay)
# temp_c / rain_mm: comfort range of the annual mean temperature and rain (soft edges).
# enabled = false switches a line off (its split children re-parent to its parent; its hybrids and templates go too).
# extinct = "T": the line dwindles and is gone by T before the present.
# persists = true: the line lives on after its last split. megafauna = true (PW-855): a handful per country (the dragons); its range hardly takes room from the peoples (history.MEGAFAUNA_PUSH); its groups inherit it.
# origin = "group", group_of = <people>: a way of life within a people (steppe and forest orcs; human seafarers, farmers,
# herders, nomads): not a split and not deeper culture. It inherits what it leaves out, takes hold where its own niche
# beats its people's, mixes freely with its people and sister groups, and rolls up into its people in the summaries.
# demography (PW-650; left out: from the traits, spec.DEMOGRAPHY; a split inherits its parent's): density (people
# per km² of full habitat, or band_km2: the land a band of 25 roams), explore (0..1: how readily it pushes into
# new land and over the sea), sea_share (0..1: the share of its frontier that takes to the water), insularity
# (0..1: resistance to mixing and to leaving home); speed_kmyr is the expansion rate (km/yr of frontier).
# way (PW-723): the way of life, a cultural trait inherited from the parent or people and settable on any line: forager,
# fisher_forager, horticulturalist, farmer, pastoral_nomad, transhumant, agro_pastoral, sea_nomad (spec.WAYS). Its goods
# replace the food rows a trait would give; it sets who tames the herd animals, who first cultivates plants, the fuels, the brief.
# body (PW-694): senses and body for the future cuisine pass; only what differs from the human-like baseline, inherited key by
# key from the first parent. Keys: sweet (tastes sweet), milk (digests milk as adults; true/false, or a share 0..1 of the people for the traits that are population frequencies; it decides only fresh or fermented dairy), milks (false: the people does not milk its animals at all; default true, PW-784), capsaicin (feels chili heat), bitter and
# smell (low | normal | high or keen), diet (herbivore | omnivore | carnivore | obligate_carnivore), raw_meat (eats raw meat
# safely), cellulose (digests it), toxic (alliums: onion and garlic; theobromine: chocolate). Real analogues: felines taste no
# sweet, birds feel no capsaicin, herding peoples keep lactase.

[meta]
name = "D&D peoples (preset)"
seed = 7
mixing_start = "3 kyr"
era = "renaissance"  # the era the present is meant to be (stone age | bronze age | classical | medieval | renaissance | industrial). A PLACEHOLDER: stored, not yet read; the technology tree (PW-675) will use it. The history is not run past the present.
viable_pop = 500  # a separate patch of a people with fewer people than this fades (sparse peoples need big lands)
dragon_km2 = 5000  # one dragon per this many km2 of its kind's country where peoples press them (PW-957). Where no people holds the
# land they keep nearer their natural density (meta.megafauna_natural below), and were many more before the peoples spread (the age of dragons). 5000: the default, a few per swamp or range in peopled country; 10000: rarer,
# a lone dragon per region; 1000: the skies are thick with them, dozens in every forest
giant_km2 = 2000  # one true giant per this many km2 of its kind's country where peoples press them (owner, PW-963 option C). Natural,
# from mass as scaled foragers: ~1 per 130-345 km2 by kind (x the land's productivity under "prey"), kept where few small folk hold the land. 2000: the default, a steading of 10
# to some 20,000 km2; 5000 and 10000: rarer; 1000: giant country, steadings in every upland
megafauna_natural = "prey"  # the megafauna's natural density where no people presses them (PW-957, PW-966). Candidates, until the owner's
# PW-967 review: "prey" (from the land's prey, wild herds and livestock: Carbone & Gittleman 2002; ~1 dragon per 530 km2 at 1 t/km2),
# "mesotherm" (uniform from mass, Marshall et al. 2021's dinosaur line: ~1 per 65 km2), "mammal" (the mammal-carnivore line: ~1 per 137)
dragon_ages = "base"  # the dragons' age schedule (PW-958): base (ancients ~7%) | younger (young-heavy, ancients ~3%) | harsher | gentler
dragon_generation = "schedule"  # the dragons' generation time (PW-959): schedule (~430 yr at base) | schedule_mass (~700) | line (each line's generation_yr)
mode = "fantasy"  # fantasy (all these peoples, the fantasy goods) | real (only the lines marked real = true: humans; no fantasy goods). PW-695; magic is PW-696.
portal_mode = "off"  # arrivals from outside the world (origin = "arrival"): off (each at its best habitat) | random | sites (PW-697)
portals = 1  # ...how many portals they come through (portal_mode random / sites)
portal_sites = ["forest", "desert", "reef", "volcano"]  # ...the places 'sites' draws on: deepest part of a large forest, middle of a desert, a coral reef, the foot of a volcano
land_pull = 0.5  # how strongly the land's goods ([[use]], at the end) move each people within its niche (0: not at all)

# ---- the reptilian line ---------------------------------------------------------------
# Stems are the last common ancestor of the peoples under them, not the first reptiles or mammals (owner ruling): roots are no older than ~20 Myr
# and the named peoples are fully realized within ~3 Myr, as the avian line is. The draconic stem IS the dragons, the elder line among the
# reptilian peoples (the ur-dragon, ~19.5 Myr, against ~3 Myr for the lizardfolk, tortles and troglodytes): extant megafauna at very low density (as the true
# giants), intelligence arriving late (not modelled: the stem is the animals; the dragonborn and kobolds are its dragon-blooded humanoid
# peoples, split off recently; the stem ends at its last split, PW-924). Its two great kinds, chromatic and metallic, split ~2.5 Myr ago (owner), and the kinds of dragon split from those, each in its own country (below; PW-924: the stems end, no dragon is of no set colour). Interfertility
# follows the split depths (PW-851): dragons are kin of dragonborn and kobolds, and of no other reptile people (T3); the lizardfolk,
# tortles and troglodytes, three Myr apart, are held T3 to one another by [[interfertile]] rows at the end, as they were when they were deeper.
[[lineage]]
id = "reptilian"
name = "reptilian stem"
body = { smell = "keen", raw_meat = true, thermo = "ecto" }  # reptiles flick their tongues to smell; swallow prey raw; ectotherms: appetite and activity follow the weather (feast and fast)
origin = "root"
at = "20 Myr"
temp_c = [18, 30]
rain_mm = [700, 3500]
prefers = ["tropical"]

[[lineage]]
id = "draconic"
name = "dragons (the draconic stem: the ur-dragon, split from the reptilian stem near the root, a recognizable modern ur-dragon by ~10 Myr; elder, dragon-blooded)"
parents = ["reptilian"]
at = "19.5 Myr"
group_size = [1, 3]  # mostly solitary, now and then a mated pair with young
generation_yr = 200  # PW-924: long-lived great wyrms; few dragons persist (history.line_mvp). Read only under meta.dragon_generation = "line" (PW-959)
megafauna = true  # a handful per country: their range hardly takes room from the peoples
# (density: natural (meta.megafauna_natural, the age schedule meta.dragon_ages) where no people presses them, meta.dragon_km2 where peoples do, PW-957)
explore = 0.3
sea_share = 0.02
insularity = 0.85
temp_c = [-6, 38]
rain_mm = [150, 3000]
prefers = ["volcanic", "mountain", "desert", "forest", "jungle", "wetland", "tundra", "savanna", "coast", "hills", "steppe"]  # PW-924: the stem lived in every kind's country; it ends at its last split (the kinds live on)
traits = ["hardy", "flies", "insular"]

# the kinds of dragon, by the country they lair in (PW-855): chromatic (red, blue, green, black, white) and metallic (gold, silver, bronze, copper, brass)

