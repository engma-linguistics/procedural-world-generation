<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Viewer</title>
<style>
  :root {
    --bg: #0b0f17; --panel: rgba(18, 24, 36, 0.92); --text: #dfe6f0; --muted: #8b97a8;
    --accent: #7cc4ff; --border: #2a3446;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  /* Explicit CSS size: the drawing buffer is devicePixelRatio x larger and the
     canvas would otherwise display at that size (2x too big on Retina). */
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  /* (no backdrop-filter by default, PW-415: a blur over the WebGL canvas makes Chrome recomposite
     the canvas under every panel repaint; at 0.92 opacity it barely showed. ?blur=1 restores it) */
  body.blur .panel { backdrop-filter: blur(4px); }
  #controls { top: 12px; left: 12px; width: 270px; max-height: calc(100vh - 24px); overflow-y: auto; }
  /* right-hand column: the info box (top) and the summary (bottom) share it, so neither covers the other */
  #rightCol { position: fixed; top: 56px; right: 12px; bottom: 12px; width: 320px; display: flex; flex-direction: column;
    align-items: flex-end; gap: 8px; pointer-events: none; z-index: 5; }
  body.run #rightCol { bottom: 76px; }
  #rightCol > .panel { position: static; pointer-events: auto; min-height: 0; overflow-y: auto; }
  #info { width: 320px; max-width: 100%; flex: 0 1 auto; font-size: 12px; }
  #summary { width: 320px; max-width: 100%; margin-top: auto; flex: 0 3 auto; max-height: 45vh; font-size: 12px; padding-top: 4px; }
  body.run #summary { max-height: calc(100vh - 380px); min-height: 32px; }
  #summary.collapsed { flex: none; overflow: hidden; padding-bottom: 4px; }
  #summary.collapsed #summaryBody { display: none; }
  #sumToggle { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; border: 0;
    padding: 2px 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
  #sumToggle:hover { color: var(--text); }
  #sumToggle .chev::before { content: '\25BE'; font-size: 13px; }
  #summary.collapsed #sumToggle .chev::before { content: '\25B4'; }
  /* the cell's info: bold labels, values beside them; dotted = has a hint */
  .ihead { margin-bottom: 4px; }
  .igrid { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline; }
  .igrid .k { font-weight: 600; color: #c4d2e4; max-width: 120px; }
  .igrid .v { min-width: 0; overflow-wrap: anywhere; }
  .hint { text-decoration: underline dotted var(--muted); text-underline-offset: 2px; cursor: help; }
  .imore { margin-top: 6px; }
  .ifoot { margin-top: 4px; font-size: 11px; }
  #detail { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 14, .55); }
  #detail[hidden] { display: none; }
  #detail .dpanel { position: relative; width: min(820px, calc(100vw - 32px)); max-height: 86vh; overflow-y: auto; padding: 14px 16px; }
  #detail .x { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  #detail .x:hover { color: var(--text); }
  .dhead { margin: 0 24px 8px 0; }
  .dgrid { columns: 2 320px; column-gap: 24px; }
  .dgrid section { break-inside: avoid; margin-bottom: 12px; }
  .dgrid h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 0 0 4px; font-weight: 600; }
  svg.schart { display: block; margin: 2px 0 12px; max-width: 100%; }
  svg.schart .lab { fill: var(--muted); font-size: 10px; }
  svg.schart .tick, svg.schart .plab { fill: #8b97a8; font: 9px ui-monospace, Menlo, monospace; text-anchor: middle; }
  svg.schart .plab { text-anchor: start; }
  svg.schart .grid { stroke: #222b3a; } svg.schart .zero { stroke: #4a5870; }
  svg.schart .range { fill: rgba(124, 196, 255, .16); stroke: rgba(124, 196, 255, .35); }
  svg.schart .t0 { fill: #79b8ff; } svg.schart .t1 { fill: #dfe6f0; } svg.schart .t2 { fill: #ffad6b; }
  svg.schart .p0 { fill: #4d7fb3; } svg.schart .p1 { fill: #9aa7b8; } svg.schart .p2 { fill: #d98c4f; }
  svg.schart .tline { fill: none; stroke: #ffad6b; stroke-width: 2; } svg.schart .tdot { fill: #ffad6b; }
  svg.schart .pbar { fill: #4d7fb3; } svg.schart .mon:hover .pbar { fill: #6a9fd6; }
  svg.schart .mcol { fill: transparent; } svg.schart .tlab { fill: #ffad6b; } svg.schart .rlab { fill: #79b8ff; }
  svg.schart .rlab, svg.schart .tlab { font: 9px ui-monospace, Menlo, monospace; }
  /* the bottom bars sit right of the control panel's column (never over it, PW-409): the legend between the
     panel and the right-hand column, the time slider centred but never left of the panel */
  #legend { bottom: 12px; left: 294px; max-width: min(520px, calc(100vw - 640px)); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  #timeline { bottom: 12px; left: max(294px, calc(50vw - 360px)); width: min(720px, calc(100vw - 306px));
    display: none; align-items: center; gap: 10px; }
  body.run #timeline { display: flex; }
  body.run #legend { bottom: 76px; }
  /* the time slider sits on a strip tinted where the run is cold (drawn on #tint) */
  #track { flex: 1; position: relative; display: flex; align-items: center; }
  #track input { flex: 1; position: relative; margin: 0; height: 18px; background: transparent; -webkit-appearance: none; appearance: none; }
  #track input::-webkit-slider-runnable-track { height: 12px; border-radius: 3px; background: rgba(255, 255, 255, .07); border: 1px solid var(--border); }
  #track input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 18px; margin-top: -4px; border-radius: 3px; background: var(--accent); }
  #track input::-moz-range-track { height: 12px; border-radius: 3px; background: rgba(255, 255, 255, .07); border: 1px solid var(--border); }
  #track input::-moz-range-thumb { width: 14px; height: 18px; border: 0; border-radius: 3px; background: var(--accent); }
  #tint { position: absolute; left: 7px; top: 50%; height: 12px; margin-top: -6px;
    width: calc(100% - 14px); border-radius: 3px; pointer-events: none; }
  /* worlds (and time zooms) made from this run, as ticks above the time slider */
  #marks { position: absolute; left: 7px; right: 7px; top: -9px; height: 8px; pointer-events: none; }
  #marks span { position: absolute; width: 0; height: 0; margin-left: -4px; border: 4px solid transparent;
    border-top: 6px solid #ffd27c; border-bottom: 0; pointer-events: auto; cursor: pointer; }
  #marks span.tz { border-top-color: #9fd3ff; }
  #marks span.fin { border-top-color: #b6f0a0; }
  /* with a vegetation view: when each plant group appeared (run meta plant_groups) */
  #marks span.veg { border-top-color: #3fc06f; }
  #marks b { position: absolute; top: -13px; transform: translateX(-50%); font: 9px ui-monospace, Menlo, monospace;
    color: #6fd08f; white-space: nowrap; pointer-events: auto; cursor: pointer; }
  .tree { margin: 2px 0 0 4px; }
  .tree div { padding: 1px 0; }
  .tree .sub { margin-left: 14px; }
  #tlabel { font-family: ui-monospace, Menlo, monospace; min-width: 92px; text-align: right; white-space: nowrap; }
  #play { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--accent);
    color: #06121f; font-size: 14px; cursor: pointer; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
  #controls select, #controls input[type=range] { width: 100%; }
  select { background: #111827; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { background: #111827; color: var(--text); border: 1px solid var(--border); padding: 3px 8px;
    border-radius: 4px; cursor: pointer; font-size: 12px; }
  .seg button.on { background: var(--accent); color: #06121f; border-color: var(--accent); }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .muted { color: var(--muted); }
  code { background: #111827; padding: 1px 4px; border-radius: 3px; font-size: 11px; word-break: break-all; }
  .grad { height: 10px; width: 260px; border-radius: 2px; }
  .ev { padding: 1px 4px; border-radius: 3px; cursor: pointer; display: grid; grid-template-columns: 30px 66px 1fr; gap: 4px; }
  .ev:hover { background: #1d2738; }
  .ev.now { background: #223652; }
  .ev .tt { text-align: right; color: var(--muted); }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10, 20, 40, .8); font-size: 20px; border: 3px dashed var(--accent); }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--accent);
    color: #06121f; padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  details summary { cursor: pointer; color: var(--muted); }
  .btn { background: #111827; color: var(--text); border: 1px solid var(--border); padding: 3px 8px;
    border-radius: 4px; cursor: pointer; font-size: 12px; }
  .btn:hover, .seg button:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  /* collapsible sections of the control panel; open/closed is remembered */
  details.sec { margin-top: 8px; }
  details.sec > summary { list-style: none; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 0 4px; user-select: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: '\25B8'; display: inline-block; width: 14px; font-size: 13px;
    line-height: 1; transition: transform .15s; }
  details.sec[open] > summary::before { transform: rotate(90deg); }
  details.sec > summary:hover { color: var(--text); }
  details.sec h2:first-child { margin-top: 2px; }
  details.sec p { margin: 4px 0 0; }
  .rbox { margin: 2px 0 0 18px; }
  .rbox label { gap: 4px; }
  .rbox input[type=range] { flex: 1; min-width: 0; }
  .rbox .val { width: 34px; text-align: right; font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
  #tiltInset { top: 12px; left: 294px; padding: 6px 8px; font-size: 11px; text-align: center; pointer-events: none; }
  #tiltInset svg { display: block; }
  #zoomBox { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #zoomBox select { padding: 2px; }
  #zoomBox .x { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .bar { height: 6px; background: #111827; border: 1px solid var(--border); border-radius: 3px; margin: 4px 0; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
  .err { color: #ff8a80; }
  /* glacial time zoom: the "from here" box, and the sea-level chart of a time zoom */
  .tzBox { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .tzBox select { padding: 1px; }
  svg.tzchart { display: block; margin: 4px 0 2px; cursor: crosshair; }
  svg.tzchart text { font: 9px ui-monospace, Menlo, monospace; fill: #8b97a8; }
  a { color: var(--accent); }
  /* highlights list */
  #hlList { max-height: 300px; overflow-y: auto; margin-top: 4px; }
  .hl { padding: 2px 4px; border-radius: 3px; cursor: pointer; }
  .hl:hover { background: #1d2738; }
  .hl.sel { background: #223652; }
  .hl .k { color: var(--muted); display: inline-block; min-width: 20px; }
  .hl .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  #hlCats { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  #hlCats button { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #151c28; color: var(--muted); border: 1px solid var(--border); cursor: pointer; }
  #hlCats button.on { color: #fff; border-color: currentColor; }
  #hlCats button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .hl .blurb { color: var(--muted); padding: 2px 0 2px 20px; }
  #hlList.stale .hl b { opacity: .6; }
  /* top right, so it stays put over zoom.html too (which moves its own info box down when embedded) */
  #tabs { top: 12px; right: 12px; padding: 4px; z-index: 20; }
  #zoomFrame { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: none; z-index: 10; background: var(--bg); }
  body.zoomTab #zoomFrame { display: block; }
  body.zoomTab .panel:not(#tabs), body.zoomTab #toast { display: none !important; }
  @media (max-width: 700px) { #info, #summary, #tiltInset { display: none; } #controls { width: 220px; }
    #legend { left: 244px; max-width: calc(100vw - 256px); }
    #timeline { left: 244px; width: calc(100vw - 256px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="controls" class="panel">
  <h1>Planet Viewer</h1>
  <div class="row" style="gap:6px"><select id="worldSel" style="flex:1;min-width:0"></select>
    <button id="delBtn" title="Delete this run/world from disk">Delete</button></div>
  <div class="muted" style="margin-top:4px">or drop a world .json anywhere</div>

  <details class="sec" data-sec="view" open><summary>View</summary>
    <div class="row">
      <div class="row seg" id="modeSeg">
        <button data-v="globe" class="on">Globe</button><button data-v="map">Flat map</button>
      </div>
      <button id="northUp" class="btn" title="Turn the globe so north points up, keeping the longitude (key N)">North up</button>
    </div>
    <label style="margin-top:6px" title="The ground at its height (ice sheets and lakes included), the sea floor under a translucent sea, lit by a low sun; the flat map becomes a relief model you can tilt (relief.js)"><input type="checkbox" id="relief3d"> 3D relief</label>
    <div id="reliefBox" class="rbox" hidden>
      <label title="Vertical exaggeration of the 3D relief">height &times; <input type="range" id="reliefEx" min="5" max="200" step="5" value="50"><span class="val" id="reliefExV"></span></label>
      <label title="Where the sun shines from, on screen (counter-clockwise from the right)">sun from <input type="range" id="sunAz" min="0" max="360" step="5" value="135"><span class="val" id="sunAzV"></span></label>
      <label title="How low the sun is: 0 = from behind you (no shadows), 90 = grazing">sun low <input type="range" id="sunEl" min="0" max="85" step="1" value="60"><span class="val" id="sunElV"></span></label>
      <label title="Sink the sea floor to its depth under a translucent sea (trenches, ridges, shelves)"><input type="checkbox" id="seaFloor" checked> sea floor</label>
    </div>
  </details>

  <details class="sec" data-sec="layer" open><summary>Colour by</summary>
    <div class="row seg" id="layerSeg"></div>
    <div class="row seg" id="obsSeg" style="margin-top:6px;align-items:center;display:none"
      title="Our climate model on the real Earth, or what is observed there, or the difference (model minus observed)">
      <button data-v="model" class="on">model</button><button data-v="obs">observed</button><button data-v="diff">difference</button></div>
    <!-- the season of temperature / rain (worlds with *_jul / *_jan layers); shared with the winds' picker and ?season= -->
    <!-- the plant functional type the 'plant type' layer shows (?pft=) -->
    <label id="pftRow" style="margin-top:6px;display:none" title="Cover of one plant functional type: where are the larches?">
      plant type <select id="pftSel" style="flex: 1; min-width: 0; padding: 1px"></select></label>
    <label id="seasonRow" style="margin-top:6px;display:none" title="Temperature and rain over the year, or in July / January (rain: the April-September / October-March half-year, as a rate per year)">
      season <select id="layerSeason" style="flex: none; width: auto; padding: 1px">
        <option value="">year</option><option value="jul">July</option><option value="jan">January</option></select></label>
  </details>

  <details class="sec" data-sec="highlights" open><summary>Highlights</summary>
    <div class="row" style="align-items:center"><button id="hlFind" class="btn">Find highlights</button>
      <label title="Markers and numbers on the globe"><input type="checkbox" id="hlMarks" checked> markers</label></div>
    <div id="hlStatus" class="muted"></div>
    <div id="hlCats"></div>
    <div id="hlList"></div>
  </details>

  <details class="sec" data-sec="overlays" open><summary>Overlays</summary>
    <label data-needs="flow"><input type="checkbox" id="rivers" checked> Rivers</label>
    <label class="runOnly"><input type="checkbox" id="events" checked> Event markers</label>
    <label data-needs-volc="hotspots"><input type="checkbox" id="hotspots" checked> Hotspots (mantle plumes)</label>
    <label data-needs-volc="volcanoes"><input type="checkbox" id="volcanoes" checked> Volcanoes</label>
    <label data-needs-volc="volcTable" title="Also the extinct volcanoes: dead arc cones, old calderas, seamounts and guyots (hover a cell to see what is in it)"><input type="checkbox" id="volcExtinct"> &nbsp;&nbsp;extinct ones too</label>
    <!-- data-needs: shown only when the run frame or world has that layer -->
    <label data-needs="wind_e"><input type="checkbox" id="winds"> Winds <span id="windYear">(yearly average)</span>
      <select id="windSeason" data-needs="wind_jul_e" style="flex: none; width: auto; padding: 1px" title="Surface winds averaged over the year, or over the July / January half-years (monsoons reverse between them)">
        <option value="">year</option><option value="jul">July</option><option value="jan">January</option></select></label>
    <label data-needs="current_e" title="Surface currents (wind-driven gyres) as streamlines: brighter = faster, chevrons show the way"><input type="checkbox" id="currents"> Ocean currents</label>
    <label data-needs="sinking" title="The thermohaline overturning: where deep water sinks (rings, sized by Sv), the warm surface inflow feeding it (the model's route) and a schematic of the deep return flow (not modelled)"><input type="checkbox" id="overturning"> Overturning (deep water)</label>
    <label data-needs="jet_e" title="The jet stream's core: where the upper wind (~10 km up) is fastest, for January and July (the season picker shows one); a day's jet meanders, these are half-year means"><input type="checkbox" id="jet"> Jet stream (seasonal core)</label>
    <label data-needs="cloud_jul" title="Clouds over the map: patches covering the season's cloud share (the cloud layer), shapes made up (noise). Best with the satellite layer."><input type="checkbox" id="clouds"> Clouds</label>
    <label id="arrowsLbl"><input type="checkbox" id="arrows"> Plate motion arrows</label>
    <label><input type="checkbox" id="axis" checked> Spin axis and tilt</label>
    <label><input type="checkbox" id="tropics"> Equator, tropics, polar circles</label>
  </details>

  <details class="sec" data-sec="display"><summary>Display</summary>
    <label><input type="checkbox" id="outlines"> Cell outlines</label>
    <label><input type="checkbox" id="pentas"> Highlight the 12 pentagons</label>
    <label><input type="checkbox" id="smooth"> Smooth colours (hide cells)</label>
    <label><input type="checkbox" id="spin"> Auto-rotate</label>
  </details>

  <details class="sec" data-sec="sliders"><summary>Sliders</summary>
    <h2>Relief exaggeration <span id="reliefVal" class="muted"></span></h2>
    <input type="range" id="relief" min="0" max="80" value="25">
    <h2>River threshold <span id="riverVal" class="muted"></span></h2>
    <input type="range" id="riverQ" min="80" max="99.5" step="0.5" value="95">
    <div class="runOnly">
      <h2>Playback speed</h2>
      <select id="fps"><option value="4">slow</option><option value="10" selected>normal</option>
        <option value="20">fast</option><option value="40">very fast</option></select>
    </div>
  </details>

</div>

<!-- the right-hand column: the cell's info box on top, the summary at the bottom (one column, so they never overlap) -->
<div id="rightCol">
  <div id="info" class="panel"><div id="infoText"><span class="muted">Hover a cell. Click to copy its description
    and to zoom into that region.</span></div><div id="zoomBox" hidden></div></div>
  <div id="summary" class="panel"><button id="sumToggle" title="Show or hide the summary (remembered)"><span id="sumTitle">Summary</span><span class="chev"></span></button>
    <div id="summaryBody"></div></div>
</div>
<!-- everything about one cell ("More detail" in the info box) -->
<div id="detail" hidden><div class="dpanel panel" role="dialog" aria-label="Cell detail">
  <button class="x" data-act="close" title="Close (Esc)">&times;</button><div id="detailBody"></div></div></div>
<div id="tiltInset" class="panel" title="The spin axis against the plane of the orbit"></div>
<div id="tabs" class="panel row seg"><button data-tab="globe" class="on">Globe</button><button data-tab="zoom">Regional zoom</button></div>
<iframe id="zoomFrame" title="Regional zoom"></iframe>
<div id="legend" class="panel"></div>
<div id="timeline" class="panel">
  <button id="play" title="Play / pause (space)">&#9654;</button>
  <div id="track"><canvas id="tint"></canvas><div id="marks"></div><input type="range" id="frame" min="0" max="0" value="0"></div>
  <span id="tlabel"></span>
</div>
<div id="drop">Drop world .json</div>
<div id="toast"></div>

<script src="pickfilter.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import * as Relief from './relief.js';

const $ = (id) => document.getElementById(id);
const R_EARTH = 6371000;
const CMYR = 637.1;  // rad/Myr on the unit sphere -> cm/yr

// ------------------------------------------------------------ three setup
// Diagnostic switches for the flicker hunt (PW-415), all off by default: ?logdepth=1

      const sp = textSprite(label, color);
      sp.center.set(-0.15, 0.5);  // label just right of the tip, whichever way the globe is turned
      sp.position.set(0, y * end, 0);
      axisGroup.add(cone, sp);
    }
  }
  if ($('tropics').checked) {
    // [latitude, colour, opacity]: equator, tropics at +-tilt, polar circles at +-(90 - tilt)
    const circles = [[0, 0xffffff, 0.5], [tilt, 0xffc864, 0.75], [-tilt, 0xffc864, 0.75],
                     [90 - tilt, 0x9fd8ff, 0.7], [tilt - 90, 0x9fd8ff, 0.7]];
    for (const [la, color, op] of circles) {
      const pts = [];
      if (globe) {
        for (let k = 0; k < 128; k++) pts.push(...llPos(la, k / 128 * 360, 1.006), ...llPos(la, (k + 1) / 128 * 360, 1.006));
      } else pts.push(-2, la / 90, 0.004, 2, la / 90, 0.004);
      axisGroup.add(lineObj(pts, color, op));
    }
  }
  renderTiltInset(tilt);
}

// small side view: the orbit plane (dashed), the planet, and its axis leaning by the tilt
function renderTiltInset(tilt) {
  const el = $('tiltInset');
  el.style.display = $('axis').checked ? '' : 'none';
  const a = tilt * Math.PI / 180, cx = 72, cy = 36, L = 30, r = 13;
  const ax = L * Math.sin(a), ay = L * Math.cos(a), ex = r * Math.cos(a), ey = r * Math.sin(a);
  const arcR = 22, arcEnd = [cx + arcR * Math.sin(a), cy - arcR * Math.cos(a)];
  el.innerHTML = `<svg width="116" height="72" viewBox="0 0 116 72">
    <line x1="2" y1="${cy}" x2="114" y2="${cy}" stroke="#8b97a8" stroke-dasharray="3 3"/>
    <text x="2" y="${cy - 4}" fill="#8b97a8" font-size="8">orbit plane</text>
    <line x1="${cx}" y1="3" x2="${cx}" y2="69" stroke="#8b97a8" stroke-width=".6" stroke-dasharray="1 2"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#2d68a3" stroke="#6aa7d8"/>
    <line x1="${cx - ex}" y1="${cy - ey}" x2="${cx + ex}" y2="${cy + ey}" stroke="#ffffff" stroke-opacity=".5"/>
    <path d="M ${cx} ${cy - arcR} A ${arcR} ${arcR} 0 0 1 ${arcEnd[0]} ${arcEnd[1]}" fill="none" stroke="#ffc864"/>
    <line x1="${cx - ax}" y1="${cy + ay}" x2="${cx + ax}" y2="${cy - ay}" stroke="#ffffff" stroke-width="1.5"/>
    <text x="${cx + ax + 1}" y="${cy - ay + 1}" fill="#ff8a6b" font-size="9" font-weight="bold">N</text>
  </svg>tilt ${+tilt.toFixed(1)}°`;
}

function northUp() {
  if (state.mode !== 'globe') { fitMap(); return; }
  // keep the camera's longitude and distance, put it level with the equator
  const p = camera.position, d = p.distanceTo(controls.target);
  const az = Math.atan2(p.x - controls.target.x, p.z - controls.target.z);
  controls.target.set(0, 0, 0);
  camera.position.set(d * Math.sin(az), 0, d * Math.cos(az));
  camera.lookAt(0, 0, 0);
}
$('northUp').addEventListener('click', northUp);

// a colour bar for RAMPS[key]; labels (optional) replace the end values
function rampLegend(key, units, labels) {
  const stops = RAMPS[key], lo = stops[0][0], hi = stops[stops.length - 1][0];
  const g = stops.map(([v, c]) => `${c} ${((v - lo) / (hi - lo) * 100).toFixed(1)}%`).join(',');
  const [a, b] = labels || [lo, hi];
  return `<div><div class="grad" style="background:linear-gradient(90deg,${g})"></div>
    <div class="row" style="justify-content:space-between;width:260px"><span>${a}</span><span class="muted">${units}</span><span>${b}</span></div></div>`;
}

function renderLegend() {
  const el = $('legend');

  // the model / observed / difference switch: only for an Earth world's temperature, rainfall, climate and sunshine
  $('obsSeg').style.display = V.kind === 'world' && V.layers.obs_temperature && OBS_LAYERS[state.layer] ? '' : 'none';
  // (a run's seasonal layers download when a season is picked: the picker shows if the run has them)

  $('seasonRow').style.display = sk && (V.layers[sk] || (V.kind === 'run' && V.run.layers[sk])) && !ov ? '' : 'none';
  $('pftRow').style.display = state.layer === 'plant type' && V.pfts?.length ? '' : 'none';
  drawMarks();  // (the plant groups' ticks come and go with the vegetation views)
  const sw = (color, text) => `<span><span class="sw" style="background:${color}"></span>${text}</span>`;
  if (ov && ov.diff && state.layer === 'climate') {
    el.innerHTML = sw('#3fae5a', 'same class') + sw('#e8c547', 'same group (A, B, C, D or E), another class') +
      sw('#d0453a', 'another group') + sw('#4a4f57', 'no observation') + '<span class="muted">(model vs Kottek et al. 2006 Köppen)</span>';
  } else if (ov && ov.diff && state.layer === 'temperature') {
    el.innerHTML = rampLegend('temperature difference', UNITS['temperature difference']) +
      '<span class="muted">observed: NCEP/NCAR 2 m air, 1981–2010</span>';
  } else if (ov && ov.diff && state.layer === 'sunshine') {
    el.innerHTML = rampLegend('sunshine difference', 'h of sunshine a day, model minus observed') +
      '<span class="muted">observed: CRU CL 2.0 sunshine, 1961–90 (land)</span>';
  } else if (ov && ov.diff) {
    el.innerHTML = rampLegend('rainfall ratio', 'model ÷ observed rainfall', ['¼×', '4×']) +
      '<span class="muted">observed: GPCC (land), GPCP where GPCC has none</span>';
  } else if (state.layer === 'vegetation') {
    // the named types present, grouped (forest, savanna, desert, ...), with their share of the land
    const L = V.layers, cnt = new Map();
    let land = 0;
    for (let i = 0; i < V.n; i++) if (L.elevation[i] > 0) { cnt.set(L.vegetation[i], (cnt.get(L.vegetation[i]) || 0) + 1); land++; }
    const groups = [];
    for (const t of V.vegTypes) if (cnt.has(t.id) && t.id > 0) {
      if (!groups.length || groups[groups.length - 1][0] !== t.group) groups.push([t.group, []]);
      groups[groups.length - 1][1].push(t);
    }
    const share = (k) => 100 * cnt.get(k) / land, pct = (k) => (share(k) < 1 ? share(k).toFixed(1) : share(k).toFixed(0));
    // the types covering at least 0.5% of the land, by group; the rest only counted (hover a cell for them)
    let rare = 0;
    el.innerHTML = groups.map(([g, ts]) => {
      const big = ts.filter((t) => share(t.id) >= 0.5 || t.id >= 57);
      rare += ts.length - big.length;
      return big.length ? `<span><b class="muted" style="font-weight:600">${g}:</b></span>` +
        big.map((t) => `<span title="${esc(t.text || t.name)}">${sw(t.color, '')}${t.name} ${pct(t.id)}%</span>`).join('') : '';
    }).join('') + `<span class="muted">(named vegetation types, % of land${rare ? `; ${rare} rarer types not listed` : ''})</span>`;
  } else if (state.layer === 'soils') {
    // the soil types present with their share of the land
    const L = V.layers, cnt = new Map();
    let land = 0;

    el.innerHTML = V.soilTypes.filter((t) => cnt.has(t.id)).map((t) => {
      const p = 100 * cnt.get(t.id) / land;

    }).join('') + '<span class="muted">(soil types, % of land; hover a type for its WRB / USDA name)</span>';
  } else if (state.layer === 'coastal life') {

  } else if (state.layer === 'satellite') {

// the overturning's strength and its main sinking sites (world meta, ocean.loop_schematic)
function overturningLine(o) {
  if (!o) return '';
  const ll = (s) => `${Math.abs(s.lat).toFixed(0)}°${s.lat >= 0 ? 'N' : 'S'} ${Math.abs(s.lon).toFixed(0)}°${s.lon >= 0 ? 'E' : 'W'}`;
  const sites = (o.sites || []).filter((s) => s.sv >= 0.3).sort((a, b) => b.sv - a.sv);
  return `<span title="Thermohaline overturning (ocean.py): deep water formed where the winter sea is densest. Tick &quot;Overturning&quot; under Overlays to see it.">` +
    `<span class="muted">Overturning:</span> ${o.sv.toFixed(1)} Sv sinking (north ${o.north_sv.toFixed(1)}, south ${o.south_sv.toFixed(1)})` +
    (sites.length ? `<span class="muted"> · </span>${sites.slice(0, 4).map((s) => `${ll(s)} ${s.sv.toFixed(1)}`).join(', ')}` : ' · no sinking site') +
    '</span><br>';
}

function renderRunSummary() {
  const r = V.run, m = r.meta, f = r.frames[V.frame], s = f.stats;
  const win = eventWindow();
  const evs = r.events.map((e, idx) =>
    `<div class="ev ${Math.abs(e.t - V.t) <= win ? 'now' : ''}" data-t="${e.t}"><span class="tt">${e.t}</span><span style="color:${hexColor(EVENT_COLORS[e.kind] || 0xffffff)}">${e.kind}</span><span>${e.text}</span></div>`).join('');
  const head = V.tz ? timezoomSummary() : `<b>${r.id || ''}</b> ${r.name} <span class="muted">· ${m.cells} cells · made ${m.created}</span><br>
    t = ${V.t} Myr · ${s.plates} plates · land ${s.land_pct}% · ${s.landmasses} landmasses (largest ${s.largest_landmass_pct}%)<br>
    plate speed: mean ${s.mean_speed_cmyr}, max ${s.max_speed_cmyr} cm/yr · peak ${s.max_elev_m} m<br>
    ${s.global_temp_c != null ? `global mean ${s.global_temp_c} °C (Earth today ~14.5) · land ice ${s.ice_pct}% of surface · sea level ${s.sea_level_m} m<br>` : ''}
    ${finishBox()}
    ${timezoomBox()}`;
  $('sumTitle').textContent = V.tz ? 'Time zoom and events' : 'Run and events';
  $('summaryBody').innerHTML = `${head}${V.tz ? '' : runTree()}
    <h2>Events <span class="muted">(click to jump${V.tz ? '; t in kyr' : ''})</span></h2><div id="evlist">${evs || '<span class="muted">none</span>'}</div>`;
  const now = $('summary').querySelector('.ev.now');
  if (now && state.playing) now.scrollIntoView({ block: 'nearest' });
}

// ------------------------------------------------------------ glacial time zooms
// A time zoom (planet/timezoom.py) is stored as a run with time in kyr since
// its start: a few hundred kyr of ice ages from one moment of a main run (or
// today's Earth), with the geology frozen. Its summary has the sea-level curve.
function timeLabel(t) {
  if (!V.tz) return `${t} Myr`;
  return V.tzEarth ? `+${t} kyr from today` : `+${t} kyr`;
}

function timezoomSummary() {
  const r = V.run, m = r.meta, s = r.frames[V.frame].stats;
  const when = V.tzEarth ? `<b>+${V.t} kyr</b> from today's Earth`
    : `<b>+${V.t} kyr</b> after ${m.source_name} @ ${m.at_myr} Myr`;
  const sign = (x, d = 0) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
  const src = V.tzEarth ? 'earth' : m.source_run;
  const opts = (m.at_myr ? ` --at ${m.at_myr}` : '') + ` --kyr ${m.kyr}` + (m.step_kyr !== 0.5 ? ` --step ${m.step_kyr}` : '');
  return `<b>${r.id || ''}</b> ${r.name} <span class="muted">· glacial time zoom · ${m.cells} cells · made ${m.created}</span><br>
    ${when}<br>
    sea level ${sign(s.sea_level_change_m)} m vs the start · ice ${s.ice_volume_mkm3} M km³ (land ice on ${s.ice_pct}% of the surface,
    thickest ${s.max_ice_m} m) · global mean ${s.global_temp_c} °C<br>
    <span class="muted">orbit:</span> obliquity ${s.obliquity.toFixed(2)}° · eccentricity ${s.eccentricity.toFixed(4)} ·
    65°N July sun ${sign(s.insol_65n_jul_anom, 1)} W/m² <span class="muted" title="vs. ${V.tzEarth ? "today's orbit" : 'a circular orbit at the mean tilt'}; precession index e·sin(perihelion) ${s.precession_index}">(?)</span>
    ${timezoomChart()}
    ${V.tzEarth ? '' : `<span class="muted">From</span> ${sourceLink(m.source_run, m.at_myr)}<br>`}
    <span class="muted">Remake:</span> <code>uv run python -m planet timezoom ${src}${opts}</code>
    ${finishBox()}`;
}

// The whole time zoom at a glance: sea level (falls as the ice grows; ice
// volume on the right axis) and, below, the summer sun at 65 N that drives
// it. The white line is the frame on screen; click to jump.
const CHART = { w: 296, top: 72, sun: 24, left: 30, right: 30 };
function timezoomChart() {
  const fr = V.run.frames, { w, top, sun, left, right } = CHART;
  const ts = fr.map((f) => f.t), t0 = ts[0], t1 = ts[ts.length - 1];
  const x = (t) => left + (t - t0) / (t1 - t0 || 1) * (w - left - right);
  const sl = fr.map((f) => f.stats.sea_level_change_m), vol = fr.map((f) => f.stats.ice_volume_mkm3);
  const hi = Math.max(...sl, 5), lo = Math.min(...sl, -5);
  const y = (v) => 4 + (hi - v) / (hi - lo) * (top - 8);
  const ins = fr.map((f) => f.stats.insol_65n_jul_anom), im = Math.max(...ins.map(Math.abs), 1);
  const ys = (v) => top + 4 + (1 - v / im) / 2 * (sun - 6);
  const line = (vals, yf) => vals.map((v, i) => `${i ? 'L' : 'M'}${x(ts[i]).toFixed(1)},${yf(v).toFixed(1)}`).join('');
  const iHi = sl.indexOf(Math.max(...sl)), iLo = sl.indexOf(Math.min(...sl));  // ice volume at the two extremes
  const ev = V.run.events.map((e) => `<circle cx="${x(e.t).toFixed(1)}" cy="${y(sl[Math.max(0, ts.indexOf(e.t))]).toFixed(1)}" r="2"
    fill="${hexColor(EVENT_COLORS[e.kind] || 0xffffff)}"/>`).join('');
  const xn = x(V.t).toFixed(1), h = top + sun + 12;
  return `<svg class="tzchart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <line x1="${left}" x2="${w - right}" y1="${y(0)}" y2="${y(0)}" stroke="#2a3446"/>
    <path d="${line(sl, y)}L${x(t1)},${y(0)}L${x(t0)},${y(0)}Z" fill="#5d8fcb" fill-opacity=".25"/>
    <path d="${line(sl, y)}" fill="none" stroke="#7cc4ff" stroke-width="1.4"/>${ev}
    <text x="${left - 3}" y="${y(hi) + 4}" text-anchor="end">${Math.round(hi)}</text>
    <text x="${left - 3}" y="${y(lo)}" text-anchor="end">${Math.round(lo)}</text>
    <text x="${left - 3}" y="${y(0) + 3}" text-anchor="end">0 m</text>
    <text x="${w - right + 3}" y="${y(sl[iHi]) + 4}">${vol[iHi].toFixed(0)}</text>
    <text x="${w - right + 3}" y="${y(sl[iLo])}">${vol[iLo].toFixed(0)}</text>
    <line x1="${left}" x2="${w - right}" y1="${ys(0)}" y2="${ys(0)}" stroke="#2a3446"/>
    <path d="${line(ins, ys)}" fill="none" stroke="#ffc864" stroke-width="1"/>
    <text x="${left - 3}" y="${ys(0) + 3}" text-anchor="end">sun</text>
    <line x1="${xn}" x2="${xn}" y1="0" y2="${top + sun}" stroke="#ffffff" stroke-opacity=".85"/>
    <text x="${left}" y="${h - 1}">${t0}</text><text x="${w - right}" y="${h - 1}" text-anchor="end">${t1} kyr</text>
  </svg><div class="muted" style="font-size:11px">Blue: sea level vs the start (m, left) = ice volume (M km³, right).
    Yellow: summer sun at 65°N, the orbital forcing. Click the chart to jump.</div>`;
}

// "Glacial time zoom from here" (main runs): the server runs it as a
// background job, ~4 min per 1000 kyr at level 6, then we open it.
let tzJob = null, tzKyr = 300;
const TZ_KYR = [100, 300, 1000];
function timezoomBox() {
  const s = V.run.frames[V.frame].stats;
  let html = '<div class="tzBox">';
  if (s.sea_level_m == null) return html + '<span class="muted">Glacial time zooms need a run made with the climate model.</span></div>';
  const min = Math.max(1, Math.round(4 * tzKyr / 1000 * V.n / 40962));
  const busy = tzJob && !tzJob.finished;
  html += `<b>Glacial time zoom from here</b> <span class="muted" title="${COLD_HELP}">(ice ages at ${V.t} Myr;
    blue under the time slider = cold eras)</span><br>
    <div class="row" style="align-items:center;margin-top:3px">
      <select id="tzKyr">${TZ_KYR.map((k) => `<option value="${k}" ${k === tzKyr ? 'selected' : ''}>${k} kyr</option>`).join('')}</select>
      <button class="btn" data-act="tz" ${busy ? 'disabled' : ''}>Start</button>
      <span class="muted">~${min} min${coldness(s) < 0.05 ? '; a warm era: expect little ice' : ''}</span></div>`;
  if (tzJob) {
    const j = tzJob;
    html += `<div style="margin-top:4px">${j.label}: `;
    if (j.status === 'error') html += `<span class="err">${j.error}</span>`;
    else if (j.status === 'done') html += `done, <a href="#" data-act="openTz">open time zoom ${j.run}</a>`;
    else html += `<span class="muted">${j.message || j.status}</span><div class="bar"><div style="width:${Math.round(100 * (j.progress || 0))}%"></div></div>`;
    html += '</div>';
  }
  return html + '</div>';
}

async function startTimezoom() {
  if (tzJob && !tzJob.finished) return;
  const req = { run: V.dir, t: V.t, kyr: tzKyr };
  const job = tzJob = { label: `${tzKyr} kyr from ${V.dir} @ ${V.t} Myr`, status: 'starting', progress: 0 };
  renderRunSummary();
  let r = null, out = {};
  try {
    r = await fetch('../api/timezoom', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req) });
    out = await r.json().catch(() => ({}));
  } catch (err) { r = null; }
  if (!r || r.status === 501 || (r.status === 404 && !out.error)) {
    Object.assign(job, { status: 'error', finished: true, error: 'The server has no time zoom API. Restart it: uv run python -m planet serve' });
  } else if (!r.ok) Object.assign(job, { status: 'error', finished: true, error: out.error || `HTTP ${r.status}` });
  if (job.finished) { if (V.kind === 'run' && !V.tz) renderRunSummary(); return; }
  while (job === tzJob) {
    let j;
    j = await fetchJob(out.job);
    Object.assign(job, j);
    if (j.status === 'done' || j.status === 'error') job.finished = true;
    if (V.kind === 'run' && !V.tz && !state.playing) renderRunSummary();
    if (j.status === 'done') { await openRun(j.run); return; }
    if (job.finished) return;
    await new Promise((ok) => setTimeout(ok, 1500));
  }
}

// "Finish world here" (PW-091/193): a full world (climate, rivers, lakes,
// biomes, sea) at the moment on screen. In a time zoom: that frame's ice,
// pressed-down bed, sea level and climate on the source run's geology
// (planet/finish.py); in a main run: the keyframe's world (what the Zoom
// button builds). A job on the server, then the world opens.
let finJob = null;
const finishedOf = (tzId) => IDX.worlds.filter((w) => w.timezoom === tzId).sort((a, b) => a.timezoom_kyr - b.timezoom_kyr);
function finishBox() {
  const s = V.run.frames[V.frame].stats;
  if (!V.tz && s.sea_level_m == null) return '';
  const here = V.tz ? `+${V.t} kyr` : `${V.t} Myr`;
  const made = V.tz ? finishedOf(V.run.id || V.dir).find((w) => w.timezoom_kyr === V.t)
    : IDX.worlds.find((w) => w.source_run === V.dir && w.t_myr === V.t && !w.timezoom);
  const busy = finJob && !finJob.finished;
  const sec = Math.max(5, Math.round(20 * V.n / 40962));
  let html = `<div class="tzBox"><b>Finish world here</b> <span class="muted">(${here}: ${V.tz
    ? "this frame's ice, sea level and climate on the run's geology" : 'the full world at this keyframe'};
    then zooms and highlights)</span><br>
    <div class="row" style="align-items:center;margin-top:3px">` +
    (made ? `<a href="?world=${made.file}" data-world="${made.file}">open world ${made.id}</a> <span class="muted">(made already)</span>`
      : `<button class="btn" data-act="finish" ${busy ? 'disabled' : ''}>Finish world here</button>
         <span class="muted">~${sec < 60 ? sec + ' s' : Math.round(sec / 60) + ' min'}</span>`) + '</div>';
  if (finJob && finJob.view === viewKey()) {
    const j = finJob;
    html += `<div style="margin-top:4px">${j.label}: `;
    if (j.status === 'error') html += `<span class="err">${esc(j.error)}</span>`;
    else if (j.status === 'done') html += `done, <a href="?world=${j.world}.json" data-world="${j.world}.json">open world ${j.world}</a>`;
    else html += `<span class="muted">${esc(j.message || j.status)}</span><div class="bar"><div style="width:${Math.round(100 * (j.progress || 0))}%"></div></div>`;
    html += '</div>';
  }
  if (V.tz) {
    const fins = finishedOf(V.run.id || V.dir);
    if (fins.length) html += `<span class="muted">Finished worlds of this time zoom:</span> ${fins.map((w) =>
      `<a href="?world=${w.file}" data-world="${w.file}" title="sea level ${Math.round(w.sea_level_change_m)} m vs the start">+${w.timezoom_kyr} kyr</a>`).join(', ')}<br>`;
    html += `<span class="muted">CLI:</span> <code>uv run python -m planet finish ${V.run.id || V.dir} --kyr ${V.t}</code>`;
  } else html += `<span class="muted">CLI:</span> <code>uv run python -m planet finish ${V.run.id || V.dir} --at ${V.t}</code>
    <span class="muted">(or <code>slice</code>: replayed, exact)</span>`;
  return html + '</div>';
}

async function startFinish() {
  if (finJob && !finJob.finished) return;
  const req = V.tz ? { timezoom: V.dir, kyr: V.t } : { run: V.dir, t: V.t };
  const job = finJob = { label: V.tz ? `world at +${V.t} kyr` : `world at ${V.t} Myr`, view: viewKey(), status: 'starting', progress: 0 };
  renderRunSummary();
  let r = null, out = {};
  try {
    r = await fetch('../api/finish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req) });
    out = await r.json().catch(() => ({}));
  } catch (err) { r = null; }
  if (!r || r.status === 501 || (r.status === 404 && !out.error)) {
    Object.assign(job, { status: 'error', finished: true, error: 'The server has no finish API. Restart it: uv run python -m planet serve' });
  } else if (!r.ok) Object.assign(job, { status: 'error', finished: true, error: out.error || `HTTP ${r.status}` });
  if (job.finished) { if (V.kind === 'run') renderRunSummary(); return; }
  while (job === finJob) {
    let j;
    j = await fetchJob(out.job);
    Object.assign(job, j);
    if (j.status === 'done' || j.status === 'error') job.finished = true;
    if (V.kind === 'run' && !state.playing) renderRunSummary();
    if (j.status === 'done') { await fillSelector(); await openWorld(j.world + '.json'); return; }
    if (job.finished) return;
    await new Promise((ok) => setTimeout(ok, 1000));
  }
}

// ------------------------------------------------------------ provenance (PW-128)
// What came from what, from the indexes: each world's source run and time
// (worlds/index.json), each zoom's world (zooms/index.json) and each time
// zoom's source run (runs/index.json). Filled by fillSelector().
let IDX = { runs: [], worlds: [], zooms: [] };
const esc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const runOf = (id) => IDX.runs.find((r) => r.dir === id || r.id === id);
// a world from a run is "<run name> @ T Myr"; others go by their name
function worldTitle(w) {
  if (!w.source_run) return w.name;
  if (w.source_run === 'earth') return w.timezoom ? `Earth + ${w.timezoom_kyr} kyr (finished)` : w.name;
  return `${w.source_run_name || runOf(w.source_run)?.name || 'run ' + w.source_run} @ ${w.t_myr} Myr` +
    (w.timezoom ? ` + ${w.timezoom_kyr} kyr (finished)` : '');
}
// a finished world's time zoom and frame, linked to open the time zoom there
function timezoomLink(tzId, kyr) {
  const r = runOf(tzId);
  return r ? `<a href="?run=${r.dir}&t=${kyr}" data-run="${r.dir}" data-t="${kyr}" title="Open time zoom ${tzId} at +${kyr} kyr">time zoom ${tzId} + ${kyr} kyr</a>`
    : `time zoom ${tzId} + ${kyr} kyr <span class="muted">(deleted)</span>`;
}
// '<run name> @ T Myr', linked to open the run at that time
function sourceLink(runId, t) {
  const r = runOf(runId), label = `${esc(r?.name || 'run ' + runId)} @ ${t} Myr`;
  return r ? `<a href="?run=${runId}&t=${t}" data-run="${runId}" data-t="${t}" title="Open run ${runId} at ${t} Myr">${label}</a> <span class="muted">(run ${runId})</span>`
    : `${label} <span class="muted">(run ${runId}, deleted)</span>`;
}
// a zoom's id, linked to open it in the Regional zoom tab (its size and place on hover)
const zoomLink = (z) => `<a href="#" data-zoom="${z.id}" title="${esc(z.name)}">${z.id}</a>`;
function zoomsOf(worldId) {
  const zs = IDX.zooms.filter((z) => z.world === worldId);
  return zs.length ? `<span class="muted">Zooms of this world:</span> ${zs.map(zoomLink).join(', ')}<br>` : '';
}
const madeFrom = (runId) => ({
  worlds: IDX.worlds.filter((w) => w.source_run === runId && !w.timezoom).sort((a, b) => a.t_myr - b.t_myr),
  tzs: IDX.runs.filter((r) => r.kind === 'timezoom' && r.source_run === runId).sort((a, b) => a.at_myr - b.at_myr),
});
// a main run's worlds (with their zooms) and time zooms, as a small tree
function runTree() {
  const { worlds, tzs } = madeFrom(V.dir);
  let html = '<h2 title="Worlds and glacial time zooms made from this run; their times are the ticks above the time slider">Made from this run</h2>';
  if (!worlds.length && !tzs.length) return html + '<span class="muted">nothing yet (a Zoom or Highlights here makes a world at that time)</span>';
  html += '<div class="tree">' + worlds.map((w) => {
    const zs = IDX.zooms.filter((z) => z.world === w.id), named = w.name !== worldTitle(w) ? ` <span class="muted">${esc(w.name)}</span>` : '';
    return `<div><a href="#" data-jump="${w.t_myr}" title="Go to ${w.t_myr} Myr">${w.t_myr} Myr</a> · <a href="?world=${w.file}" data-world="${w.file}">world ${w.id}</a>${named}` +
      (zs.length ? `<div class="sub"><span class="muted">zoom${zs.length > 1 ? 's' : ''}:</span> ${zs.map(zoomLink).join(', ')}</div>` : '') + '</div>';
  }).join('') + tzs.map((r) => {
    const fins = finishedOf(r.id);
    return `<div><a href="#" data-jump="${r.at_myr}" title="Go to ${r.at_myr} Myr">${r.at_myr} Myr</a> ·
    <a href="?run=${r.dir}" data-run="${r.dir}">time zoom ${r.id}</a> <span class="muted">${r.kyr} kyr of ice ages</span>` +
      fins.map((w) => {
        const zs = IDX.zooms.filter((z) => z.world === w.id);
        return `<div class="sub"><a href="?run=${r.dir}&t=${w.timezoom_kyr}" data-run="${r.dir}" data-t="${w.timezoom_kyr}" title="Open the time zoom at +${w.timezoom_kyr} kyr">+${w.timezoom_kyr} kyr</a> ·
          <a href="?world=${w.file}" data-world="${w.file}">finished world ${w.id}</a> <span class="muted">sea ${Math.round(w.sea_level_change_m)} m</span>` +
          (zs.length ? ` <span class="muted">zoom${zs.length > 1 ? 's' : ''}:</span> ${zs.map(zoomLink).join(', ')}` : '') + '</div>';
      }).join('') + '</div>';
  }).join('') + '</div>';
  return html;
}
// ticks above the time slider at the times of the worlds and time zooms made from this run
function drawMarks() {
  const el = $('marks');
  el.innerHTML = '';
  if (V?.kind !== 'run') return;
  const fr = V.run.frames, t0 = fr[0].t, t1 = fr[fr.length - 1].t;
  const tick = (t, names, cls) => `<span class="${cls}" style="left:${(100 * (t - t0) / (t1 - t0 || 1)).toFixed(2)}%" data-t="${t}"
    title="${t} ${V.tz ? 'kyr' : 'Myr'}: ${names.join(', ')} (click to go there)"></span>`;
  if (V.tz) {  // a time zoom: its finished worlds
    el.innerHTML = finishedOf(V.run.id || V.dir).map((w) => tick(w.timezoom_kyr, [`finished world ${w.id}`], 'fin')).join('');
    return;
  }
  const { worlds, tzs } = madeFrom(V.dir), at = new Map();
  for (const w of worlds) at.set(w.t_myr, [...(at.get(w.t_myr) || []), `world ${w.id}`]);
  const tzAt = new Map();
  for (const r of tzs) tzAt.set(r.at_myr, [...(tzAt.get(r.at_myr) || []), `time zoom ${r.id}`]);
  el.innerHTML = [...tzAt].map(([t, n]) => tick(t, n, 'tz')).join('') + [...at].map(([t, n]) => tick(t, n, '')).join('');
  // with a vegetation view: a tick and a label where each plant group appeared (vegetation.GROUPS)
  if (VEG_VIEWS.has(state.layer)) {
    const short = ['mosses', 'marsh plants', 'conifers', 'flowering plants', 'grasses', 'C4 + CAM'];
    let last = -1e9, row = 0;
    for (const g of V.run.meta.plant_groups || []) {
      if (g.t == null || g.t < t0 || g.t > t1) continue;
      const xf = 100 * (g.t - t0) / (t1 - t0 || 1), x = xf.toFixed(2), title = `${g.t} Myr: ${esc(g.name)} appear (${g.pfts.join(', ')})`;
      row = xf - last < 12 ? (row + 1) % 3 : 0;  // close labels step up through three rows
      last = xf;
      el.innerHTML += `<span class="veg" style="left:${x}%" data-t="${g.t}" title="${title}"></span>` +
        `<b style="left:${x}%;top:${-13 - 10 * row}px" data-t="${g.t}" title="${title}">${short[g.group - 1] || g.group}</b>`;
    }
  }
}
$('marks').addEventListener('click', (e) => {
  if (e.target.dataset.t == null || V?.kind !== 'run') return;
  stop(); setFrame(nearestFrame(+e.target.dataset.t));
});
async function openWorld(file) {
  $('worldSel').value = 'world:' + file;
  await loadSelection('world:' + file);
}
// after something new was made: re-read the indexes, redraw what lists them
async function refreshIndex() {
  await fillSelector();
  if (!V) return;
  renderSummary(); drawMarks();
}

// ------------------------------------------------------------ cold eras on the timeline
// 0 (warm) .. 1 (deep icehouse) for a main run's keyframe, from its land ice
// and global mean temperature. Earth today (land ice on ~3% of the surface,
// 14.5 C) counts as fully cold: an icehouse with ice-age cycles.
function coldness(s) {
  if (s.ice_pct == null) return 0;
  return Math.min(1, Math.max(0, (s.ice_pct - 1) / 2, (13 - s.global_temp_c) / 4));
}
const COLD_HELP = 'Blue under the slider: cold eras (land ice on more than 1% of the surface, or a global mean below 13 °C; ' +
  'darkest = Earth-like icehouse or colder; smoothed over 5 keyframes). That is where a glacial time zoom shows ice ages.';

// The tint strip under the time slider: cold eras for a main run; for a time zoom, the ice volume.
function drawTint() {
  const cv = $('tint'), fr = V.run.frames, w = cv.clientWidth || 600;
  cv.width = w; cv.height = 1;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, w, 1);
  // a running mean over 5 keyframes: temperature wobbles frame to frame near
  // the thresholds, which drew the strip as stripes (PW-081)
  const raw = fr.map((f) => coldness(f.stats));
  let val = raw.map((_, i) => {
    const win = raw.slice(Math.max(0, i - 2), i + 3);
    return win.reduce((a, b) => a + b, 0) / win.length;
  });
  if (V.tz) {
    const sl = fr.map((f) => f.stats.sea_level_change_m), hi = Math.max(...sl), lo = Math.min(...sl);
    val = sl.map((v) => (hi - lo > 1 ? (hi - v) / (hi - lo) : 0));
  }
  const dx = w / Math.max(fr.length - 1, 1);
  val.forEach((c, i) => {
    if (c < 0.01) return;
    // ramps in from 0 so a value wobbling near the bottom doesn't switch on and off
    const a = c < 0.1 ? 2.2 * c : 0.15 + 0.7 * c;
    g.fillStyle = `rgba(120, 190, 255, ${a.toFixed(2)})`;
    // abutting, not overlapping: overlapped translucent rects doubled the alpha in thin stripes
    const x0 = Math.max(0, Math.round((i - 0.5) * dx)), x1 = Math.round((i + 0.5) * dx);
    g.fillRect(x0, 0, Math.max(x1 - x0, 1), 1);
  });
  $('track').title = V.tz ? 'Blue under the slider: how much ice there is (darkest = the largest ice volume of this time zoom)' : COLD_HELP;
}

function cellInfo(i) {
  const L = V.layers, G = V.grid, rows = [];
  const R = (g, k, v, o = {}) => rows.push({ g, k, v: String(v), sep: o.sep ?? ' ', ess: !!o.ess, join: o.join, lab: o.lab, extra: o.extra });
  const land = L.elevation[i] > 0;
  if (V.kind === 'run') R('place', 't', timeLabel(V.t), { sep: ' = ', ess: true });
  R('place', 'cell', `${i}${V.pentagons.includes(i) ? ' (pentagon!)' : ''}`, { ess: true });
  R('place', '', `lat ${G.lat[i].toFixed(1)}, lon ${G.lon[i].toFixed(1)}`, { lab: 'position', ess: true });
  R('place', 'elevation', `${L.elevation[i]} m${V.tz ? ' (above this moment\'s sea level)' : ''}`, { ess: true });
  const lk = (L.lake_kind || L.lake) && lakeLine(i);
  if (lk) R('place', '', lk, { lab: 'lake', ess: true });
  const vl = V.kind === 'world' && volcLine(i);
  if (vl) R('place', 'volcano', vl, { sep: ': ', ess: true });
  const vegRows = () => {
    if (!L.vegetation || !land) return;
    const t = V.vegTypes[L.vegetation[i]];
    R('plants', 'vegetation', t ? t.name : '?', { sep: ': ', ess: true });
    if (L.veg_Moss) {  // a world: the mix
      const mix = V.pfts.map((p) => [L['veg_' + p.code]?.[i] || 0, p]).filter(([f]) => f >= 3).sort((a, b) => b[0] - a[0]);
      if (mix.length) R('plants', '', mix.slice(0, 4).map(([f, p]) => `${f}% ${p.name}`).join(', '), { lab: 'main plant types' });
      let first = true;
      const bit = (k, v, ess) => { R('plants', k, v, { join: first ? undefined : ' · ', ess }); first = false; };
      if (L.canopy_height[i] > 0) bit('canopy', `${L.canopy_height[i]} m`);
      bit('trees', `${L.tree_cover[i]}%`, true); bit('NPP', `${L.npp[i]} g C/m²/yr`, true);
      const fr = L.fire_return[i];
      if (fr > 0) R('plants', 'fires', `every ~${fr < 10 ? fr : Math.round(fr / 10) * 10} yr`);
      else R('plants', '', 'no fires', { lab: 'fires' });
      if (L.tree_cover[i] >= 10) R('plants', 'stands', `~${L.stand_age[i]} yr old`, { join: ' · ' });
      if (L.lai_jul) R('plants', 'leaves', `LAI ${L.lai_jul[i].toFixed(1)} Jul, ${L.lai_jan[i].toFixed(1)} Jan`, { sep: ': ', join: ' · ' });
      if (L.flooded && L.flooded[i] >= 10) R('plants', 'flooded part of the year', `${L.flooded[i]}% of the cell`, { sep: ': ' });
      if (L.plant_cover) R('plants', 'plant cover', `${L.plant_cover[i]}%`, { extra: true });
      if (L.biomass) R('plants', 'biomass', `${L.biomass[i]} t C/ha`, { extra: true });
    } else if (L.tree_cover) {
      R('plants', 'trees', `${Math.round(L.tree_cover[i])}%`, { ess: true });
      R('plants', 'NPP', `${Math.round(L.npp[i])} g C/m²/yr`, { join: ' · ', ess: true });
    }
  };
  const landformRows = () => {
    if (!L.landform || !V.landforms.length || !land) return;
    const f = V.landforms[L.landform[i]];
    if (!f) return;
    R('ground', 'landform', f.name + (f.age && L.landform_age ? ` (${f.age} ${Math.round(L.landform_age[i])} Myr)` : ''), { sep: ': ', ess: true });
    if (L.strata_top) {
      const top = V.rocks[L.strata_top[i]], next = V.rocks[L.strata_next[i]];
      R('ground', 'strata', L.strata_top_km[i] > 0 ? `${top.name.split(' (')[0]} ${L.strata_top_km[i].toFixed(2)} km over ${next.name.split(' (')[0]}`
                                                   : `none, ${top.name.split(' (')[0]} exposed`, { sep: ': ' });
      if (L.fold_wavelength && L.fold_wavelength[i] > 0)
        R('ground', 'folded', `dips ~${Math.round(L.strata_dip[i])}°, fold crests ~${Math.round(L.fold_wavelength[i])} km apart`, { sep: ': ' });
      else if (L.strata_dip && L.strata_top_km[i] > 0) R('ground', '', `flat-lying, regional dip ${L.strata_dip[i].toFixed(2)}°`, { lab: 'strata dip' });
    }
  };
  const soilRows = () => {
    if (!L.soil || !land || !L.soil[i]) return;
    const t = V.soilTypes[L.soil[i]];
    if (!t) return;
    const lo = L.loess[i], tex = V.soilTextures[L.soil_texture[i]];
    R('soil', 'soil', `${t.name} (${t.wrb} / ${t.usda})` + (lo >= 1 ? ` on loess ${lo.toFixed(0)} m` : `, ${tex}`) +
      ` · ${L.soil_depth[i].toFixed(1)} m deep · fertility ${L.soil_fertility[i].toFixed(1)} · holds ${L.soil_water[i]} mm` +
      ` · ${L.soil_carbon[i].toFixed(0)} kg C/m² · ${V.soilDrainage[L.soil_drainage[i]]} drained`, { sep: ': ', ess: true });
    const also = [];
    if (L.peat_depth[i] > 0) also.push(`peat ${L.peat_depth[i].toFixed(1)} m`);
    if (L.permafrost[i] > 0) also.push(`${V.soilPermafrost[L.permafrost[i]]} permafrost`);
    if (lo > 0.05 && lo < 1) also.push(`loess ${lo.toFixed(1)} m`);
    if (also.length) R('soil', '', also.join(', '), { lab: 'soil, also' });
  };
  if (V.kind === 'world') {
    if (L.vegetation) vegRows();
    else R('plants', 'biome', V.biomes[L.biome[i]].name, { ess: true });
    soilRows();
    const s = L.temperature_jul ? state.season : '', yr = L.temperature_jul ? ' (year)' : '';
    if (s) R('climate', SEASON_NAMES[s], `${L['temperature_' + s][i]} °C, rain ${L['precipitation_' + s][i]} mm/yr` +
      ` (${s === 'jul' ? 'Apr–Sep' : 'Oct–Mar'} rate)`, { sep: ': ', ess: true });
    R('climate', 'temp', `${L.temperature[i]} °C${yr}` + (L.temperature_jul && !s ? `, July ${L.temperature_jul[i]}, January ${L.temperature_jan[i]}` : ''), { ess: true });
    R('climate', 'rain', `${L.precipitation[i]} mm/yr${yr}` + (L.precipitation_jul && !s ? `, July half ${L.precipitation_jul[i]}, January half ${L.precipitation_jan[i]}` : ''), { ess: true });
    R('water', ...riverRow(i), { ess: true });
    if (L.surface_rock) R('ground', 'surface', V.rocks[L.surface_rock[i]].name, { sep: ': ' });
    if (L.climate && land) R('climate', 'climate', `${V.koppen[L.climate[i]].code} (${V.koppen[L.climate[i]].name}), ` +
      `months ${Math.round(L.cold_month[i])} to ${Math.round(L.warm_month[i])} °C`, { ess: true });
    if (L.ice && L.ice[i] > 0) R('place', 'ice', `~${Math.round(L.ice[i])} m thick`, { ess: true });
    if (L.rock) {
      R('ground', 'rock', V.rocks[L.rock[i]].name, { sep: ': ' });
      R('ground', 'sediment cover', `${L.sediment_cover[i].toFixed(1)} km`);
      R('ground', 'crust', `${Math.round(L.crust_thickness[i])} km thick`);
    }
    landformRows();
    if (L.wave_power && !land) R('water', 'waves', `${L.wave_power[i].toFixed(1)} kW/m, tides ${L.tide_range[i].toFixed(1)} m`);
    if (L.reef && coastalText(i)) R('plants', 'coastal life', coastalText(i), { sep: ': ', ess: true });
    if (L.turbidity && !land) R('water', 'mud', `${L.turbidity[i].toFixed(1)} mg/L in the water`, { sep: ': ', extra: true });
    if (L.upwelling && !land && L.upwelling[i] >= 0.3) R('water', 'upwelling', `cools the sea ${L.upwelling[i].toFixed(1)} °C`, { sep: ': ' });
    if (L.sst && !land) {
      R('water', 'sea', `${L.sst[i].toFixed(1)} °C (July ${L.sst_jul[i].toFixed(1)}, January ${L.sst_jan[i].toFixed(1)}), ` +
        `salinity ${L.salinity[i].toFixed(2)} psu`, { ess: true });
      if (L.sinking[i] >= 0.005) R('water', 'deep water sinks here', `${L.sinking[i].toFixed(2)} Sv`, { sep: ': ' });
    }
    if (L.humidity_jul) R('climate', 'humidity', `July ${L.humidity_jul[i]}% (dew point ${L.dewpoint_jul[i]} °C), ` +
      `January ${L.humidity_jan[i]}% (${L.dewpoint_jan[i]} °C)`, { sep: ': ' });
    if (L.cloud_jul) R('climate', 'sky', `July ${L.cloud_jul[i]}% cloud, ${L.sunshine_jul[i].toFixed(1)} h of sun a day; ` +
      `January ${L.cloud_jan[i]}%, ${L.sunshine_jan[i].toFixed(1)} h`, { sep: ': ' });
    if (land && L.evaporation) R('water', 'evaporation', `${L.evaporation[i]} mm/yr`, { extra: true });
    if (land && L.pet) R('water', 'potential evaporation', `${L.pet[i]} mm/yr`, { extra: true });
    if (land && L.runoff) R('water', 'runoff', `${L.runoff[i]} mm/yr`, { extra: true });
    if (L.glaciated_myr && land && L.glaciated_myr[i] < 9999)  // (9999: never under ice)
      R('place', 'last glaciated', L.glaciated_myr[i] > 0 ? `${L.glaciated_myr[i]} Myr ago` : 'under ice now', { extra: true });
    if (L.obs_temperature) {  // the Earth reference world
      const ot = L.obs_temperature[i], op = L.obs_precipitation[i], ok = L.obs_climate[i];
      if (ot != null) R('observed', 'observed', `${ot} °C` + (L.obs_cold_month[i] != null
        ? `, months ${Math.round(L.obs_cold_month[i])} to ${Math.round(L.obs_warm_month[i])} °C` : ''), { sep: ': ' });
      if (op != null && land) R('observed', 'observed rain', `${Math.round(op)} mm/yr`);
      if (ok >= 0 && land) R('observed', 'observed climate', `${V.koppen[ok].code} (${V.koppen[ok].name})`);
      const os = L.obs_sunshine?.[i];
      if (os != null && land) R('observed', 'observed sunshine', `${os.toFixed(1)} h a day (CRU)`);
    }

  if (V.tz) {  // glacial time zoom: no rock or rain layers

      const k = L.climate && V.koppen[L.climate[i]];
      R('climate', 'mean', `${L.temperature[i]} °C` + (land && k ? `, climate ${k.code} (${k.name})` : ''), { ess: true });
    }
    if (L.ice && L.ice[i]) R('place', 'ice', `~${Math.round(L.ice[i])} m thick`, { ess: true });
  }
  if (L.plate && !V.tzEarth) {
    R('plates', 'plate', `${L.plate[i]}` + (L.crust ? ` (${L.crust[i] ? 'continental' : 'oceanic'})` : ''), { ess: V.kind === 'run' });
    if (L.crust_age && L.crust) R('plates', `${L.crust[i] ? 'rock' : 'sea floor'} age`, `${Math.round(L.crust_age[i])} Myr`);
    const v = plateVelocity(i);
    if (v && (V.kind === 'run' || V.meta.method === 'tectonics')) R('plates', 'moving', `${(Math.hypot(...v) * CMYR).toFixed(1)} cm/yr`, { ess: V.kind === 'run' });
    if (L.plate_boundary && L.plate_boundary[i]) R('plates', '', L.plate_boundary[i] > 0 ? 'converging boundary' : 'diverging boundary', { lab: 'boundary', ess: V.kind === 'run' });
  }
  if (V.kind === 'run' && !V.tz) {  // a run frame: only the layers loaded so far (those on screen)
    if (L.surface_rock) R('ground', 'surface', V.rocks[L.surface_rock[i]].name, { sep: ': ', ess: state.layer === 'surface rock' });
    if (L.rock) R('ground', 'rock', V.rocks[L.rock[i]].name, { sep: ': ', ess: state.layer === 'rock type' });
    if (L.sediment_cover) R('ground', 'sediment cover', `${L.sediment_cover[i].toFixed(1)} km`, { ess: state.layer === 'sediment' });
    if (L.crust_thickness) R('ground', 'crust', `${L.crust_thickness[i]} km thick`, { ess: state.layer === 'crust thickness' });
    if (L.precipitation && land) R('climate', 'rain', `${L.precipitation[i]} mm/yr`, { ess: true });
    landformRows();
    vegRows();
    if (L.climate && land) {
      const k = V.koppen[L.climate[i]];
      R('climate', 'climate', `${k.code} (${k.name})`, { ess: true });
    }
    if (L.temperature) R('climate', 'mean', `${L.temperature[i]} °C`, { ess: true });
    if (L.ice && L.ice[i] && land) R('place', 'ice', `~${Math.round(L.ice[i])} m thick` + (L.bed ? `, bed ${Math.round(L.bed[i])} m` : ''), { ess: true });
  }
  return rows;
}

// the text of cellInfo's rows: one line per row (or joined to the line before)
function infoLines(rows) {
  const lines = [];
  for (const r of rows) {
    if (r.extra) continue;
    const s = r.k ? r.k + r.sep + r.v : r.v;
    if (r.join && lines.length) lines[lines.length - 1] += r.join + s; else lines.push(s);
  }
  return lines;
}
function describe(i) { return infoLines(cellInfo(i)); }

// the river through cell i: discharge (flow x cell area / 1 yr) and, in worlds with the rivers' year (PW-028),
// when it peaks, how much above its mean month, and how long it's frozen -> [label, value]
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October',
                     'November', 'December'];
function riverRow(i) {
  const L = V.layers, q = L.flow[i] * 4 * Math.PI * 6.371e6 ** 2 / V.n / 3.156e7;
  const qs = q >= 100 ? Math.round(q).toLocaleString('en-US') : q >= 1 ? q.toFixed(0) : q.toFixed(1);
  let s = `~${qs} m³/s`;
  if (L.flood_ratio && L.elevation[i] > 0 && L.flood_month[i] > 0) {
    s += `, highest in ${MONTH_NAMES[L.flood_month[i] - 1]} (${L.flood_ratio[i].toFixed(1)}× its mean month)`;
    if (L.river_frozen && L.river_frozen[i] > 0) s += `, frozen ${L.river_frozen[i]} month${L.river_frozen[i] > 1 ? 's' : ''}`;
  }
  return ['river', s];
}

// the label of a row as HTML, with its hint (a dotted underline; the hint on hover)
function infoLabel(r) {
  const lab = r.k || r.lab || '';
  const h = HINTS[lab];
  return h ? `<span class="hint" title="${esc(h)}">${esc(lab)}</span>` : esc(lab);
}
// a row's value as HTML: NPP, LAI, psu, Sv get their own hint where they appear inside a value
const TERM_HINTS = { NPP: HINTS.NPP, LAI: HINTS.LAI, psu: HINTS.sea, Sv: HINTS['deep water sinks here'] };
function infoValue(v) {
  return esc(v).replace(/\b(NPP|LAI|psu|Sv)\b/g, (m) => `<span class="hint" title="${esc(TERM_HINTS[m])}">${m}</span>`);
}
function infoRowsHtml(rows) {
  return rows.map((r) => `<div class="k">${infoLabel(r)}</div><div class="v">${infoValue(r.v)}</div>`).join('');
}
// the compact info box: the essentials, two columns (bold labels), and a button for the rest
function infoBoxHtml(i) {

// A world cell's twelve months (GET /api/cell: the server runs climate.months on the cell's

const cellMonths = new Map();  // `${world}:${cell}` -> {t, p} | 'pending' | 'failed'

      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))

      `<circle cx="${cx(k)}" cy="${ty(t)}" r="3" class="tdot"/></g>`;
    s += `<text x="${cx(k)}" y="${y1 + 11}" class="tick">${MON[k][0]}</text>`;

    `<tspan class="rlab" x="${x0}" dy="12">${Math.round(pyr)} mm a year · wettest ${MON[wet]} ${Math.round(m.p[wet])}, driest ${MON[dry]} ${Math.round(m.p[dry])} mm</tspan></text>`;

// July / year / January temperature and rain of a world cell, as a small SVG (worlds store
// those three, not every month): the temperature dots on a -30..40 °C scale with the
// coldest-warmest month range behind them, the rain as bars (rates per year)
function seasonChart(i) {
  const L = V.layers;
  if (V.kind !== 'world' || !L.temperature_jul || !L.precipitation_jul) return '';
  const W = 400, H = 128, x0 = 72, x1 = W - 12, tx = (t) => x0 + (x1 - x0) * (Math.min(Math.max(t, -30), 40) + 30) / 70;
  const T = [['Jan', L.temperature_jan[i]], ['year', L.temperature[i]], ['Jul', L.temperature_jul[i]]];
  const P = [['Oct–Mar', L.precipitation_jan[i]], ['year', L.precipitation[i]], ['Apr–Sep', L.precipitation_jul[i]]];
  const pmax = Math.max(500, ...P.map((p) => p[1])), px = (p) => x0 + 0.72 * (x1 - x0) * p / pmax;  // (room for the label after the bar)
  let s = `<svg class="schart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperature and rain by season">`;
  s += `<text x="0" y="12" class="lab">temperature</text>`;
  for (const t of [-30, -10, 0, 10, 20, 30, 40]) s += `<line x1="${tx(t)}" x2="${tx(t)}" y1="4" y2="44" class="${t === 0 ? 'zero' : 'grid'}"/><text x="${tx(t)}" y="54" class="tick">${t}</text>`;
  if (L.cold_month && L.warm_month)
    s += `<rect x="${tx(L.cold_month[i])}" y="14" width="${Math.max(tx(L.warm_month[i]) - tx(L.cold_month[i]), 1)}" height="16" rx="3" class="range"><title>coldest to warmest month: ${Math.round(L.cold_month[i])} to ${Math.round(L.warm_month[i])} °C</title></rect>`;
  T.forEach(([k, t], j) => { s += `<circle cx="${tx(t)}" cy="22" r="4.5" class="t${j}"><title>${k}: ${t} °C</title></circle>`; });
  s += `<text x="${x0}" y="68" class="plab">` + T.map(([k, t], j) => `<tspan class="t${j}">● ${k} ${t} °C</tspan>`).join('  ') +
    (L.cold_month ? `<tspan>  months ${Math.round(L.cold_month[i])}…${Math.round(L.warm_month[i])}</tspan>` : '') + '</text>';
  s += `<text x="0" y="88" class="lab">rain (mm/yr)</text>`;
  P.forEach(([k, p], j) => {
    const y = 79 + j * 16;
    s += `<rect x="${x0}" y="${y}" width="${Math.max(px(p) - x0, 1)}" height="11" rx="2" class="p${j}"><title>${k}: ${p} mm/yr</title></rect>`;

}

        <button class="btn" data-act="go" ${zoomJob && !zoomJob.finished ? 'disabled' : ''}>Zoom</button></div>
