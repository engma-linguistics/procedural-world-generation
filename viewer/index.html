  zoomJob = { label: `${zoomSize} km around ${picked.lat}, ${picked.lon}`, status: 'starting', progress: 0 };
  renderZoomBox();
  let r;
  try {
    r = await fetch('../api/zoom', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req) });
  } catch (err) { r = null; }
  if (!r || r.status === 501 || r.status === 404) {
    Object.assign(zoomJob, { status: 'error', finished: true,
      error: 'The server has no zoom API. Restart it: uv run python -m planet serve' });
    return renderZoomBox();
  }
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { Object.assign(zoomJob, { status: 'error', finished: true, error: out.error || `HTTP ${r.status}` }); return renderZoomBox(); }
  pollJob(out.job);
}

// a job's state from the server. While it can't be reached (restarting: its
// jobs survive that, PW-085) keep asking, every 1.5 s for up to a minute.
async function fetchJob(id) {
  for (let k = 0; ; k++) {
    try { return await (await fetch(`../api/jobs/${id}`, { cache: 'no-store' })).json(); }
    catch (err) {
      if (k >= 40) return { status: 'error', error: 'lost the server: ' + err.message };
      await new Promise((ok) => setTimeout(ok, 1500));
    }
  }
}

async function pollJob(id) {
  const job = zoomJob;
  while (job === zoomJob) {
    let j;
    j = await fetchJob(id);
    Object.assign(job, j);
    if (j.status === 'done' || j.status === 'error') {
      job.finished = true;
      renderZoomBox();
      if (j.status === 'done') { showTab('zoom', j.zoom); refreshIndex(); }
      return;
    }
    renderZoomBox();
    await new Promise((ok) => setTimeout(ok, 1000));
  }
}

// ------------------------------------------------------------ highlights
// The server (planet/highlights.py) looks over a world for its most
// interesting places: the highest peak, the longest range, big river mouths,
// fjord coasts, wine country... For a run it first builds the full world for
// the frame on screen (a few seconds, once). Clicking one turns the globe to
// it and picks it for a zoom, with the suggested size.
let hl = null;        // {key, t, features, world} from GET /api/highlights
let hlSel = -1;       // index of the selected feature
let hlSeenKey = null, hlPeekTimer = null;
const hlGroup = new THREE.Group();
group.add(hlGroup);

function viewKey() { return !V ? null : V.kind === 'run' ? `run:${V.dir}@${V.t}` : `world:${V.id}`; }
function hlQuery() {
  if (V.tz) return null;
  if (V.kind === 'run') return `run=${encodeURIComponent(V.dir)}&t=${V.t}`;
  return V.id ? `world=${encodeURIComponent(V.id)}` : null;
}

// cached=true only asks whether highlights were already found for this view
async function fetchHighlights(cached) {
  const q = hlQuery(), key = viewKey();
  if (!q) { $('hlStatus').textContent = V.tz ? 'Not for time zooms: find them in the source run.' : 'Only for runs and saved worlds.'; return; }
  if (!cached) {
    $('hlFind').disabled = true;
    $('hlStatus').textContent = V.kind === 'run' && !(hl && hl.key === key)
      ? `Building the world at ${V.t} Myr and looking around (a few seconds)…` : 'Looking around…';
  }
  let r = null, out = {};
  try { r = await fetch(`../api/highlights?${q}${cached ? '&cached=1' : ''}`, { cache: 'no-store' }); out = await r.json(); }
  catch (err) { out = { error: r ? `HTTP ${r.status}` : 'no server' }; }
  $('hlFind').disabled = false;
  if (key !== viewKey()) return;  // the view moved on meanwhile
  if (!r || !r.ok) {
    if (!cached) $('hlStatus').innerHTML = `<span class="err">${r && r.status !== 404 && r.status !== 501 ? out.error
      : 'The server has no highlights API. Restart it: uv run python -m planet serve'}</span>`;
    return;
  }
  if (!out.features) { if (!hl || hl.key !== key) renderHighlights(); return; }
  if (!hl || hl.key !== key) hlSel = -1;  // a refresh of the same list keeps the selection
  hl = { key, t: out.t_myr, world: out.world, features: out.features };
  renderHighlights();
  buildHighlightMarks();
  // ?hl=<rank>: open that highlight once, the first time a list arrives
  if (urlp.has('hl')) {
    const k = hl.features.findIndex((f) => f.rank === +urlp.get('hl'));
    urlp.delete('hl');
    if (k >= 0) { goToHighlight(k); $('hlList').querySelector('.hl.sel')?.scrollIntoView({ block: 'nearest' }); }
  }
}
$('hlFind').addEventListener('click', () => fetchHighlights(false));
OVERLAY_IDS.push('hlMarks');  // so ?hlMarks=0 works in the URL
$('hlMarks').addEventListener('change', buildHighlightMarks);

// categories (planet/highlights.py CATEGORIES): a colour each, on the markers and the list,
// and a filter (state.hlCat, '' = all; ?hlcat= in the URL)
const HL_CATS = { landscape: '#e8b86a', water: '#5fb8ff', climate: '#8fe07a', travel: '#ff8ad8', geology: '#ff6b4a', vegetation: '#3ccf9a' };
const hlColor = (f) => HL_CATS[f.category] || '#c0c0c0';
const hlShown = (f) => !state.hlCat || f.category === state.hlCat;
state.hlCat = '';  // (?hlcat=: applyUrlOptions)
function renderHlCats() {
  const el = $('hlCats');
  if (!hl) { el.innerHTML = ''; return; }
  const cnt = {};
  for (const f of hl.features) cnt[f.category] = (cnt[f.category] || 0) + 1;
  el.innerHTML = `<button data-c="" class="${state.hlCat ? '' : 'on'}">all ${hl.features.length}</button>` +
    Object.entries(HL_CATS).filter(([c]) => cnt[c]).map(([c, col]) =>
      `<button data-c="${c}" class="${state.hlCat === c ? 'on' : ''}" style="${state.hlCat === c ? 'color:' + col : ''}"><span class="dot" style="background:${col}"></span>${c} ${cnt[c]}</button>`).join('');
}
$('hlCats').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.hlCat = b.dataset.c;
  const u = new URL(location);
  if (state.hlCat) u.searchParams.set('hlcat', state.hlCat); else u.searchParams.delete('hlcat');
  history.replaceState(null, '', u);
  renderHighlights(); buildHighlightMarks();
});
function renderHighlights() {
  const here = hl && hl.key === viewKey();
  const list = $('hlList');
  list.classList.toggle('stale', !!hl && !here);
  renderHlCats();
  if (!hl) {
    $('hlStatus').textContent = 'Not looked for yet' + (V && V.kind === 'run' ? ` at ${V.t} Myr.` : '.');
    list.innerHTML = '';
    return;
  }
  $('hlStatus').innerHTML = here ? `${hl.features.length} places, best first · world ${hl.world}`
    : `These are for t = ${hl.t} Myr (click one to go back there), or find them for ${V.t} Myr.`;
  list.innerHTML = hl.features.map((f, k) => {
    if (!hlShown(f) && k !== hlSel) return '';
    let html = `<div class="hl ${k === hlSel ? 'sel' : ''}" data-k="${k}"><span class="k">${f.rank}.</span>` +
      `<span class="dot" style="background:${hlColor(f)}" title="${f.category || ''}"></span><b>${f.title}</b>`;
    if (k === hlSel) {
      html += `<div class="blurb">${f.blurb}<br>`;
      if (f.zoom) html += `<a href="#" data-zoom="${f.zoom}">open zoom ${f.zoom}</a> (made already)`;
      else if (f.zoomable) html += `"Zoom" in the info box (top right) refines this ${f.size_km} km square`;
      html += '</div>';
    }
    return html + '</div>';
  }).join('');
}

$('hlList').addEventListener('click', (e) => {
  if (e.target.dataset.zoom) { e.preventDefault(); showTab('zoom', e.target.dataset.zoom); return; }
  const row = e.target.closest('.hl'); if (!row) return;
  goToHighlight(+row.dataset.k);
});

function goToHighlight(k) {
  const f = hl.features[k];
  hlSel = k;
  if (V.kind === 'run' && V.t !== hl.t) {  // back to the frame these were found for
    stop();
    setFrame(V.run.frames.findIndex((fr) => fr.t === hl.t));
  }
  $('spin').checked = false;
  turnTo(f.lat, f.lon);
  if (f.zoomable) zoomSize = f.size_km;
  pickCell(f.cell);
  picked.lat = f.lat; picked.lon = f.lon;  // exactly what `planet highlights --zoom` used, so zoom ids match
  renderZoomBox();
  renderHighlights();
}

// Turn the globe (smoothly) so lat/lon faces the camera; on the flat map, pan to it.
function turnTo(lat, lon) {
  if (state.mode !== 'globe') {
    const x = lon / 90, y = lat / 90;
    camera.position.set(x, y, camera.position.z); controls.target.set(x, y, 0);
    return;
  }
  const d = camera.position.distanceTo(controls.target);
  lat = Math.max(-80, Math.min(80, lat));  // looking straight down a pole confuses the orbit controls
  const to = new THREE.Vector3(...unitVec(lat, lon)).applyQuaternion(group.quaternion).normalize();
  const from = camera.position.clone().sub(controls.target).normalize();
  controls.target.set(0, 0, 0);
  const t0 = performance.now(), ms = 700;
  const step = (now) => {
    const a = Math.min((now - t0) / ms, 1), e = a * a * (3 - 2 * a);
    const q = new THREE.Quaternion().setFromUnitVectors(from, to);
    const dir = from.clone().applyQuaternion(new THREE.Quaternion().slerp(q, e));
    camera.position.copy(dir.multiplyScalar(d));
    camera.lookAt(0, 0, 0);
    if (a < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Numbered rings (and courses: rivers, range spines) on the globe, for the
// view the highlights were found for. Called at the end of buildOverlays.
function buildHighlightMarks() {
  hlGroup.children.forEach(disposeObj);
  hlGroup.clear();
  const key = viewKey();
  if (key !== hlSeenKey) {  // the view changed: see if highlights were already found for it
    if (hl && key && hl.key.split('@')[0] !== key.split('@')[0]) { hl = null; hlSel = -1; }  // another run/world
    hlSeenKey = key;
    clearTimeout(hlPeekTimer);
    if (key && !state.playing) hlPeekTimer = setTimeout(() => fetchHighlights(true), 400);
    renderHighlights();
  }
  if (!hl || hl.key !== key || !$('hlMarks').checked) return;
  const globe = state.mode === 'globe', r0 = globe ? 1.016 : 1;
  const wraps = (a, b) => !globe && Math.abs(a[0] - b[0]) > 2;
  const rings = {}, paths = {}, sel = [];
  hl.features.forEach((f, k) => {
    if (!hlShown(f) && k !== hlSel) return;
    const col = hlColor(f), out = k === hlSel ? sel : (rings[col] ||= []), cl = Math.max(Math.cos(f.lat * Math.PI / 180), 0.2), rad = k === hlSel ? 2.2 : 1.4;
    for (let j = 0; j < 20; j++) {
      const a1 = j / 20 * 2 * Math.PI, a2 = (j + 1) / 20 * 2 * Math.PI;
      const p1 = llPos(f.lat + rad * Math.sin(a1), f.lon + rad * Math.cos(a1) / cl, r0);
      const p2 = llPos(f.lat + rad * Math.sin(a2), f.lon + rad * Math.cos(a2) / cl, r0);
      if (!wraps(p1, p2)) out.push(...p1, ...p2);
    }
    for (let j = 0; f.path && j < f.path.length - 1; j++) {
      const p1 = llPos(...f.path[j], r0), p2 = llPos(...f.path[j + 1], r0);
      if (!wraps(p1, p2)) (paths[col] ||= []).push(...p1, ...p2);
    }
    const label = textSprite(String(f.rank), k === hlSel ? '#ffffff' : col);
    const lp = globe ? llPos(f.lat + rad, f.lon, 1.03) : llPos(f.lat + rad + 1.5, f.lon, 1, 0.01);
    label.position.set(...lp);
    label.scale.setScalar(globe ? 0.075 : 0.06);
    hlGroup.add(label);
  });
  for (const [col, pts] of Object.entries(rings)) hlGroup.add(lineObj(pts, col));
  for (const [col, pts] of Object.entries(paths)) hlGroup.add(lineObj(pts, col, 0.8));
  hlGroup.add(lineObj(sel, 0xffffff));
}

// ------------------------------------------------------------ tabs: globe | regional zoom (zoom.html in an iframe)
state.tab = 'globe';
function showTab(tab, zoomId) {
  state.tab = tab;
  document.body.classList.toggle('zoomTab', tab === 'zoom');
  [...$('tabs').children].forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'zoom') {
    stop();
    // reloaded every time, so zooms made since show up in its list
    const q = new URLSearchParams(zoomId ? { id: zoomId } : {});
    if (V?.kind === 'run') q.set('run', V.dir); else if (V?.id) q.set('world', V.id);
    $('zoomFrame').src = 'zoom.html?' + q;
  }
  const u = new URL(location);
  if (tab === 'zoom') u.searchParams.set('tab', 'zoom'); else u.searchParams.delete('tab');
  if (zoomId) u.searchParams.set('zoom', zoomId);
  history.replaceState(null, '', u);
}
$('tabs').addEventListener('click', (e) => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); });

// ------------------------------------------------------------ loading
// The legends (rock, Köppen and biome ids -> names and colours) come with every run and world.
function legendFields(leg) {
  return { rocks: leg.rocks, rockColors: leg.rocks.map((r) => r.color), koppen: leg.koppen,
           landforms: leg.landforms || [], landformColors: (leg.landforms || []).map((f) => f.color),
           koppenColors: leg.koppen.map((k) => k.color), biomes: leg.biomes, biomeColors: leg.biomes.map((b) => b.color),
           vegTypes: leg.vegetation?.types || [], vegColors: (leg.vegetation?.types || []).map((t) => t.color),
           pfts: leg.vegetation?.pfts || [], plantGroups: leg.vegetation?.groups || [],
           soilTypes: leg.soils?.types || [], soilColors: (leg.soils?.types || []).map((t) => t.color),
           soilTextures: leg.soils?.textures || [], soilDrainage: leg.soils?.drainage || [],
           soilPermafrost: leg.soils?.permafrost || [] };
}

// does the run (any of its layers, loaded or not) or the world have this layer?
function hasLayer(k) { return V.kind === 'run' ? !!V.run.layers[k] : !!V.layers[k]; }

// A world file names its grid file ("../grids/L6.json", relative to worlds/),
// shared with the runs at that level.
async function setWorld(w) {
  stop(); picked = null; renderZoomBox();
  const G = typeof w.grid === 'string' ? await (await fetch(new URL(w.grid, new URL('../worlds/', location.href)))).json() : w.grid;
  const pg = prepareGrid(G);
  for (const k of ['humidity', 'dewpoint', 'cloud', 'sunshine'])  // the year's: the mean of the two half-years
    if (w.layers[k + '_jul'] && !w.layers[k]) w.layers[k] = w.layers[k + '_jul'].map((v, i) => (v + w.layers[k + '_jan'][i]) / 2);
  V = { kind: 'world', name: w.name, id: w.id, grid: G, n: pg.n, cornerCells: pg.cornerCells, layers: w.layers,
        meta: w.meta, summary: w.summary, pentagons: G.pentagons || w.meta.pentagons, level: w.meta.level,
        hotspots: w.meta.hotspots, volcanoes: worldVolcanoes(w.meta), volcTable: volcTable(w.meta), ...legendFields(w.legend) };
  iceBed(V.layers);
  document.title = `${w.name} · Planet Viewer`;
  renderLayerButtons(); renderSummary(); buildTopology(); paint();
}

// ------------------------------------------------------------ run layers
// A run stores one file per layer, all frames in it (runs/<id>/layers/<name>.bin,
// frames x cells). run.json "layers" says, per layer, its file, dtype, shape and
// encoding: value = stored * scale + offset, then the transform if any
// ("log2p1": 2^value - 1; "nbr_slot": the stored number is the position of the
// target cell in the cell's neighbour list, 255 = none -> -1).
// Only the layers the picture needs are downloaded (layersNeeded), when needed.
const TYPED = { int16: Int16Array, uint8: Uint8Array, uint16: Uint16Array, int8: Int8Array, float32: Float32Array };
// colour layer / overlay -> the run layers it draws from (elevation is always loaded)
const LAKE_NEEDS = ['lake_kind', 'lake_depth'];
const COLOUR_NEEDS = {
  elevation: ['ice', ...LAKE_NEEDS], 'ice thickness': ['ice'], 'bed under ice': ['ice'], plates: ['plate', 'crust', 'plate_boundary'], 'crust age': ['crust', 'crust_age'],
  'rock type': ['rock'], 'surface rock': ['surface_rock'], 'crust thickness': ['crust_thickness'], sediment: ['sediment_cover'],
  rainfall: ['precipitation'], temperature: ['temperature'], climate: ['climate'],
  landforms: ['landform', 'landform_age', 'strata_top', 'strata_top_km', 'strata_next', 'strata_dip', 'fold_wavelength'],
  vegetation: ['vegetation', 'tree_cover', 'npp'], 'tree cover': ['vegetation', 'tree_cover', 'npp'], NPP: ['vegetation', 'tree_cover', 'npp'],
};
const OVERLAY_NEEDS = { rivers: ['flow', 'downstream'], winds: ['wind_e', 'wind_n', 'wind_jul_e', 'wind_jul_n', 'wind_jan_e', 'wind_jan_n'],
                        currents: ['current_e', 'current_n'],
                        jet: ['jet_e', 'jet_n', 'jet_jul_e', 'jet_jul_n', 'jet_jan_e', 'jet_jan_n'], arrows: ['plate'] };

function layersNeeded() {
  // elevation always; lake_kind too, so hovering any layer names the lake (its depth comes with the elevation layer);
  // ice, which says which cells are land (see iceBed)
  const want = ['elevation', 'lake_kind', 'ice', ...(COLOUR_NEEDS[state.layer] || [])];
  // the picked season's temperature or rain (runs since PW-138 store them)
  if (state.season && SEASONAL[state.layer]) want.push(`${SEASONAL[state.layer]}_${state.season}`);
  for (const [id, ks] of Object.entries(OVERLAY_NEEDS)) if ($(id).checked) want.push(...ks);
  return [...new Set(want)].filter((k) => V.run.layers[k]);
}

// Download what the current colour layer and overlays need, and drop the layers
// nothing draws any more (a run layer holds every keyframe: 40-80 MB each at L7;
// one picked again is fetched again, gzipped by the server). A no-op for worlds.
async function loadNeeded() {
  if (V?.kind !== 'run') return;
  const v = V, need = layersNeeded(), keep = new Set(need), want = need.filter((k) => !v.data[k]);
  const drop = [...new Set([...Object.keys(v.data), ...Object.keys(v.pending)])].filter((k) => !keep.has(k));
  for (const k of drop) { delete v.data[k]; delete v.pending[k]; delete v.bytes[k]; }
  if (drop.length && !want.length) return setFrame(V.frame, false);  // (V.layers mustn't read the dropped ones)
  if (!want.length) return;
  $('tlabel').textContent = `loading ${want.join(', ')}…`;
  await Promise.all(want.map(async (k) => {
    const p = v.pending[k] ||= fetch(v.base + v.run.layers[k].file, { cache: 'no-store' }).then((r) => {
      if (!r.ok) throw new Error(`${v.run.layers[k].file}: HTTP ${r.status}`);
      return r.arrayBuffer();
    });
    const buf = await p;
    if (v.pending[k] !== p) return;  // dropped while it came (another layer picked meanwhile)
    v.data[k] = new TYPED[v.run.layers[k].dtype](buf);
    v.bytes[k] = buf.byteLength;
  }));
  if (V === v) setFrame(V.frame, false);  // rebuild V.layers with the new ones
}

// redraw after something that may need more layers (colour layer, overlay ticked)
async function refresh(draw) {
  try { await loadNeeded(); } catch (err) { toast('Load failed: ' + err.message); console.error(err); return; }
  draw();
}

// layer k of frame f in real units (see the encoding above)
function decodeFrame(k, f) {
  const s = V.run.layers[k], raw = V.data[k], n = V.n;
  const a = raw.length === n ? raw : raw.subarray(f * n, (f + 1) * n);  // stored once (shape [1, cells]): every frame
  if (s.transform === 'nbr_slot') {
    const out = new Int32Array(n), nbr = V.grid.nbr;
    for (let i = 0; i < n; i++) out[i] = a[i] === 255 ? -1 : nbr[i][a[i]];
    return out;
  }
  if (s.scale === 1 && !s.offset && !s.transform) return a;
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = a[i] * s.scale + s.offset;
  if (s.transform === 'log2p1') for (let i = 0; i < n; i++) out[i] = 2 ** out[i] - 1;
  return out;
}

async function loadRun(dir, wantT) {
  stop(); picked = null; renderZoomBox();
  const base = `../runs/${dir}/`;
  const run = await (await fetch(base + 'run.json', { cache: 'no-store' })).json();
  const grid = await (await fetch(new URL(run.grid, new URL(base, location.href)))).json();
  const pg = prepareGrid(grid);
  const tz = run.kind === 'timezoom';  // glacial time zoom: time in kyr
  V = { kind: 'run', name: run.name, dir, base, run, data: {}, pending: {}, bytes: {}, grid, n: pg.n, cornerCells: pg.cornerCells,
        pentagons: grid.pentagons, level: grid.level, frame: 0, tz, tzEarth: tz && run.meta.source_run === 'earth',
        ...legendFields(run.legend) };
  document.title = `${run.name} · Planet Viewer`;
  $('frame').max = run.frames.length - 1;
  let f = 0;
  if (wantT != null) f = run.frames.reduce((b, fr, i) => (Math.abs(fr.t - wantT) < Math.abs(run.frames[b].t - wantT) ? i : b), 0);
  V.frame = f;
  renderLayerButtons();  // settles state.layer, which says what to load
  await loadNeeded();
  setFrame(f, false);
  buildTopology(); paint(); renderRunSummary(); drawTint(); drawMarks();
}

// A world's volcano table (tectonics.volcanism.COLUMNS) -> [lat, lon, kind, mark]
// for the overlay: the active and dormant ones, extinct hotspot islands and
// atolls; the many other extinct ones (seamounts, guyots, dead arc cones, old
// calderas) only with "extinct ones too".
// mark: 0 active, 1 extinct island, 2 atoll (a living reef round a sunken volcano), 3 dormant, 4 other extinct
function worldVolcanoes(meta) {
  const out = [];
  for (const v of volcTable(meta)) {
    const m = v.status === 'active' ? 0 : v.status === 'dormant' ? 3 : v.kind === 1 && v.top_m > 0 ? 1
      : v.top_m <= 0 && v.reef === 1 ? 2 : 4;
    out.push([v.lat, v.lon, v.kind, m]);
  }
  return out;
}
// The volcano table as objects, each with its status as zoom_volcanoes.status (keep the two alike):
// active: fed now (a hotspot vent over its plume, an arc volcano within its life); dormant: a hotspot
// vent off its plume's centre but within DORMANT_KM (the plume's head, volcanism.PLUME_KM) of a live
// plume, so it can erupt again; else extinct. The run has Myr steps, no eruptions: it can't tell a
// volcano that erupted last year from one quiet for 50,000 years.
const DORMANT_KM = 150;
function volcTable(meta) {
  const cols = meta.volcano_columns;
  if (!cols || !meta.volcanoes) return [];
  const rad = Math.PI / 180, u = (la, lo) => [Math.cos(la * rad) * Math.cos(lo * rad), Math.cos(la * rad) * Math.sin(lo * rad), Math.sin(la * rad)];
  const P = (meta.hotspots || []).map(([la, lo]) => u(la, lo));
  return meta.volcanoes.filter((r) => r.length === cols.length).map((r) => {
    const v = Object.fromEntries(cols.map((k, i) => [k, r[i]]));
    let status = v.active ? 'active' : 'extinct';
    if (!v.active && v.kind === 1) {
      const p = u(v.lat, v.lon);
      if (P.some((q) => Math.acos(Math.min(1, p[0] * q[0] + p[1] * q[1] + p[2] * q[2])) * 6371 <= DORMANT_KM)) status = 'dormant';
    }
    return { ...v, status, type: v.kind === 0 ? 'stratovolcano' : v.floor_m > 0 ? 'caldera' : 'shield volcano' };
  });
}
// the volcanoes in cell i (within ~0.6 cell spacings of its centre), for the hover card
function volcLine(i) {
  const T = V.volcTable;
  if (!T?.length) return '';
  const G = V.grid, rad = Math.PI / 180, km = (V.meta.cell_size_km || 100) * 0.6;
  const la0 = G.lat[i] * rad, lo0 = G.lon[i] * rad;
  const here = T.filter((v) => {
    const c = Math.sin(la0) * Math.sin(v.lat * rad) + Math.cos(la0) * Math.cos(v.lat * rad) * Math.cos(lo0 - v.lon * rad);
    return Math.acos(Math.min(1, c)) * 6371 <= km;
  }).sort((a, b) => b.top_m - a.top_m);
  const fm = (x) => Math.round(x).toLocaleString('en-US');
  return here.slice(0, 3).map((v) => `${v.status} ${v.type}${v.top_m <= 0 ? (v.reef === 1 ? ' (an atoll now)' : ' (below the sea)') : ''}, `
    + `summit ${fm(v.top_m)} m, ${v.age < 1 ? 'under 1' : fm(v.age)} Myr`).join('; ') + (here.length > 3 ? `; +${here.length - 3} more` : '');
}

// Glacial isostasy (PW-189): a run's and a world's elevation is the bed, pressed down by its ice, so
// grounded ice can sit on a bed below sea level (land all the same: PW-307); a time zoom's is the surface
// (ice included). L.bed keeps the bed, and the elevation is shown floored at 1 m under grounded ice, so
// it reads as land everywhere (the sea shading, the coasts, the land counts).
function iceBed(L) {
  if (!L.elevation || !L.ice) return;
  const n = V.n, e = L.elevation, bed = new Float32Array(n);
  if (V.tz) { for (let i = 0; i < n; i++) bed[i] = e[i] - L.ice[i]; L.bed = bed; return; }
  const land = new Float32Array(n);
  for (let i = 0; i < n; i++) { bed[i] = e[i]; land[i] = L.ice[i] > 0 && e[i] < 1 ? 1 : e[i]; }
  L.bed = bed; L.elevation = land;
}

// A frame's layers, each decoded when first read: every layer downloaded so far
// is there (the hover card names what it can), but a frame only pays for the
// ones the picture and the hover actually use.
function frameLayers(f) {
  const L = {};
  const put = (k, v) => Object.defineProperty(L, k, { value: v, writable: true, enumerable: true, configurable: true });
  for (const k of Object.keys(V.data)) {
    Object.defineProperty(L, k, { enumerable: true, configurable: true,
      get() { const v = decodeFrame(k, f); put(k, v); return v; }, set(v) { put(k, v); } });
  }
  return L;
}

function setFrame(f, repaint = true) {
  const r = V.run;
  V.frame = f; V.t = r.frames[f].t; V.omega = r.frames[f].omega;
  V.layers = frameLayers(f);
  iceBed(V.layers);
  V.hotspots = r.frames[f].hotspots;
  V.volcanoes = r.frames[f].volcanoes;
  $('frame').value = f;
  $('tlabel').textContent = timeLabel(V.t);
  // (the cell under the pointer stays the one it was: no new ray through the globe each frame)
  if (repaint) { paint(); renderRunSummary(); renderHover(); if (picked) renderZoomBox(); }
  if (!state.playing) frameToUrl();  // (while playing: when it stops)
}
function frameToUrl() { const u = new URL(location); u.searchParams.set('t', V.t); history.replaceState(null, '', u); }

// ------------------------------------------------------------ playback
let lastAdvance = 0;
function stop() {
  const was = state.playing;
  state.playing = false; $('play').innerHTML = '&#9654;';
  if (was && V?.kind === 'run') frameToUrl();
  if (was && V && mesh && topo.smoothRelief) paint();  // (the relief's smooth normals again)
  else if (was && V && mesh && $('currents').checked) buildOverlays();  // back to streamlines
}
function togglePlay() {
  if (!V || V.kind !== 'run') return;
  if (!state.playing && V.frame >= V.run.frames.length - 1) setFrame(0);
  if (state.playing) return stop();
  state.playing = true;
  $('play').innerHTML = '&#10073;&#10073;';
}
$('play').addEventListener('click', togglePlay);
$('frame').addEventListener('input', (e) => { stop(); setFrame(+e.target.value); });
addEventListener('keydown', (e) => {
  if (!V || state.tab === 'zoom' || e.target.tagName === 'SELECT') return;
  if (e.code === 'KeyN' && !e.metaKey && !e.ctrlKey) northUp();
  if (e.code === 'Escape' && detailCell >= 0) return closeDetail();  // (the panel first, then the pick)
  if (e.code === 'Escape' && picked) unpick();
  if (V.kind !== 'run') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { stop(); setFrame(Math.min(V.frame + 1, V.run.frames.length - 1)); }
  if (e.code === 'ArrowLeft') { stop(); setFrame(Math.max(V.frame - 1, 0)); }
});
function nearestFrame(t) { const fr = V.run.frames; return fr.reduce((b, x, i) => (Math.abs(x.t - t) < Math.abs(fr[b].t - t) ? i : b), 0); }
$('summary').addEventListener('click', (e) => {
  const a = e.target.closest('[data-run],[data-world],[data-zoom],[data-jump]');  // provenance links
  if (a) {
    e.preventDefault();
    if (a.dataset.run) return openRun(a.dataset.run, a.dataset.t != null ? +a.dataset.t : undefined);
    if (a.dataset.world) return openWorld(a.dataset.world);
    if (a.dataset.zoom) return showTab('zoom', a.dataset.zoom);
    if (V.kind === 'run') { stop(); return setFrame(nearestFrame(+a.dataset.jump)); }
    return;
  }
  if (V.kind !== 'run') return;
  const act = e.target.dataset?.act;
  if (act === 'tz') return startTimezoom();
  if (act === 'finish') return startFinish();
  if (act === 'openTz') { e.preventDefault(); return openRun(tzJob.run); }
  if (act === 'source') { e.preventDefault(); return openRun(V.run.meta.source_run, V.run.meta.at_myr); }
  const chart = e.target.closest('svg.tzchart');
  if (chart) {  // jump to the time clicked on the chart
    const fr = V.run.frames, { w, left, right } = CHART, px = e.clientX - chart.getBoundingClientRect().left;
    const t0 = fr[0].t, t1 = fr[fr.length - 1].t;
    stop(); setFrame(nearestFrame(t0 + (px - left) / (w - left - right) * (t1 - t0)));
    return;
  }
  const ev = e.target.closest('.ev'); if (!ev) return;
  stop();
  setFrame(nearestFrame(+ev.dataset.t));
});
$('summary').addEventListener('change', (e) => { if (e.target.id === 'tzKyr') { tzKyr = +e.target.value; renderRunSummary(); } });

// ------------------------------------------------------------ index / URL
async function loadSelection(value) {
  const [kind, id] = value.split(':');
  const u = new URL(location);
  ['world', 'run', 't'].forEach((k) => u.searchParams.delete(k));
  u.searchParams.set(kind, id); history.replaceState(null, '', u);
  if (kind === 'run') await loadRun(id);
  else {
    const r = await fetch('../worlds/' + id);
    if (!r.ok) throw new Error(`${id}: HTTP ${r.status}`);
    await setWorld(await r.json());
  }
}
$('worldSel').addEventListener('change', (e) => loadSelection(e.target.value));
addPickerFilter($('worldSel'), { placeholder: 'filter: run / world id or name' });  // (pickfilter.js, PW-407)

// drag & drop (works even when opened as a plain file://)
addEventListener('dragover', (e) => { e.preventDefault(); $('drop').style.display = 'flex'; });
addEventListener('dragleave', (e) => { if (e.target === $('drop')) $('drop').style.display = 'none'; });
addEventListener('drop', async (e) => {
  e.preventDefault(); $('drop').style.display = 'none';
  const f = e.dataTransfer.files[0]; if (f) await setWorld(JSON.parse(await f.text()));
});

// URL options, e.g. ?run=19385e&t=120&layer=rainfall&arrows=1  or  ?world=ae28af.json&mode=map&pentas=1
// (&lat=..&lon=..: turn to that place and pick its cell; clicking a cell copies such a link)
// (&hl=N: open highlight number N once its list is found or cached)
// (6-hex ids; world= is the file name with .json; layer= is a viewer layer name, spaces URL-encoded: crust%20age)
function applyUrlOptions() {
  const p = new URLSearchParams(location.search);
  if (p.get('mode')) { state.mode = p.get('mode'); [...$('modeSeg').children].forEach((b) => b.classList.toggle('on', b.dataset.v === state.mode)); controls.enableRotate = state.mode === 'globe'; if (state.mode === 'map') fitMap(); }
  // (&tilt=deg: the flat map seen from the south at that angle, for screenshots of the 3D relief)
  if (p.get('layer')) state.layer = p.get('layer');
  if (p.get('obs')) { state.obs = p.get('obs'); [...$('obsSeg').children].forEach((b) => b.classList.toggle('on', b.dataset.v === state.obs)); }
  for (const id of [...OVERLAY_IDS, 'smooth', 'spin']) if (p.has(id)) $(id).checked = p.get(id) === '1';
  if (p.get('relief')) $('relief').value = p.get('relief');
  if (p.get('relief3d') === '1') {
    $('relief3d').checked = true;
    if (p.get('ex')) $('reliefEx').value = p.get('ex');
    const sn = (p.get('sun') || '').split(',').map(Number);
    if (sn.length === 2 && sn.every(Number.isFinite)) { $('sunAz').value = sn[0]; $('sunEl').value = sn[1]; }
    if (p.get('sea') === '0') $('seaFloor').checked = false;
    setLights(); canRotate();
  }
  if (p.get('season')) setSeason(p.get('season'));
  if (p.get('pft')) state.pft = p.get('pft');
  if (HL_CATS[p.get('hlcat')]) state.hlCat = p.get('hlcat');  // a highlights category: landscape, water, climate, travel, geology, vegetation  // jul | jan: the winds' half-year and the temperature / rain season
  return p;
}
const urlp = applyUrlOptions();
if (urlp.get('tab') === 'zoom') showTab('zoom', urlp.get('zoom'));
$('reliefVal').textContent = $('relief').value + '×';
reliefLabels();

async function getJSON(url) { try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? r.json() : []; } catch { return []; } }
// fills the run/world dropdown from the indexes; returns false when there's nothing
async function fillSelector() {
  const [runs, worlds, zooms] = await Promise.all([getJSON('../runs/index.json'), getJSON('../worlds/index.json'),
                                                  getJSON('../zooms/index.json')]);
  IDX = { runs, worlds, zooms };
  if (!runs.length && !worlds.length) return false;
  const was = $('worldSel').value;
  const opt = (v, label) => `<option value="${v}">${label}</option>`;
  const when = (c) => (c || '').slice(5, 16);  // "MM-DD HH:MM"
  const main = runs.filter((r) => r.kind !== 'timezoom'), tzs = runs.filter((r) => r.kind === 'timezoom');
  $('worldSel').innerHTML =
    (main.length ? `<optgroup label="Tectonic timelines (newest first)">${main.map((r) =>
      opt('run:' + r.dir, `${r.id} · ${r.name} · ${r.myr} Myr · ${when(r.created)}`)).join('')}</optgroup>` : '') +
    (tzs.length ? `<optgroup label="Glacial time zooms (newest first)">${tzs.map((r) =>
      opt('run:' + r.dir, `${r.id} · ${r.name} · ${r.kyr} kyr · ${when(r.created)}`)).join('')}</optgroup>` : '') +
    (worlds.length ? `<optgroup label="Worlds (newest first)">${worlds.map((w) =>
      opt('world:' + w.file, `${w.id} · ${worldTitle(w)}${w.name !== worldTitle(w) ? ' — ' + w.name : ''} · ${when(w.created)}`)).join('')}</optgroup>` : '');
  if (was && [...$('worldSel').options].some((o) => o.value === was)) $('worldSel').value = was;
  return true;
}
// open a run (e.g. a time zoom just made, or a time zoom's source) at time t
async function openRun(id, t) {
  await fillSelector();
  $('worldSel').value = 'run:' + id;
  const u = new URL(location);
  ['world', 'run', 't'].forEach((k) => u.searchParams.delete(k));
  u.searchParams.set('run', id); history.replaceState(null, '', u);
  await loadRun(id, t);
}

async function init() {
  if (!await fillSelector()) {
    infoHtml = null; $('infoText').innerHTML = `No runs or worlds found.<br>Run <code>uv run python -m planet simulate</code> then
      <code>uv run python -m planet serve</code>, or drop a world .json here.`;
    return;
  }
  let want = urlp.get('run') ? 'run:' + urlp.get('run') : urlp.get('world') ? 'world:' + urlp.get('world') : $('worldSel').value;
  $('worldSel').value = want;
  if (want.startsWith('run:')) await loadRun(want.slice(4), urlp.has('t') ? +urlp.get('t') : null);
  else await loadSelection(want);
  if (urlp.has('lat') && urlp.has('lon')) { goToLatLon(+urlp.get('lat'), +urlp.get('lon')); urlp.delete('lat'); urlp.delete('lon'); }
  // ?view=lat,lon: turn the globe there without picking a cell (screenshots)
  if (urlp.has('view')) {  // (at once, no animation)
    const [la, lo] = urlp.get('view').split(',').map(Number);
    $('spin').checked = false;
    if (state.mode !== 'globe') turnTo(la, lo);
    else {
      const d = camera.position.distanceTo(controls.target);
      controls.target.set(0, 0, 0);
      camera.position.copy(new THREE.Vector3(...unitVec(Math.max(-80, Math.min(80, la)), lo)).applyQuaternion(group.quaternion).normalize().multiplyScalar(d));
      camera.lookAt(0, 0, 0);
    }
  }
  // ?dist=: the camera's distance from the centre; ?tilt=deg: the flat map seen from the south at that angle (screenshots)
  const d = +urlp.get('dist') || camera.position.distanceTo(controls.target), tl = +urlp.get('tilt') || 0;
  if (urlp.has('dist') || tl) {
    if (state.mode === 'map') {
      const a = THREE.MathUtils.degToRad(tl), tg = controls.target;
      camera.position.set(tg.x, tg.y - d * Math.sin(a), d * Math.cos(a));
    } else camera.position.setLength(d);
    camera.lookAt(controls.target);
  }
}
$('delBtn').addEventListener('click', async () => {
  const v = $('worldSel').value; if (!v) return;
  const [kind, id] = v.split(':');
  const label = $('worldSel').selectedOptions[0].textContent;
  if (!confirm(`Delete ${label}?\nThis removes it from disk.`)) return;
  const r = await fetch(`../${kind === 'run' ? 'runs' : 'worlds'}/${id.replace(/\.json$/, '')}`, { method: 'DELETE' });
  if (!r.ok) { alert(`Delete failed (HTTP ${r.status}). Is the viewer running via 'python -m planet serve'?`); return; }
  const u = new URL(location); ['world', 'run', 't'].forEach((k) => u.searchParams.delete(k)); history.replaceState(null, '', u);
  urlp.delete('run'); urlp.delete('world'); urlp.delete('t');
  await init();
});
init().catch((err) => { infoHtml = null; $('infoText').textContent = 'Load failed: ' + err.message; console.error(err); });

// headless timing (console: planetViewer.bench()): replay keyframes back to back, each
// painted (setFrame) and drawn, a pixel read back after each so the GPU's time counts;
// then frames drawn with the camera turning and nothing repainted
window.planetViewer = {
  bench(frames = 30) {
    const gl = renderer.getContext(), px = new Uint8Array(4), out = {};
    const draw = () => { controls.update(); fitClip(); renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };
    if (V?.kind === 'run') {
      stop();
      const f0 = V.frame, nf = V.run.frames.length;
      let tp = 0, td = 0;
      state.playing = true;  // (as in a replay: the relief flat-shaded)
      for (let k = 0; k < frames; k++) {
        const t0 = performance.now(); setFrame((f0 + 1 + k) % nf); const t1 = performance.now(); draw();
        tp += t1 - t0; td += performance.now() - t1;
      }
      state.playing = false;
      const ts = performance.now(); setFrame(f0); draw();  // (a still frame: scrubbing, or the replay paused)
      out.still_keyframe_ms = +(performance.now() - ts).toFixed(1);
      Object.assign(out, { keyframe_ms: +((tp + td) / frames).toFixed(1), paint_ms: +(tp / frames).toFixed(1), draw_ms: +(td / frames).toFixed(2),
                           keyframes_per_s: +(1000 * frames / (tp + td)).toFixed(1) });
    }
    const off = camera.position.clone().sub(controls.target), t0 = performance.now(), m = 4 * frames;
    for (let k = 0; k < m; k++) { off.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.02); camera.position.copy(controls.target).add(off); draw(); }
    const ms = (performance.now() - t0) / m;
    return { ...out, still_frame_ms: +ms.toFixed(2), fps: +(1000 / ms).toFixed(0), relief: relief3d(), mode: state.mode,
             vertices: mesh.geometry.attributes.position.count, pixels: [renderer.domElement.width, renderer.domElement.height] };
  },
};

// Draw only when something drawn has changed (PW-415): the camera, any object's transform,
// visibility, geometry, attribute contents (their version), material or texture, or a light.
// Redrawing an unchanged scene every frame bought nothing, and on the owner's Chrome the
// idle redraws were when rivers and marks shimmered (never while the view moved).
let sigPrev = new Float64Array(0), sigNow = new Float64Array(4096), sigN = 0;
const sigPush = (v) => { if (sigN === sigNow.length) { const a = new Float64Array(2 * sigN); a.set(sigNow); sigNow = a; } sigNow[sigN++] = v; };
const sigMat = (m) => { for (const v of m.elements) sigPush(v); };
let attrPrev = new Map(), attrNow = new Map();
function frameChanged() {
  sigN = 0;
  camera.updateMatrixWorld(); scene.updateMatrixWorld();
  sigMat(camera.matrixWorld); sigMat(camera.projectionMatrix);
  const camN = sigN;
  sigPush(renderer.domElement.width); sigPush(renderer.domElement.height);
  attrNow.clear();
  scene.traverse((o) => {
    sigPush(o.id); sigPush(o.visible ? 1 : 0);
    if (!o.visible) return;
    sigMat(o.matrixWorld);
    const g = o.geometry;
    if (g) {
      sigPush(g.id); sigPush(g.drawRange.start); sigPush(g.drawRange.count);
      for (const k in g.attributes) { const a = g.attributes[k], v = a.isInterleavedBufferAttribute ? a.data.version : a.version; sigPush(v); attrNow.set(a, v); }
      if (g.index) { sigPush(g.index.version); attrNow.set(g.index, g.index.version); }
    }
    for (const m of [].concat(o.material || [])) {
      sigPush(m.id); sigPush(m.version); sigPush(m.visible ? 1 : 0); sigPush(m.opacity); sigPush(m.map ? m.map.version : -1);
      if (m.color) { sigPush(m.color.r); sigPush(m.color.g); sigPush(m.color.b); }
      if (m.resolution) { sigPush(m.resolution.x); sigPush(m.resolution.y); }
    }
    if (o.isLight) { sigPush(o.intensity); sigPush(o.color.r); sigPush(o.color.g); sigPush(o.color.b); if (o.groundColor) { sigPush(o.groundColor.r); sigPush(o.groundColor.g); sigPush(o.groundColor.b); } if (o.target) for (const v of o.target.position.toArray()) sigPush(v); }
  });
  sigPush(scene.background?.isColor ? scene.background.getHex() : -1);
  let same = sigN === sigPrev.length, camSame = same;
  for (let i = 0; same && i < sigN; i++) if (sigNow[i] !== sigPrev[i]) { same = false; if (i < camN) camSame = false; }
  if (!camSame && sigN === sigPrev.length) DIAG.n.cam++;
  for (const [a, v] of attrNow) if (attrPrev.get(a) !== undefined && attrPrev.get(a) !== v) DIAG.n.uploads++;
  [attrPrev, attrNow] = [attrNow, attrPrev];
  if (!same) sigPrev = sigNow.slice(0, sigN);
  return !same;
}
// ?dbg=1: a corner readout, refreshed twice a second (counters per second)
let dbgEl = null, dbgAt = 0, dbgN = null;
function dbgReadout(now) {
  if (now - dbgAt < 500) return;
  const gl = renderer.getContext(), dt = (now - dbgAt) / 1000, n = DIAG.n;
  if (!dbgEl) {
    dbgEl = document.createElement('div');
    dbgEl.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:99;font:11px/1.35 monospace;color:#cfe;background:rgba(0,0,0,.65);padding:4px 6px;pointer-events:none;white-space:pre';
    document.body.appendChild(dbgEl);
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    DIAG.gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  }
  const rate = (k) => dbgN ? ((n[k] - dbgN[k]) / dt).toFixed(0) : '-';
  const flags = ['logdepth', 'noaa', 'pdb', 'nodamp', 'fixclip', 'offset', 'always', 'blur', 'rehover'].filter((k) => DIAG[k]).join(' ') + (DIAG.dpr ? ` dpr=${DIAG.dpr}` : '');
  const cv = renderer.domElement;
  dbgEl.textContent = `${DIAG.gpu}\n${gl instanceof WebGL2RenderingContext ? 'webgl2' : 'webgl1'} depth ${gl.getParameter(gl.DEPTH_BITS)} bits, samples ${gl.getParameter(gl.SAMPLES)}, ` +
    `canvas ${cv.width}x${cv.height} css ${cv.clientWidth}x${cv.clientHeight} dpr ${devicePixelRatio}\n` +
    `near ${camera.near.toPrecision(4)} far ${camera.far.toPrecision(4)} cam ${camera.position.toArray().map((v) => v.toFixed(4)).join(',')}\n` +
    `per s: frames ${rate('frames')} renders ${rate('renders')} cam ${rate('cam')} clip ${rate('clip')} uploads ${rate('uploads')} paints ${rate('paints')} overlays ${rate('overlays')} infobox ${rate('info')}\n` +
    `flags: ${flags || 'none'}`;
  dbgN = { ...n }; dbgAt = now;
}
window.planetViewer.diag = DIAG;
renderer.setAnimationLoop((now) => {
  if (state.tab === 'zoom') { sigPrev = new Float64Array(0); return; }  // the globe is hidden (drawn afresh when it's back)
  if (state.playing && V?.kind === 'run' && now - lastAdvance > 1000 / +$('fps').value) {
    lastAdvance = now;
    if (V.frame >= V.run.frames.length - 1) stop(); else setFrame(V.frame + 1);
  }
  if ($('spin').checked && state.mode === 'globe') group.rotation.y += 0.0015;
  controls.update();
  fitClip();
  if (DIAG.offset && mesh) for (const m of mesh.userData.mats) if (!m.polygonOffset) Object.assign(m, { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 4 });
  DIAG.n.frames++;
  if (frameChanged() || DIAG.always) { renderer.render(scene, camera); DIAG.n.renders++; }
  if (DIAG.dbg) dbgReadout(now);
});
</script>
