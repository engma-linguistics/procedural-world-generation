<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peoples workbench · Planet Viewer</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* (the shared tokens are in theme.css; this page's panels are solid, and it calls the border "line") */
  :root { --panel: var(--panel-solid); --line: var(--border); --acc: var(--accent); }
  body { display: grid;
         grid-template-rows: auto auto 1fr; height: 100vh; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  header b { font-size: 15px; margin-right: 8px; }
  nav { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 14px; color: var(--muted); }
  nav button.on { color: var(--text); border-bottom-color: var(--acc); }
  main { overflow: hidden; min-height: 0; }
  .tab { display: none; height: 100%; overflow: auto; padding: 10px 12px; }
  .tab.on { display: block; }
  /* PW-841: the row must be bounded (minmax(0,1fr)) or #tl grows to its content height, never scrolls itself, and its sideways scrollbar sits at the very bottom of a tall list, off screen */
  #tab-tree.on { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr); padding: 0; overflow: hidden; }
  #tlwrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #tlctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 5px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #tlctl .hint { color: var(--muted); font-size: 11px; }
  #tl { flex: 1 1 0; overflow: scroll; position: relative; min-width: 0; min-height: 0; overscroll-behavior: contain; scrollbar-width: auto; cursor: grab; } #tl.panning { cursor: grabbing; user-select: none; }
  #tl .grip { cursor: ew-resize; }
  /* PW-841: the axis stays on top and the names stay on the left when the timeline scrolls */
  #tl svg { display: block; } #axis { position: sticky; top: 0; z-index: 3; background: var(--bg); }
  #lab { position: sticky; left: 0; z-index: 2; }
  /* the corner above the names: opaque, so the scrolled axis never runs under (or over) the controls or the names */
  #corner { position: sticky; top: 0; left: 0; z-index: 5; box-sizing: border-box; height: 34px; margin-bottom: -34px; background: var(--bg); border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 17px 6px 0; white-space: nowrap; overflow: hidden; }
  #side { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px; }
  .hgroup { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 3px 8px 3px 6px; border: 1px solid var(--line); border-radius: 6px; }
  .hgroup + .hgroup { margin-left: 4px; }
  .hlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 2px; }
  header label { display: inline; margin: 0; }
  #world { max-width: 360px; }
  button.primary { background: var(--acc); color: var(--on-accent); border-color: var(--acc); }
  .hmenu { position: relative; }
  .hmenu summary { list-style: none; cursor: pointer; background: var(--ctl); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
  .hmenu summary::-webkit-details-marker { display: none; }
  .hmenu summary::after { content: ' \25BE'; color: var(--muted); }
  .hmenu .hpop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; display: flex; flex-direction: column; gap: 4px; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); white-space: nowrap; }
  /* the tab's help: a "?" at the right of the tabs opens it (PW-1047; it used to be a footer, always on) */
  nav { align-items: center; }
  nav .qbtn { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); font-weight: 600; }
  nav .qbtn[aria-expanded="true"] { color: var(--on-accent); background: var(--acc); border-color: var(--acc); }
  .helpPop { position: fixed; right: 12px; z-index: 40; width: min(560px, calc(100vw - 24px)); max-height: 60vh; overflow: auto;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); color: var(--text); }
  button, select, input { background: var(--ctl); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font: inherit; }
  .filebtn { display: inline-block; margin: 0; background: var(--ctl); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; cursor: pointer; }
  .filebtn:hover { border-color: var(--acc); }
  button { cursor: pointer; } button:hover { border-color: var(--acc); }
  input[type=number] { width: 70px; } input.wide { width: 100%; }
  label { display: block; margin: 5px 0 2px; color: var(--muted); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .trait { display: inline-block; margin: 2px 8px 2px 0; color: var(--text); }
  svg text { fill: var(--text); font-size: 11px; } svg .axis text { fill: var(--muted); }
  .bar { cursor: grab; } .sel rect.bg { fill: #233047; }
  h3 { margin: 12px 0 4px; font-size: 13px; } h2 { font-size: 14px; margin: 4px 0 8px; }
  table.t { border-collapse: collapse; font-size: 12px; }
  table.t th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; color: var(--muted); padding: 4px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 2px 5px; border-bottom: 1px solid #1c2430; vertical-align: top; }
  table.t tr.off td { opacity: .4; }
  table.t td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.t input[type=number] { width: 62px; padding: 2px 4px; } table.t input.s { width: 48px; } table.t input.txt { width: 150px; padding: 2px 4px; }
  table.t select { padding: 2px 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .kpi { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
  .kpi div b { display: block; font-size: 17px; } .kpi div span { color: var(--muted); font-size: 11px; }
  pre.map { font: 10px/10px ui-monospace, monospace; margin: 0; letter-spacing: 0; background: #0a1a2a; padding: 6px; display: inline-block; }
  .bars { display: inline-block; height: 8px; background: var(--acc); opacity: .7; vertical-align: middle; border-radius: 2px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .lmcol { overflow-x: auto; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } #tab-tree.on { grid-template-columns: 1fr; } }
  .hint { max-width: 900px; color: var(--muted); margin: 0 0 8px; }
</style>
</head>
<body>
<!-- two groups (PW-1047): the tree being edited (pick, save, import / export), and the run (world, tries, Run, status) -->
<header>
  <b>Peoples workbench</b>
  <div class="hgroup" role="group" aria-label="Tree">
    <span class="hlabel">Tree</span>
    <select id="trees" title="Presets and saved trees"></select>
    <button id="load" title="Open the tree picked on the left (unsaved changes to the current one are lost)">Open</button>
    <input id="saveName" size="12" placeholder="my-peoples" title="The name the tree is saved under (a new name saves a copy)">
    <button id="save" title="Save the tree under the name on the left">Save</button>
    <details class="hmenu"><summary title="Download the tree as a file, or open one">Import / Export</summary>
      <div class="hpop"><button id="download" title="Save the tree as a .json file on this computer">Download as file</button>
        <label class="filebtn" title="Open a tree saved with Download as file">Open a file…<input type="file" id="upload" accept=".json" hidden></label></div></details>
  </div>
  <div class="hgroup" role="group" aria-label="Run">
    <span class="hlabel">Run</span>
    <button id="favBtn" title="Star this world as a favourite (kept by the server; the default world here)" aria-pressed="false" disabled>&#9734;</button><select id="world" title="Finished worlds whose time zoom is still stored (peoples run on the ice-age history). Starred ones (&#9733;) are your favourites; the first one is the default."></select>
    <label class="muted" title="List only the worlds you starred (when there are any)"><input type="checkbox" id="favOnly"> starred only</label>
    <span class="muted">tries</span><input id="tries" type="number" value="3" min="1" max="8" title="How many tries to make; the one that best meets the wishes is kept">
    <button id="run" class="primary">Run on world</button>
    <span id="status" class="muted"></span> <a id="globe" hidden>Open on the globe</a>
    <label class="muted" title="Optional: the year the present is, so dates read as years ('year 1400') and can be typed that way. Empty: '12,400 years ago'. Kept in this browser, per run."><nobr>present is year <input id="presentYear" type="number" step="1" style="width:70px" placeholder="(not set)"></nobr></label>
  </div>
  <span style="flex:1"></span>
  <a href="index.html" title="Back to the globe viewer">Viewer</a>
</header>
<nav id="tabs">
  <button data-tab="tree" title="The peoples tree: every line of the family tree you are editing, on a time axis (the workbench tree)">Peoples tree &amp; timeline</button>
  <button data-tab="cultures" title="Cultures that grew out of the peoples as they spread: a part that took to new country, or lived apart long enough (PW-670). Kept apart from the species tree">Cultures</button>
  <button data-tab="peoples">Peoples</button>
  <button data-tab="places">Places &amp; land use</button>
  <button data-tab="wishes">Wishes</button>
  <button data-tab="results">Results</button>
  <button data-tab="brief" title="The food sheet for a culture or a whole people: land, fuels, staples, drinks, who eats together, what it won't eat (the culinary brief, PW-728, PW-1391)">Culinary brief</button>
  <button data-tab="tech">Technology</button>
  <button data-tab="religion" title="Gods, faiths and taboos of the picked peoples run: small god trees, a map of where each faith arose and spread, a faith timeline, each culture's taboos (PW-1358, PW-1311)">Religion</button>
  <button data-tab="polities" title="States and war of the picked peoples run: the invasions you schedule (who comes down on whom, when, from where, how hard) and what came of them, beside the incursions the history found on its own (PW-1433)">States &amp; war</button>
  <span style="flex:1"></span>
  <button id="helpBtn" class="qbtn" aria-expanded="false" aria-controls="foot" title="What this tab shows and how to use it">?</button>
</nav>
<main>
  <section class="tab" id="tab-tree"><div id="tlwrap"><div id="tlctl"><label for="tlView" style="margin:0">show</label> <select id="tlView" title="Which lines the tree draws: every line (stems and species), only the peoples (stems left out), peoples with their cultures (groups, e.g. the human, orc and lizardfolk ways of life), or with each people's regional populations">
<option value="species">species and stems</option><option value="peoples" title="only the lines that are peoples: the stems that only split into others are left out">peoples only</option><option value="cultures" title="the species with the cultures (groups) inside each people">species + cultures</option><option value="demes" title="each people's regional populations (demes, PW-981) from the picked peoples run: where sea, hard country or distance cut a people, dated splits, fusions and ends">species + regional populations</option></select> <button id="tlFit" title="Fit the whole timeline into the window width (otherwise at least 1100 px, scrolling sideways; drag the background or shift+wheel to pan)">fit all</button><span class="hint" id="tlHint"></span></div><div id="tl"><div id="corner">years ago</div><svg id="axis"></svg><svg id="svg"></svg><svg id="lab"></svg></div></div><div id="side"></div></section>
  <section class="tab" id="tab-cultures"></section>
  <section class="tab" id="tab-peoples"></section>
  <section class="tab" id="tab-places"></section>
  <section class="tab" id="tab-wishes"></section>
  <section class="tab" id="tab-results"></section>
  <section class="tab" id="tab-tech"></section>
  <section class="tab" id="tab-brief"></section>
  <section class="tab" id="tab-religion"></section>
  <section class="tab" id="tab-polities"></section>
</main>
<div id="foot" class="helpPop" role="note" hidden></div>
<script src="numfmt.js"></script>
<script src="techtab.js"></script>
<script src="religiontab.js"></script>
<script src="invasiontab.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ORIGIN_COL = { split: '#9fd18b', root: '#e3c26b', arrival: '#c79bff', hybrid: '#ff9d6b', template: '#ff6b9a', group: '#6bd6d0' };
// The option lists and defaults come from the server (GET /api/lineage-schema: planet/lineages/spec.py, land.GOODS,
// dragon_ages; PW-1033), so they can't drift from what a tree may say; loadSchema() fills these before anything renders.
// Only the wording of the menus lives here.
let SCHEMA, TRAITS, PLACES, WANTS, GOODS, GROUPS, BAND, DEMO_DEFAULT, DEMOGRAPHY, DEMO_KEYS, BODY_DEFAULT, BODY_FIELDS, TOXINS, DEFAULTS;
// senses and bodies (PW-694, spec.BODY_DEFAULT / BODY_CHOICES): the culinary brief reads them; fire = false is read by the fuels
const BODY_LABELS = { sweet: 'tastes sweet', milk: 'digests milk as an adult (or the share of the people that does)', milks: 'milks its animals', capsaicin: 'feels capsaicin heat',
  bitter: 'bitter sensitivity', smell: 'smell acuity', diet: 'diet', raw_meat: 'tolerates raw meat', cellulose: 'digests cellulose',
  suction: 'suction (sucking a drink)', teeth: 'teeth', gut: 'gut', salt: 'salt', display: 'display organ', shed: 'who sheds the display', display_sex: 'who carries the display',
  hours: 'active hours', thermo: 'body heat', fire: 'cooks with fire', grain: 'grain in the diet' };
const MILK_SHARES = [0.1, 0.25, 0.5, 0.75];
const PORTAL_LABELS = { off: 'at their best habitat', random: 'through portals at random', sites: 'through portals at interesting sites', wandering: 'through wandering thinnings (drift, open, close)' };
const BREEDING_LABELS = { slow: 'slow (2x a generation)', mammal: 'mammal (3.5x)', brood: 'brood (7x)' };  // (lane 78: Rmax per generation, life_history.BREEDING)
const GENERATION_LABELS = { schedule: 'from the schedule', schedule_mass: 'fecundity ~ size', line: 'the lines\' own' };  // (milk may also be the lactase share of the people)
const TOXIN_LABELS = { alliums: 'alliums (onion, garlic)', theobromine: 'theobromine (chocolate)' };
async function loadSchema() {
  const r = await fetch('../api/lineage-schema');
  if (!r.ok) throw new Error(`lineage-schema: HTTP ${r.status}`);
  const d = SCHEMA = await r.json();
  TRAITS = d.traits; PLACES = d.places; WANTS = [...d.pair_wants, ...PLACES]; GOODS = d.goods; GROUPS = d.groups; BAND = d.band;
  DEMO_DEFAULT = d.demo_default; DEMOGRAPHY = d.demography; DEMO_KEYS = Object.keys(DEMO_DEFAULT); BODY_DEFAULT = d.body_default; DEFAULTS = d.defaults;
  const keys = [...Object.keys(BODY_LABELS), ...Object.keys(BODY_DEFAULT).filter((k) => !(k in BODY_LABELS) && k !== 'toxic')].filter((k) => k in BODY_DEFAULT);
  BODY_FIELDS = keys.map((k) => [k, BODY_LABELS[k] || k, d.body_choices[k] || (k === 'milk' ? [true, false, ...MILK_SHARES] : [true, false])]);
  TOXINS = d.toxins.map((t) => [t, TOXIN_LABELS[t] || t]);
}
function bodyOf(r, seen = new Set()) {  // the body a line runs with: its own keys over its first parent's (spec.parse)
  if (seen.has(r.id)) return { ...BODY_DEFAULT };
  seen.add(r.id);
  const p = parentsOf(r).map((x) => byId()[x]).filter(Boolean)[0];
  return { ...(p ? bodyOf(p, seen) : BODY_DEFAULT), ...(r.body || {}) };
}
const bodyInput = (r, k, opts) => {  // (opts: the choices; a flag may also be a share of the people, 0..1)
  const own = r.body?.[k], inh = bodyOf({ ...r, body: {} })[k], lab = (v) => (v === true ? 'yes' : v === false ? 'no' : typeof v === 'number' ? Math.round(100 * v) + '% of the people' : String(v).replace('_', ' '));
  if (typeof own === 'number' && !opts.includes(own)) opts = [...opts, own];
  return `<select data-b="${k}"><option value="" ${own == null ? 'selected' : ''}>(${lab(inh)})</option>${opts.map((v) => `<option value="${v}" ${own === v ? 'selected' : ''}>${lab(v)}</option>`).join('')}</select>`;
};
let T = null, sel = null, result = null;  // the raw tree (the input's shape), the selected id, a run's meta (+ id)
const q = new URLSearchParams(location.search);

function kyrOf(v) {  // "8 Myr" / "450 kyr" / "12000 yr" / a bare number (kyr) -> kyr (spec.parse_ago)
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const d = NumFmt.parseDate(v, 'kyr');  // (also "year 1400" / "300 before year 1" / "12,400 years ago" once the present is set, PW-1429)
  if (d != null) return d;
  const m = String(v).trim().match(/^([0-9.eE+-]+)\s*(myr|ma|mya|kyr|ka|kya|yr|y|years?|bp)?/i);
  if (!m) return null;
  const x = +m[1], u = (m[2] || 'kyr').toLowerCase();
  return ['myr', 'ma', 'mya'].includes(u) ? x * 1000 : ['yr', 'y', 'year', 'years', 'bp'].includes(u) ? x / 1000 : x;
}
const { kyr: fmt, count: num, ago } = NumFmt;  // (the viewer's shared number formats, numfmt.js)
const parentsOf = (r) => r.parents ? [].concat(r.parents) : r.group_of ? [r.group_of] : r.parent ? [r.parent] : [];
const groupsOf = (id) => T.lineage.filter((x) => originOf(x) === 'group' && parentsOf(x)[0] === id);  // (ways of life within a people, PW-665)
const originOf = (r) => r.origin || (parentsOf(r).length ? 'split' : 'root');
const byId = () => Object.fromEntries(T.lineage.map((r) => [r.id, r]));

// what a line inherits (spec.parse: anything left out comes from the first parent; hybrids merge traits)
function inherited(r, key, seen = new Set()) {
  if (r[key] != null && r[key] !== '') return r[key];
  if (seen.has(r.id)) return undefined;
  seen.add(r.id);
  const ps = parentsOf(r).map((p) => byId()[p]).filter(Boolean);
  if (!ps.length) return undefined;
  if (key === 'traits' && originOf(r) === 'hybrid') return [...new Set(ps.flatMap((p) => inherited(p, 'traits', seen) || []))].sort();
  if (DEMO_KEYS.includes(key) && !['split', 'group'].includes(originOf(r))) return undefined;  // (only splits and groups inherit demography)
  return inherited(ps[0], key, seen);
}
function demography(traits) {  // spec.demography
  const out = { ...DEMO_DEFAULT };
  for (const k of DEMO_KEYS) {
    const vals = traits.filter((t) => t !== 'insular' && DEMOGRAPHY[t]?.[k] != null).map((t) => DEMOGRAPHY[t][k]);
    if (vals.length) out[k] = k === 'insularity' ? Math.min(...vals) : Math.max(...vals);
    if (traits.includes('insular') && DEMOGRAPHY.insular[k] != null) out[k] = DEMOGRAPHY.insular[k];
  }
  return out;
}
const RUNG_NAMES = {forager: 'foraging', fisher: 'fishing', garden: 'gardens', plough: 'plough', irrigation: 'irrigation', nomad: 'herding',
  agro_pastoral: 'fields + herds', hold: 'hold', raider: 'raiding'};
function ladderTitle() {  // the shared ladder (lineages.ladder.TABLE): every rung's number, what it reads and its sourced range
  return 'The density ladder (people per km², a people\'s mean over its land at the reference land quality):\n' +
    (SCHEMA.ladder || []).map(([r, n, how, src]) => `${RUNG_NAMES[r] || r}: ${n}; reads ${how}; sources ${src}`).join('\n');
}
function rungCell(p) {  // a people's place on the ladder at the last run's present: its main rung and mean density, the rest on hover
  if (!p || !p.ladder) return p?.density != null ? `${p.density}` : '';
  const rows = Object.entries(p.ladder).sort((a, b) => b[1][0] - a[1][0]);
  const t = rows.map(([r, [sh, mkm2, d]]) => `${RUNG_NAMES[r] || r}: ${Math.round(100 * sh)}% of its people, ${mkm2} Mkm², ${+d.toPrecision(2)} /km²`).join('\n');
  return `<span title="${esc(t + '\n\n' + ladderTitle())}">${esc(RUNG_NAMES[p.rung] || p.rung || '')} · ${+(+p.density).toPrecision(2)}</span>`;
}
function demoOf(r) {  // the value a line runs with, and whether it was given on it ('own'), inherited or from traits
  const tr = inherited(r, 'traits') || [], d = demography(tr), out = {};
  for (const k of DEMO_KEYS) {
    if (r[k] != null && r[k] !== '') out[k] = [+r[k], 'own'];
    else { const v = inherited(r, k); out[k] = v != null ? [+v, 'inherited'] : [d[k], 'traits']; }
  }
  return out;
}

function effective() {  // what switching lines off does (spec.parse): which lines go, who re-parents
  const ids = byId(), off = new Set(T.lineage.filter((r) => r.enabled === false).map((r) => r.id));
  let ch = true;
  while (ch) { ch = false; for (const r of T.lineage) if (!off.has(r.id) && ['hybrid', 'template', 'group'].includes(originOf(r)) && parentsOf(r).some((p) => off.has(p))) { off.add(r.id); ch = true; } }
  const parent = {};
  for (const r of T.lineage) {
    if (originOf(r) !== 'split') continue;
    let p = ids[parentsOf(r)[0]];
    while (p && off.has(p.id) && originOf(p) === 'split') p = ids[parentsOf(p)[0]];
    parent[r.id] = p && !off.has(p.id) ? p.id : null;
  }
  return { off, parent };
}
const resLine = (id) => result?.lineages?.find((l) => l.id === id);
const resPres = (id) => result?.present?.lines?.[id];
// the last run's life history of a line (lane 78)
const lifeCell = (id) => { const lh = (result?.lineages || []).find((l) => l.id === id)?.life_history; if (!lh) return '';
  const e = lh.by_era || {}, f = e.forager || {};
  return `<span title="${esc(Object.entries(e).map(([k, v]) => `${k}: T ${v.T} yr, r ${v.r_pct}%/yr (x${v.x}), ${Math.round(100 * v.adult_share)}% reach adulthood, it bears a steady loss of ${v.sustain_pct}%/yr at half its numbers; annual mortality ${v.mortality.map((m) => (100 * m).toFixed(1) + '%').join(' / ')}`).join('\n'))}">${f.T} · ×${f.x}</span>`; };
const colorOf = (r) => resLine(r.id)?.color || r.color || ORIGIN_COL[originOf(r)] || '#aaa';

// ---- tabs ----------------------------------------------------------------------------------------
const FOOT = {

function editLine(r, el) {

  else if (k === 'group_of') { r.group_of = el.value; delete r.parents; }
  else if (k === 'prefers' || k === 'avoids' || k === 'tolerates' || k === 'traits') r[k] = el.value.split(',').map((s) => s.trim()).filter(Boolean);

  } else if (k === 'extinct') { if (el.value.trim()) r.extinct = el.value.trim(); else delete r.extinct; }
  else if (k === 'sapient') { if (el.value.trim()) r.sapient = el.value.trim(); else delete r.sapient; }
  else if (k === 'animals') { if (el.checked) r.animals = true; else delete r.animals; }
  else if (k === 'exempt') { if (el.checked) r.exempt = true; else delete r.exempt; }
  else if (k === 'cities') { if (el.checked) r.cities = true; else delete r.cities; }
  else if (k === 'id') {
    const old = r.id; r.id = el.value.trim();

                at: fmt(Math.min(6, (kyrOf(par.at) || 10) / 2)) };
    T.lineage.push(r); sel = r.id; openGroups.add(par.id);
    if (tab !== 'peoples') { showTab('tree'); return; }
  } else if (d.opengroups != null) { openGroups.has(d.opengroups) ? openGroups.delete(d.opengroups) : openGroups.add(d.opengroups); }
  else if (d.tabgo != null) { showTab(d.tabgo); return; }
  else if (id === 'del' && sel) {
    const r = byId()[sel];
    if (T.lineage.some((x) => parentsOf(x).includes(sel)) && !confirm(`${sel} has descendants; delete anyway? (switching it off keeps them)`)) return;
    T.lineage = T.lineage.filter((x) => x !== r); sel = null;
  } else if (id === 'addWish') (T.wish = T.wish || []).push({ a: wishFor || T.lineage[0].id, want: 'near', b: T.lineage[1]?.id, weight: 1 });
  else if (d.wdel != null) T.wish.splice(+d.wdel, 1);
  else if (id === 'addUse') (T.use = T.use || []).push({ by: 'agricultural', good: 'fertile', weight: 1 });
  else if (d.udel != null) T.use.splice(+d.udel, 1);
  else if (d.pick != null) { sel = d.pick; showTab('tree'); return; }
  else if (d.wishfor != null) { wishFor = d.wishfor; showTab('wishes'); return; }
  else if (d.sort != null) { peopleSort = peopleSort === d.sort ? `-${d.sort}` : d.sort; }
  else return;
  redraw();
});

// PW-752: who can have children together, from the run's contact record (meta.contacts): the peoples in contact now by interfertility
// stage (realistic genetics: viable, absorbed into a parent people, sterile, impossible), and the mixed peoples born of a pair
function kinship(res, nm, sw) {
  const STAGES = SCHEMA?.stages || [], NOTES = SCHEMA?.stage_notes || {};
  const pairs = (res.contacts?.pairs || []).filter((p) => p.in_contact_now && res.present?.lines?.[p.a] && res.present?.lines?.[p.b]);
  if (!pairs.length) return '';
  const stOf = (p) => p.stage || STAGES[+String(p.tier).slice(1)];
  const tree = Object.fromEntries((res.tree?.lineage || []).map((r) => [r.id, r]));
  const hyb = (res.lineages || []).filter((l) => l.origin === 'hybrid');
  const lp = res.present?.lines || {};
  let h = `<h2>Who can have children together <span class="muted" style="font-weight:normal;font-size:12px">(peoples in contact today, by how long ago they split: realistic genetics, PW-752)</span></h2>`;
  if (hyb.length) {
    h += '<table class="t"><tr><th>mixed people</th><th>parents</th><th>why possible</th><th>people</th><th>Mkm²</th><th>own land Mkm²</th></tr>';
    for (const l of hyb) {
      const p = pairs.find((q) => [q.a, q.b].sort().join() === [...l.parents].sort().join());
      const st = p ? stOf(p) : null, v = lp[l.id];
      h += `<tr><td>${sw(l.id)}${nm(l.id)}</td><td>${l.parents.map(nm).join(' + ')}</td><td class="muted">${tree[l.id]?.exempt ? 'genre exemption' + (st ? ` (by descent: ${st})` : '') : st || 'parents not in contact'}</td>
        <td class="n">${v ? num(v.population ?? 0) : '<span class="err">none</span>'}</td><td class="n">${v?.area_mkm2 ?? ''}</td><td class="n">${v?.own_mkm2 ?? ''}</td></tr>`;
    }
    h += '</table>';
  }
  h += '<table class="t"><tr><th>stage</th><th>what it means</th><th>pairs in contact today</th></tr>';
  for (const st of STAGES) {
    const ps = pairs.filter((p) => stOf(p) === st);
    if (!ps.length) continue;
    const show = st === 'impossible' ? `${ps.length} pairs` : ps.map((p) => `<span style="white-space:nowrap">${sw(p.a)}${nm(p.a)} + ${sw(p.b)}${nm(p.b)}${p.split_kyr != null ? ` <span class="muted">(${fmt(p.split_kyr)})</span>` : ''}</span>`).join('; ');
    h += `<tr><td><b>${st}</b></td><td class="muted">${esc(NOTES[st] || '')}</td><td>${show}</td></tr>`;
  }
  return h + '</table>';
}

    : `<table class="t" style="margin-top:8px"><tr><th title="Towns of the settlement ledger that a big trade route passes (globe: Overlays > Trade routes)">Trading towns</th><th>kind</th><th class="n">people</th><th class="n" title="the largest share of one kind of goods' trade between cultures in the world that passes through it">share</th><th>goods passing</th><th title="a foreign culture whose goods are a quarter or more of what passes lives there as a merchant quarter (Curtin's trade diasporas)">merchant quarters</th></tr>${fr.hubs.map((h) => `<tr><td>${esc(h[0] || '')}</td><td>${esc(h[1])}${h[6] ? ' <span class="muted" title="a long-haul route passes it: fine goods, or goods carried more than ~500 km (PW-1515)">· long-haul</span>' : ''}</td><td class="n">${fmtPeople(h[2])}</td><td class="n">${(100 * h[3]).toFixed(1)}%</td><td>${esc(h[4].map((g) => (G[g] ? G[g].label : g)).join(', '))}</td><td>${esc(h[5].join(', '))}</td></tr>`).join('')}</table>`;
  const through = d.rows.filter((r, k) => !k || (r.lacks || []).join() !== (d.rows[k - 1].lacks || []).join()).map((r) => `<span title="${esc(r.line)}" style="white-space:nowrap">${esc(ago(r.ago_kyr))}: ${esc((r.lacks || []).map((g) => G[g].label).join(', ') || 'lacks nothing')}</span>`).join(' · ');
  el.innerHTML = `<h3 style="margin:0 0 4px">Trade: goods <span class="muted" style="font-weight:normal;font-size:12px">${esc(d.name)}, ${esc(ago(row.ago_kyr))}${row.as !== d.culture ? ' (its land then held by culture ' + row.as + ')' : ''}</span></h3>
    <p style="margin:0 0 6px">${esc(row.line)}</p>
    <p class="muted" style="margin:0 0 6px;font-size:12px">Share: of the culture's people, weighted by how rich the land is. Surplus: what its own land gives beyond its own need. Lacks: what its ways of life want (herders grain, farmers salt and metal, towns grain, fuel and fine goods, foragers ornaments and, beside farmers, starch and salt) but do not have at home. Hover a good for the layer it comes from. "Comes from" and "goes to": the two biggest partners for that good, how far and by what way (land, river, sea, or flyers' air), and the kind of exchange (gift, barter, market, merchant, tribute); hover for the share. A read-out after the run: it does not change the history.</p>
    <div class="row" style="gap:18px;align-items:flex-start">${side(row.surplus, 'Surplus', '#3f7d3a', 'beyond its own need', 'goes to', goes)}${side(row.lack, 'Lacks', '#a04545', 'wanted but not at home', 'comes from', comes)}</div>
    ${partners}
    ${hubs}
    <p class="muted" style="margin:8px 0 0;font-size:12px">Lacks through time (where they change): ${through}</p>`;
}
function drawReligion() {
  const el = $('tab-religion');
  if (!result) {
    const mine = worldRuns();
    if (mine.length && !drawReligion.busy && !new URLSearchParams(location.search).get('run')) { drawReligion.busy = true; showResult(mine[0].dir).finally(() => { drawReligion.busy = false; }); }
    el.innerHTML = '<p class="muted" style="padding:10px 12px">Pick a peoples run in the Results tab (or run the tree on a world) to see its religion.</p>'; return;
  }
  ReligionTab.draw(el, result);
}
// ---- the states and war tab (polities.py, invasions.py, contacts.py: invasiontab.js, PW-1433) ----------------------------------------
function drawPolities() {
  const el = $('tab-polities');
  if (!result) {
    const mine = worldRuns();
    if (mine.length && !drawPolities.busy && !new URLSearchParams(location.search).get('run')) { drawPolities.busy = true; showResult(mine[0].dir).finally(() => { drawPolities.busy = false; }); }
    el.innerHTML = '<p class="muted" style="padding:10px 12px">Pick a peoples run in the Results tab (or run the tree on a world) to schedule invasions in it.</p>'; return;
  }
  if (!result.settlements) { el.innerHTML = `<p class="muted" style="padding:10px 12px">Run ${esc(result.id)} has no settlement ledger, so it has no states to invade with. Run the peoples again from the Tree tab.</p>`; return; }
  InvasionTab.draw(el, result);
}
// ---- the technology tab (techtree.py, PW-675; its six views: techtab.js, PW-913) -------------------------------------------
function drawTech() {
  const el = $('tab-tech');
  if (!result) {
    const mine = worldRuns();
    if (mine.length && !drawTech.busy) { drawTech.busy = true; showResult(mine[0].dir).finally(() => { drawTech.busy = false; }); }
    el.innerHTML = '<p class="muted" style="padding:10px 12px">Pick a peoples run in the Results tab (or run the tree on a world) to see its technology.</p>'; return;
  }
  if (!result.techtree) { el.innerHTML = `<p class="muted" style="padding:10px 12px">Run ${esc(result.id)} has no technology tree yet (it is older than the tree). Run the peoples again from the Tree tab to get one.</p>`; return; }
  TechTab.draw(el, result);
}
function discoverySvg(lms, L) {  // each landmass on a log time axis, a dot per arrival, the first larger
  const rows = lms.filter((m) => m.area_mkm2 >= 0.3 && m.arrivals?.length).slice(0, 12);
  if (!rows.length) return '';
  const W = 560, X0 = 150, RH = 18, H = 24 + rows.length * RH;
  const lo = Math.log10(0.1), hi = Math.log10(20000), x = (k) => X0 + (1 - (Math.log10(Math.max(k, 0.1)) - lo) / (hi - lo)) * (W - X0 - 10);
  let s = `<svg width="${W}" height="${H}" style="display:block;margin-bottom:6px"><g class="axis">`;
  for (const k of [1, 10, 100, 1000, 10000]) s += `<line x1="${x(k)}" x2="${x(k)}" y1="14" y2="${H}" stroke="#1f2836"/><text x="${x(k)}" y="11" text-anchor="middle">${fmt(k)}</text>`;
  s += '</g>';
  rows.forEach((m, i) => {
    const y = 24 + i * RH;
    s += `<text x="4" y="${y + 4}">${esc(m.name.replace(/^the /, '').replace(/ \(.*\)$/, '').slice(0, 24))}</text>`;
    m.arrivals.forEach((a, j) => { s += `<circle cx="${x(a.ago_kyr)}" cy="${y}" r="${j ? 3 : 5}" fill="${L[a.by]?.color || '#888'}" opacity="${j ? 0.8 : 1}" ${j ? '' : 'stroke="#fff"'}><title>${esc(L[a.by]?.name || a.by)} ${ago(a.ago_kyr)} (${esc(a.how)})</title></circle>`; });
  });
  return s + '</svg>';
}

// ---- load, save, run -----------------------------------------------------------------------------------
const status = (msg, err) => { $('status').innerHTML = err ? `<span class="err">${esc(msg)}</span>` : esc(msg); };
async function listTrees(pick) {
  try {
    const r = await (await fetch('../api/lineage-trees')).json();
    $('trees').innerHTML = r.trees.map((t) => `<option value="${t.name}" ${t.name === pick ? 'selected' : ''}>${t.name} (${t.kind})</option>`).join('');
  } catch { status('no server API: load or download files only', true); }
}
async function loadTree(name) {
  const r = await fetch(`../api/lineage-tree?name=${encodeURIComponent(name)}`);
  const j = await r.json();
  if (!r.ok) return status(j.error || r.status, true);
  T = j; T.wish = T.wish || []; T.use = T.use || []; sel = null; $('saveName').value = name === 'dnd' ? 'my-peoples' : name;
  redraw(); status(`loaded ${name}: ${T.lineage.length} peoples`);
}
$('load').onclick = () => loadTree($('trees').value);
$('save').onclick = async () => {
  const name = $('saveName').value.trim();
  const r = await fetch(`../api/lineage-tree?name=${encodeURIComponent(name)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(T) });
  const j = await r.json();
  if (!r.ok) return status(j.error, true);
  status(`saved ${name}`); listTrees(name);
};
$('download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(T, null, 1)], { type: 'application/json' }));
  a.download = `${$('saveName').value.trim() || 'peoples'}.json`; a.click();
};
$('upload').onchange = async (e) => {
  try { T = JSON.parse(await e.target.files[0].text()); T.wish = T.wish || []; T.use = T.use || []; sel = null; redraw(); status('loaded file'); }
  catch (err) { status(`not a tree: ${err}`, true); }
};
$('run').onclick = async () => {
  const ref = $('world').value;
  if (!ref) return status('pick a finished world (none has its time zoom stored: make a time zoom and finish a world from it in the viewer)', true);
  const target = ref.startsWith('tz:') ? { timezoom: ref.slice(3) } : { world: ref };
  $('globe').hidden = true;
  status('running… (~20 s a try at L6, ~1 min at L7)');
  $('run').disabled = true;
  try {
    const r = await fetch('../api/lineages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...target, raw: T, tries: +$('tries').value }) });
    const j = await r.json().catch(() => ({ error: `the server answered HTTP ${r.status}` }));
    if (!r.ok) return status(j.error, true);
    // queued on the server's job queue: follow it (planets.js trackJob rides out a server restart, PW-1044)
    const { trackJob } = await import('./planets.js');
    const s = await trackJob(j.job, (p) => { if (p.status !== 'done' && p.status !== 'error') status(`${p.status}: ${Math.round(100 * (p.progress || 0))}% ${p.message || ''}`); });
    if (s.status === 'error') return status(s.error, true);
    await listWorlds(); await showResult(s.run); showTab('results');
  } catch (err) { status(`the run stopped: ${err.message}`, true); } finally { $('run').disabled = false; }
};
async function showResult(id) {
  const run = await (await fetch(`../runs/${id}/run.json`, { cache: 'no-store' })).json();
  NumFmt.run = id; $('presentYear').value = NumFmt.present() ?? '';
  result = { id, ...run.meta };  // (result.culturesDoc: fetched by the Cultures tab when first shown, /api/cultures)
  if (run.meta.demes?.file) try { result.demesDoc = await (await fetch(`../runs/${id}/${run.meta.demes.file}`, { cache: 'no-store' })).json(); } catch { result.demesDoc = null; }  // (PW-981)
  status(`run ${id}`);
  const g = $('globe');
  g.href = `index.html?run=${encodeURIComponent(id)}&layer=peoples`; g.hidden = false;
  redraw();
}
// favourites (planet/favourites.py, kept by the server): starred worlds list first and the first of them is the default pick
let favs = new Set();
async function getFavs() {
  try { return new Set(((await (await fetch('../api/favourites?kind=world', { cache: 'no-store' })).json()).favourites || []).map((e) => e.id)); } catch { return new Set(); }
}
function syncFav() {
  const w = $('world').value, ok = /^[0-9a-zA-Z_-]+$/.test(w), on = ok && favs.has(w), b = $('favBtn');
  b.disabled = !ok; b.textContent = on ? '\u2605' : '\u2606'; b.style.color = on ? 'var(--star)' : ''; b.setAttribute('aria-pressed', String(on));
}
$('favBtn').onclick = async () => {
  const id = $('world').value;
  const r = await fetch('../api/favourites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'world', id, starred: !favs.has(id) }) }).catch(() => null);
  if (!r || !r.ok) return status('could not save the favourite', true);
  await listWorlds(); $('world').value = id; syncFav();
};
$('favOnly').onchange = () => listWorlds();
$('presentYear').value = NumFmt.present() ?? '';  // "the present is year N" (numfmt.js, PW-1429): every date reads as a year; kept per run
$('presentYear').onchange = () => { NumFmt.setPresent($('presentYear').value); redraw(); };
// the world picker: finished worlds whose time zoom is still stored, newest first; ?world= / ?timezoom= name one not listed
async function listWorlds() {
  const get = async (u) => { try { return await (await fetch(u, { cache: 'no-store' })).json(); } catch { return []; } };
  const [worlds, runs] = await Promise.all([get('../worlds/index.json'), get('../runs/index.json')]);
  const tzs = new Set(runs.filter((r) => r.kind === 'timezoom' && !r.phase).map((r) => r.dir));
  peoplesRuns = runs.filter((r) => r.kind === 'peoples').sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  const have = new Set(peoplesRuns.map((r) => r.world));
  favs = await getFavs();
  let ok = worlds.filter((w) => w.timezoom && tzs.has(w.timezoom)).sort((a, b) => (favs.has(b.id) - favs.has(a.id)) || b.created.localeCompare(a.created));  // (favourites first)
  if ($('favOnly').checked && ok.some((w) => favs.has(w.id))) ok = ok.filter((w) => favs.has(w.id));
  const opts = ok.map((w) => `<option value="${esc(w.id)}">${favs.has(w.id) ? '\u2605 ' : ''}${esc(w.id)} · ${esc(w.name)}${have.has(w.id) ? ' (has peoples)' : ''}</option>`);
  const want = q.get('world'), tz = q.get('timezoom');
  if (want && !ok.some((w) => w.id === want)) opts.unshift(`<option value="${esc(want)}">${esc(want)} (not runnable?)</option>`);
  if (tz) opts.unshift(`<option value="tz:${esc(tz)}">time zoom ${esc(tz)}</option>`);
  const cur = $('world').value;  // (kept on a refresh; on the first load the first option is the default: the newest favourite if there is one)
  $('world').innerHTML = (opts.length ? '' : '<option value="">(no finished world with its time zoom)</option>') + opts.join('');
  if (cur) $('world').value = cur;
  if (want) $('world').value = want;
  $('world').onchange = () => { syncFav(); if (tab === 'results') { result = null; redraw(); } };
  if (tz) $('world').value = 'tz:' + tz;
  syncFav();
}
(async () => {
  await loadSchema().catch((e) => status('could not load the editor\'s option lists: ' + e.message, true));
  await listTrees(q.get('tree') || 'dnd');
  await listWorlds();
  await loadTree(q.get('tree') || 'dnd').catch(() => status('could not load the tree', true));
  if (q.get('run')) await showResult(q.get('run'));
  if (q.get('sel') && byId()[q.get('sel')]) sel = q.get('sel');  // (?sel=<id>: open a line in the tree's side panel)
  showTab(tab);
})();
</script>
