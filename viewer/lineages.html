<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peoples workbench · Planet Viewer</title>
<style>
  :root { --bg: #0e1218; --panel: #161c25; --line: #2a3446; --text: #dde3ea; --muted: #8b97a8; --acc: #7cc4ff; --err: #ff7b7b; --ok: #9fd18b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: grid;
         grid-template-rows: auto auto 1fr auto; height: 100vh; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  header b { font-size: 15px; margin-right: 8px; }
  nav { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 14px; color: var(--muted); }
  nav button.on { color: var(--text); border-bottom-color: var(--acc); }
  main { overflow: hidden; min-height: 0; }
  .tab { display: none; height: 100%; overflow: auto; padding: 10px 12px; }
  .tab.on { display: block; }
  /* PW-841: the row must be bounded (minmax(0,1fr)) or #tl grows to its content height, never scrolls itself, and its sideways scrollbar sits at the very bottom of a tall list, off screen */
  #tab-tree.on { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr); padding: 0; overflow: hidden; }
  #tl { overflow: scroll; position: relative; min-width: 0; min-height: 0; overscroll-behavior: contain; scrollbar-width: auto; cursor: grab; } #tl.panning { cursor: grabbing; user-select: none; }
  #tl .grip { cursor: ew-resize; }
  /* PW-841: the axis stays on top and the names stay on the left when the timeline scrolls */
  #tl svg { display: block; } #axis { position: sticky; top: 0; z-index: 3; background: var(--bg); }
  #lab { position: sticky; left: 0; z-index: 2; } #tlctl { position: sticky; top: 0; left: 0; z-index: 4; height: 0; }
  #tlctl select { margin: 4px 0 0 6px; max-width: 170px; }
  #side { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px; }
  footer { border-top: 1px solid var(--line); padding: 6px 12px; color: var(--muted); }
  button, select, input { background: #1d2532; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--acc); }
  input[type=number] { width: 70px; } input.wide { width: 100%; }
  label { display: block; margin: 5px 0 2px; color: var(--muted); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); } .err { color: var(--err); } .ok { color: var(--ok); }
  .trait { display: inline-block; margin: 2px 8px 2px 0; color: var(--text); }
  svg text { fill: var(--text); font-size: 11px; } svg .axis text { fill: var(--muted); }
  .bar { cursor: grab; } .sel rect.bg { fill: #233047; }
  h3 { margin: 12px 0 4px; font-size: 13px; } h2 { font-size: 14px; margin: 4px 0 8px; }
  a { color: var(--acc); }
  table.t { border-collapse: collapse; font-size: 12px; }
  table.t th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; color: var(--muted); padding: 4px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 2px 5px; border-bottom: 1px solid #1c2430; vertical-align: top; }
  table.t tr.off td { opacity: .4; }
  table.t td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.t input[type=number] { width: 62px; padding: 2px 4px; } table.t input.s { width: 48px; } table.t input.txt { width: 150px; padding: 2px 4px; }
  table.t select { padding: 2px 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .kpi { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
  .kpi div b { display: block; font-size: 17px; } .kpi div span { color: var(--muted); font-size: 11px; }
  pre.map { font: 10px/10px ui-monospace, monospace; margin: 0; letter-spacing: 0; background: #0a1a2a; padding: 6px; display: inline-block; }
  .bars { display: inline-block; height: 8px; background: var(--acc); opacity: .7; vertical-align: middle; border-radius: 2px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } #tab-tree.on { grid-template-columns: 1fr; } }
  .hint { max-width: 900px; color: var(--muted); margin: 0 0 8px; }
</style>
</head>
<body>
<header>
  <b>Peoples workbench</b>
  <select id="trees" title="presets and saved trees"></select>
  <button id="load">Load</button>
  <span class="muted">save as</span><input id="saveName" size="14" placeholder="my-peoples">
  <button id="save">Save</button>
  <button id="download">Download JSON</button>
  <label class="trait" style="margin:0"><input type="file" id="upload" accept=".json" style="width:170px"></label>
  <span style="flex:1"></span>
  <a href="index.html" title="Back to the globe viewer">Viewer</a>
  <span class="muted">world</span><select id="world" title="Finished worlds whose time zoom is still stored (peoples run on the ice-age history)"></select>
  <span class="muted">tries</span><input id="tries" type="number" value="3" min="1" max="8">
  <button id="run">Run on world</button>
  <span id="status" class="muted"></span> <a id="globe" hidden>Open on the globe</a>
</header>
<nav id="tabs">
  <button data-tab="tree">Tree &amp; timeline</button>
  <button data-tab="peoples">Peoples</button>
  <button data-tab="places">Places &amp; land use</button>
  <button data-tab="wishes">Wishes</button>
  <button data-tab="results">Results</button>
</nav>
<main>
  <section class="tab" id="tab-tree"><div id="tl"><div id="tlctl"><select id="tlView" title="species: peoples and their splits; with cultures: also the ways of life (groups) inside each people"><option value="all">species + cultures</option><option value="species">species only</option></select> <button id="tlFit" title="Fit the whole timeline into the window width (otherwise at least 1100 px, scrolling sideways; drag the background or shift+wheel to pan)">fit all</button></div><svg id="axis"></svg><svg id="svg"></svg><svg id="lab"></svg></div><div id="side"></div></section>
  <section class="tab" id="tab-peoples"></section>
  <section class="tab" id="tab-places"></section>
  <section class="tab" id="tab-wishes"></section>
  <section class="tab" id="tab-results"></section>
</main>
<footer id="foot"></footer>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ORIGIN_COL = { split: '#9fd18b', root: '#e3c26b', arrival: '#c79bff', hybrid: '#ff9d6b', template: '#ff6b9a', group: '#6bd6d0' };
// (mirrors of planet/lineages/spec.py TRAITS, PLACES, DEMOGRAPHY and land.py GOODS)
const TRAITS = ['flies', 'swims', 'coastal', 'seafaring', 'agricultural', 'nomadic', 'mountain', 'hardy', 'insular', 'cosmopolitan', 'subterranean', 'miner'];
const PLACES = ['coast', 'island', 'island_chain', 'mountain', 'lowland', 'inland', 'forest', 'open', 'wetland', 'jungle', 'steppe', 'desert', 'tundra', 'volcanic', 'hills'];
const WANTS = ['near', 'apart', ...PLACES];
const GOODS = { fertile: 'farmland', grazing: 'pasture', foraging: 'wild food', timber: 'timber', fuel: 'firewood', building: 'firm building ground',
  stone: 'good building stone', metal: 'metal ores', gold: 'gold', iron: 'iron', copper: 'copper', tin: 'tin', gems: 'gems', mithril: 'mithril and adamant',
  coal: 'coal', harbour: 'natural harbours', nav_hazard: 'reefs, shoals, sea ice offshore', coral: 'coral coast', lagoon: 'lagoons', mangrove: 'mangrove coast',
  cliff: 'sea cliffs', seabirds: 'seabird cliffs', seals: 'seal haul-outs', volcanic: 'volcanoes, young volcanic ground', hills: 'rolling hill country',
  peaks: 'high peaks', frost: 'frozen ground, ice margins', storm_coast: 'storm-beaten coasts' };
const GROUPS = ['tropical', 'rainforest', 'savanna', 'arid', 'desert', 'steppe', 'mediterranean', 'temperate', 'subtropical', 'oceanic', 'continental', 'subarctic', 'polar', 'tundra'];
const BAND = 25;
const DEMO_DEFAULT = { density: 2.0, explore: 0.5, sea_share: 0.03, insularity: 0.5 };
const DEMOGRAPHY = { agricultural: { density: 10 }, nomadic: { density: 0.6, explore: 0.7 }, subterranean: { density: 3, explore: 0.35 },
  miner: { density: 3 }, flies: { density: 0.6, explore: 0.65 }, seafaring: { sea_share: 0.6, explore: 0.7 }, swims: { sea_share: 0.4 },
  coastal: { sea_share: 0.3, density: 3 }, cosmopolitan: { insularity: 0.2, explore: 0.7 }, insular: { insularity: 0.85, explore: 0.25 } };
const DEMO_KEYS = Object.keys(DEMO_DEFAULT);
// senses and bodies (PW-694; mirrors spec.BODY_DEFAULT): for the future cuisine pass, nothing in the run reads them
const BODY_DEFAULT = { sweet: true, milk: false, milks: true, capsaicin: true, bitter: 'normal', smell: 'normal', diet: 'omnivore', raw_meat: false, cellulose: false, toxic: [], suction: 'normal', teeth: 'grinding', gut: 'simple', salt: 'normal', display: 'none', shed: 'none', display_sex: 'both', hours: 'diurnal', thermo: 'endo', fire: true, grain: 'normal' };
const BODY_FIELDS = [['sweet', 'tastes sweet', [true, false]], ['milk', 'digests milk as an adult (or the share of the people that does)', [true, false, 0.1, 0.25, 0.5, 0.75]], ['capsaicin', 'feels capsaicin heat', [true, false]],
  ['bitter', 'bitter sensitivity', ['low', 'normal', 'high']], ['smell', 'smell acuity', ['low', 'normal', 'keen']],
  ['diet', 'diet', ['herbivore', 'omnivore', 'carnivore', 'obligate_carnivore']], ['raw_meat', 'tolerates raw meat', [true, false]], ['cellulose', 'digests cellulose', [true, false]],
  ['suction', 'suction (sucking a drink)', ['none', 'poor', 'normal']], ['teeth', 'teeth', ['grinding', 'conical', 'dental_pad', 'beak']], ['gut', 'gut', ['simple', 'hindgut', 'foregut']],
  ['salt', 'salt', ['normal', 'craving']], ['display', 'display organ', ['none', 'horns', 'antlers']], ['shed', 'who sheds the display', ['none', 'both', 'males']], ['display_sex', 'who carries the display', ['both', 'males']],
  ['hours', 'active hours', ['diurnal', 'crepuscular', 'nocturnal']], ['thermo', 'body heat', ['endo', 'ecto']], ['fire', 'cooks with fire', [true, false]]];
const TOXINS = [['alliums', 'alliums (onion, garlic)'], ['theobromine', 'theobromine (chocolate)']];
function bodyOf(r, seen = new Set()) {  // the body a line runs with: its own keys over its first parent's (spec.parse)
  if (seen.has(r.id)) return { ...BODY_DEFAULT };
  seen.add(r.id);
  const p = parentsOf(r).map((x) => byId()[x]).filter(Boolean)[0];
  return { ...(p ? bodyOf(p, seen) : BODY_DEFAULT), ...(r.body || {}) };
}
const bodyInput = (r, k, opts) => {  // (opts: the choices; a flag may also be a share of the people, 0..1)
  const own = r.body?.[k], inh = bodyOf({ ...r, body: {} })[k], lab = (v) => (v === true ? 'yes' : v === false ? 'no' : typeof v === 'number' ? Math.round(100 * v) + '% of the people' : String(v).replace('_', ' '));
  if (typeof own === 'number' && !opts.includes(own)) opts = [...opts, own];
  return `<select data-b="${k}"><option value="" ${own == null ? 'selected' : ''}>(${lab(inh)})</option>${opts.map((v) => `<option value="${v}" ${own === v ? 'selected' : ''}>${lab(v)}</option>`).join('')}</select>`;
};
let T = null, sel = null, result = null;  // the raw tree (the input's shape), the selected id, a run's meta (+ id)
const q = new URLSearchParams(location.search);

function kyrOf(v) {  // "8 Myr" / "450 kyr" / "12000 yr" / a bare number (kyr) -> kyr (spec.parse_ago)
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const m = String(v).trim().match(/^([0-9.eE+-]+)\s*(myr|ma|mya|kyr|ka|kya|yr|y|years?|bp)?/i);
  if (!m) return null;
  const x = +m[1], u = (m[2] || 'kyr').toLowerCase();
  return ['myr', 'ma', 'mya'].includes(u) ? x * 1000 : ['yr', 'y', 'year', 'years', 'bp'].includes(u) ? x / 1000 : x;
}
function fmt(k) {
  if (k >= 1000) return `${+(k / 1000).toFixed(k >= 10000 ? 0 : 2)} Myr`;
  if (k >= 1) return `${+k.toFixed(k >= 100 ? 0 : 1)} kyr`;
  return `${Math.round(k * 1000)} yr`;
}
const num = (n) => n >= 1e6 ? `${+(n / 1e6).toPrecision(2)} M` : n >= 1e3 ? `${+(n / 1e3).toPrecision(2)} k` : `${Math.round(n)}`;
const parentsOf = (r) => r.parents ? [].concat(r.parents) : r.group_of ? [r.group_of] : r.parent ? [r.parent] : [];
const groupsOf = (id) => T.lineage.filter((x) => originOf(x) === 'group' && parentsOf(x)[0] === id);  // (ways of life within a people, PW-665)
const originOf = (r) => r.origin || (parentsOf(r).length ? 'split' : 'root');
const byId = () => Object.fromEntries(T.lineage.map((r) => [r.id, r]));

// what a line inherits (spec.parse: anything left out comes from the first parent; hybrids merge traits)
function inherited(r, key, seen = new Set()) {
  if (r[key] != null && r[key] !== '') return r[key];
  if (seen.has(r.id)) return undefined;
  seen.add(r.id);
  const ps = parentsOf(r).map((p) => byId()[p]).filter(Boolean);
  if (!ps.length) return undefined;
  if (key === 'traits' && originOf(r) === 'hybrid') return [...new Set(ps.flatMap((p) => inherited(p, 'traits', seen) || []))].sort();
  if (DEMO_KEYS.includes(key) && !['split', 'group'].includes(originOf(r))) return undefined;  // (only splits and groups inherit demography)
  return inherited(ps[0], key, seen);
}
function demography(traits) {  // spec.demography
  const out = { ...DEMO_DEFAULT };
  for (const k of DEMO_KEYS) {
    const vals = traits.filter((t) => t !== 'insular' && DEMOGRAPHY[t]?.[k] != null).map((t) => DEMOGRAPHY[t][k]);
    if (vals.length) out[k] = k === 'insularity' ? Math.min(...vals) : Math.max(...vals);
    if (traits.includes('insular') && DEMOGRAPHY.insular[k] != null) out[k] = DEMOGRAPHY.insular[k];
  }
  return out;
}
function demoOf(r) {  // the value a line runs with, and whether it was given on it ('own'), inherited or from traits
  const tr = inherited(r, 'traits') || [], d = demography(tr), out = {};
  for (const k of DEMO_KEYS) {
    if (r[k] != null && r[k] !== '') out[k] = [+r[k], 'own'];
    else { const v = inherited(r, k); out[k] = v != null ? [+v, 'inherited'] : [d[k], 'traits']; }
  }
  if ((r.density == null || r.density === '') && r.band_km2) out.density = [BAND / +r.band_km2, 'own'];
  return out;
}

function effective() {  // what switching lines off does (spec.parse): which lines go, who re-parents
  const ids = byId(), off = new Set(T.lineage.filter((r) => r.enabled === false).map((r) => r.id));
  let ch = true;
  while (ch) { ch = false; for (const r of T.lineage) if (!off.has(r.id) && ['hybrid', 'template', 'group'].includes(originOf(r)) && parentsOf(r).some((p) => off.has(p))) { off.add(r.id); ch = true; } }
  const parent = {};
  for (const r of T.lineage) {
    if (originOf(r) !== 'split') continue;
    let p = ids[parentsOf(r)[0]];
    while (p && off.has(p.id) && originOf(p) === 'split') p = ids[parentsOf(p)[0]];
    parent[r.id] = p && !off.has(p.id) ? p.id : null;
  }
  return { off, parent };
}
const resLine = (id) => result?.lineages?.find((l) => l.id === id);
const resPres = (id) => result?.present?.lines?.[id];
const colorOf = (r) => resLine(r.id)?.color || r.color || ORIGIN_COL[originOf(r)] || '#aaa';

// ---- tabs ----------------------------------------------------------------------------------------
const FOOT = {
  tree: `Time runs left to right, Myr to the present, on a log scale (tectonic run, glacial time zoom, recent pass). Drag a bar's left end to move when
    the line appears; click a bar to edit it. Origins: <span style="color:#9fd18b">split</span> · <span style="color:#e3c26b">root</span> ·
    <span style="color:#c79bff">arrival</span> · <span style="color:#ff9d6b">hybrid</span> · <span style="color:#ff6b9a">template (overlay)</span>.
    <span style="color:#6bd6d0">group (a way of life within a people)</span>.
    Switching a line off: its split children re-parent to its parent; its hybrids, templates and groups go with it.`,
  peoples: `A people's groups (ways of life: steppe and forest orcs, human seafarers...) sit under it: ▸ opens them, + group adds one. Empty demography fields come from the traits (grey: the value used; a split inherits what its parent was given). Density: people per km² of full
    habitat; a band of ${BAND} roams ${BAND} / density km². A separate patch with fewer than the tree's viable population fades, so sparse peoples need big lands.`,
  places: 'What each way of life looks for in the world\'s land (planet/lineages/land.py). by: a trait, a place or climate tag in a line\'s prefers, or one line\'s id.',
  wishes: 'Soft wishes: best of N tries plus mild nudges on habitat and origins; each reports a score after a run.',
  results: 'From a peoples run (meta.present). Numbers are presence x density x area: rough, for a game, not a census.',
};
let tab = (location.hash || '#tree').slice(1);
function showTab(t) {
  if (!FOOT[t]) t = 'tree';
  tab = t;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.tab').forEach((s) => s.classList.toggle('on', s.id === `tab-${t}`));
  $('foot').innerHTML = FOOT[t] + ' Saved trees: <code>&lt;data&gt;/lineage_trees/</code>; CLI: <code>uv run python -m planet lineages &lt;world&gt; --tree &lt;name&gt;</code>.';
  history.replaceState(null, '', `${location.search}#${t}`);
  redraw();
}
$('tabs').onclick = (e) => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); };
function redraw() {
  if (!T) return;
  if (tab === 'tree') { drawTimeline(); drawSide(); }
  else if (tab === 'peoples') drawPeoples();
  else if (tab === 'places') drawPlaces();
  else if (tab === 'wishes') drawWishes();
  else drawResults();
}

// ---- tab 1: the timeline ---------------------------------------------------------------------------
let W0 = 190;  // (the name column: as wide as the longest name, drawTimeline)
const ROW = 22, TOP = 34;
const LMIN = Math.log10(0.05);
let LMAX = Math.log10(20000);  // 50 yr .. 20 Myr, or back to the tree's oldest line (drawTimeline)
let WIDTH = 900;
const xOf = (kyr) => W0 + (1 - (Math.log10(Math.max(kyr, 0.05)) - LMIN) / (LMAX - LMIN)) * (WIDTH - W0 - 20);
const kyrAt = (x) => 10 ** (LMIN + (1 - (x - W0) / (WIDTH - W0 - 20)) * (LMAX - LMIN));
function order() {  // depth-first by split edges, roots and arrivals by age
  const kids = {}, out = [], seen = new Set();
  for (const r of T.lineage) if (originOf(r) === 'split') (kids[parentsOf(r)[0]] = kids[parentsOf(r)[0]] || []).push(r);
  const walk = (r, d) => { if (seen.has(r.id)) return; seen.add(r.id); out.push([r, d]);
    groupsOf(r.id).sort((a, b) => kyrOf(b.at) - kyrOf(a.at)).forEach((k) => walk(k, d + 1));
    (kids[r.id] || []).sort((a, b) => kyrOf(b.at) - kyrOf(a.at)).forEach((k) => walk(k, d + 1)); };
  T.lineage.filter((r) => originOf(r) !== 'split' && !['hybrid', 'template', 'group'].includes(originOf(r)))
    .sort((a, b) => kyrOf(b.at) - kyrOf(a.at)).forEach((r) => walk(r, 0));
  T.lineage.filter((r) => ['hybrid', 'template'].includes(originOf(r))).sort((a, b) => kyrOf(b.at) - kyrOf(a.at)).forEach((r) => walk(r, 0));
  T.lineage.forEach((r) => walk(r, 0));
  return out;
}
// where a bar ends (spec.py): an extinct line at its extinction; a line that does not persist, at its last living split child;
// after a run, the computed end (meta.lineages[].ended_kyr) wins; else the present (null)
function endOf(r, eff, res) {
  if (res && result?.lineages) return res.ended_kyr ?? kyrOf(r.extinct);
  const ex = kyrOf(r.extinct);
  if (ex != null) return ex;
  if (r.persists || ['hybrid', 'template', 'group'].includes(originOf(r))) return null;
  const kids = T.lineage.filter((x) => originOf(x) === 'split' && eff.parent[x.id] === r.id && !eff.off.has(x.id) && kyrOf(x.extinct) == null)
    .map((x) => kyrOf(x.at));
  return kids.length ? Math.min(...kids) : null;
}
function drawTimeline() {
  LMAX = Math.log10(Math.max(20000, ...T.lineage.map((r) => kyrOf(r.at) || 0)) * 1.15);  // no line starts off the left edge
  let rows = order();
  if (viewMode === 'species') rows = rows.filter(([r]) => originOf(r) !== 'group');
  // the name column fits the longest name (indent + ~6.3 px a letter, at most 330 px; a longer one is clipped, its full name a tooltip)
  const label = (r, d) => `${originOf(r) === 'group' ? '↳ ' : ''}${r.name || r.id}${r.custom ? ' ✎' : ''}${eff0.off.has(r.id) ? ' (off)' : ''}`;
  const eff = effective(), eff0 = eff;
  W0 = Math.min(330, Math.max(190, ...rows.map(([r, d]) => 14 + 10 * Math.min(d, 8) + 6.3 * label(r, d).length)));
  WIDTH = fitAll ? Math.max(500, $('tl').clientWidth - 24) : Math.max(1100, $('tl').clientWidth - 4);  // (a narrower window scrolls sideways)
  const svg = $('svg'), H = TOP + rows.length * ROW + 10;
  svg.setAttribute('width', WIDTH); svg.setAttribute('height', H - TOP); svg.setAttribute('viewBox', `0 ${TOP} ${WIDTH} ${H - TOP}`);
  const axis = $('axis'); axis.setAttribute('width', WIDTH); axis.setAttribute('height', TOP); axis.setAttribute('viewBox', `0 0 ${WIDTH} ${TOP}`);

// shared edit handling: a field with data-k edits line data-id (or the selected line); data-m the tree's meta
function editLine(r, el) {
  if (el.dataset.b) {  // a body field: empty = inherit
    const k = el.dataset.b, o = BODY_FIELDS.find((f) => f[0] === k)[2], b = { ...(r.body || {}) };
    if (el.value === '') delete b[k]; else b[k] = o.find((v) => String(v) === el.value);
    if (Object.keys(b).length) r.body = b; else delete r.body;
    return;
  }
  if (el.dataset.btox) {
    const t = new Set(bodyOf(r).toxic); el.checked ? t.add(el.dataset.btox) : t.delete(el.dataset.btox);
    r.body = { ...(r.body || {}), toxic: [...t].sort() };
    return;
  }
  const k = el.dataset.k;
  if (el.dataset.trait) {
    const t = new Set(r.traits || inherited(r, 'traits') || []); el.checked ? t.add(el.dataset.trait) : t.delete(el.dataset.trait); r.traits = [...t];
    return;
  }
  if (k.includes('.')) {
    const [a, i] = k.split('.'); r[a] = r[a] ? [...r[a]] : ['', ''];
    r[a][+i] = el.value === '' ? '' : +el.value;
    if (r[a].every((v) => v === '')) delete r[a];
  } else if (k === 'enabled' || k === 'persists' || k === 'contact') r[k] = el.checked;
  else if (k === 'parents') r.parents = [...el.selectedOptions].map((o) => o.value);
  else if (k === 'group_of') { r.group_of = el.value; delete r.parents; }
  else if (k === 'prefers' || k === 'avoids' || k === 'traits') r[k] = el.value.split(',').map((s) => s.trim()).filter(Boolean);
  else if (['share', 'sites', 'speed_kmyr', ...DEMO_KEYS, 'band_km2'].includes(k)) {
    if (el.value === '') delete r[k]; else r[k] = +el.value;
    if (k === 'band_km2' && el.value !== '') { r.density = +(BAND / +el.value).toPrecision(3); delete r.band_km2; }
  } else if (k === 'extinct') { if (el.value.trim()) r.extinct = el.value.trim(); else delete r.extinct; }
  else if (k === 'id') {
    const old = r.id; r.id = el.value.trim();
    for (const x of T.lineage) if (x.parents) x.parents = [].concat(x.parents).map((p) => (p === old ? r.id : p));
    for (const x of T.lineage) if (x.group_of === old) x.group_of = r.id;
    for (const w of T.wish || []) { if (w.a === old) w.a = r.id; if (w.b === old) w.b = r.id; }
    for (const u of T.use || []) if (u.by === old) u.by = r.id;
    if (sel === old) sel = r.id;
  } else r[k] = el.value;
  if (k === 'origin') {
    delete r.parent; if (['root', 'arrival'].includes(r.origin)) delete r.parents;
    if (r.origin === 'group' && !r.group_of) { r.group_of = parentsOf(r)[0] || T.lineage.find((x) => x !== r)?.id; delete r.parents; }
    if (r.origin !== 'group' && r.group_of) { if (!['root', 'arrival'].includes(r.origin)) r.parents = [r.group_of]; delete r.group_of; }
  }
}
function onChange(e) {

    el.checked ? cur.add(el.dataset.ps) : cur.delete(el.dataset.ps);
    T.meta.portal_sites = [...cur];
    redraw(); return;
  }
  if (el.dataset.animal) {  // (meta.animals: the list of animals on; fantasy ones are rare and only in fantasy mode)
    T.meta = T.meta || {};
    const all = ['horse', 'dog', 'caprine', 'cattle', 'fowl', 'great_elk', 'riding_lizard'], cur = new Set(T.meta.animals || all.slice(0, 5));
    el.checked ? cur.add(el.dataset.animal) : cur.delete(el.dataset.animal);
    T.meta.animals = all.filter((x) => cur.has(x)); redraw(); return;
  }
  if (el.dataset.m) { T.meta = T.meta || {}; T.meta[el.dataset.m] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? undefined : +el.value) : el.value; redraw(); return; }
  if (el.dataset.wk) { const w = T.wish[+el.closest('[data-w]').dataset.w]; w[el.dataset.wk] = el.dataset.wk === 'weight' ? +el.value : el.value || undefined; redraw(); return; }

    const r = { id: `${par.id}_group_${n}`, name: `${par.name || par.id}: new way of life ${n}`, custom: true, origin: 'group', group_of: par.id,

  } else if (d.opengroups != null) { openGroups.has(d.opengroups) ? openGroups.delete(d.opengroups) : openGroups.add(d.opengroups); }
  else if (d.tabgo != null) { showTab(d.tabgo); return; }

    const r = byId()[sel];
    if (T.lineage.some((x) => parentsOf(x).includes(sel)) && !confirm(`${sel} has descendants; delete anyway? (switching it off keeps them)`)) return;

  if (P.lost?.length) h += `<p class="err">lost: ${P.lost.map(nm).join(', ')}</p>`;
  // discovery timeline
  h += `</div><div><h2>Landmasses: who found them, and when</h2>${discoverySvg(lms, L)}<table class="t"><tr><th>landmass</th><th>held</th><th>first</th><th>when</th><th>how</th><th>first of today's peoples</th><th>then</th></tr>`;
  for (const m of lms.filter((m) => m.area_mkm2 >= 0.05).slice(0, 18)) {
    const d = m.discovered;
    h += `<tr><td>${esc(m.name.replace(/^the /, ''))}</td><td class="n">${Math.round(100 * m.held_share)}%</td>
      <td style="white-space:nowrap">${d ? sw(d.by) + nm(d.by) : '<span class="err">nobody</span>'}</td><td class="n">${d ? fmt(d.ago_kyr) : ''}</td>
      <td class="muted">${d ? esc(d.how) + (d.gap_km ? ` ${d.gap_km} km` : '') : ''}</td>
      <td style="white-space:nowrap">${m.settled_by ? `${sw(m.settled_by.by)}${nm(m.settled_by.by)} ${fmt(m.settled_by.ago_kyr)} <span class="muted">${esc(m.settled_by.how)}${m.settled_by.gap_km ? ` ${m.settled_by.gap_km} km` : ''}</span>` : ''}</td>
      <td class="muted">${esc((m.arrivals || []).slice(1, 5).map((a) => `${L[a.by]?.name || a.by} ${fmt(a.ago_kyr)}`).join('; '))}</td></tr>`;
  }
  h += '</table></div></div>';
  // animals (animals.py, PW-691) and the boats that carry them (PW-688)
  const an = P.animals;
  if (an) {
    h += `<h2>Animals and boats <span class="muted" style="font-weight:normal;font-size:12px">(${esc(an.mode)} mode)</span></h2>
      <div class="muted">Craft that carry animals over the sea: ${an.craft.map((c) => `${esc(c.name)} since ${fmt(c.since_kyr)} ago (${c.reach_km} km; ${esc(c.carries_up_to)})`).join('; ')}.</div>`;
    for (const [aid, hs] of Object.entries(an.stocks)) {
      const rs = Object.entries(hs.users_share || {}).filter(([, v]) => v >= 0.02).sort((a, b) => b[1] - a[1]);
      h += `<h3>${esc(hs.label)}${hs.fantasy ? ` <span class="muted">(fantasy animal, ${esc(an.mode)} mode only)</span>` : ''} <a href="index.html?run=${encodeURIComponent(result.id)}&layer=${encodeURIComponent('animal: ' + aid)}" target="_blank" style="font-weight:normal;font-size:12px">(on the globe)</a></h3>
        <div class="muted">${hs.wild_mkm2} Mkm² of wild range at the present; known over ${hs.known_mkm2} Mkm² (${hs.known_on_wild_mkm2} Mkm² of it wild range); crossed the sea ${hs.crossed} times. Date drawn: ${fmt(hs.date_drawn_kyr)} ago (anchor ${fmt(hs.anchor_kyr)}).</div>
        ${(hs.tamed || []).map((t) => `<div>${t.first ? 'Tamed' : 'Tamed again, on their own,'} ~${fmt(t.ago_kyr)} ago by the ${sw(t.line)}${esc(t.people)} on the ${esc(t.country)} of ${esc(t.landmass_name)} <span class="muted">(${t.lat}, ${t.lon}; ${t.wild_mkm2} Mkm² of wild range on that land)</span></div>`).join('') || `<div class="err">Never tamed: ${esc(hs.never || '')}</div>`}
        ${(hs.crossings || []).length ? `<div class="muted">By boat: ${hs.crossings.slice(0, 6).map((c) => `${esc(c.landmass_name)} ${fmt(c.ago_kyr)} ago (${esc(c.craft)}, ${c.gap_km} km)`).join('; ')}${hs.crossed > 6 ? '; ...' : ''}</div>` : ''}
        ${rs.length ? `<div style="margin-top:4px">Known over: ${rs.map(([id, v]) => `${sw(id)}${nm(id)} ${Math.round(100 * v)}%${hs.took_up_kyr?.[id] != null ? ` <span class="muted">(from ${fmt(hs.took_up_kyr[id])} ago)</span>` : ''}`).join('; ')}</div>` : ''}`;
    }
    const dy = Object.entries(an.dairy || {});
    if (dy.length) h += `<h3>Dairy</h3><div>${dy.map(([id, v]) => `${sw(id)}${nm(id)}: ${Math.round(100 * v.lactase_share)}% digest milk, ${Math.round(100 * v.dairy_share)}% keep dairy herds of ${v.animals.map((x) => esc(an.stocks[x].label)).join(', ')}`).join('<br>')}</div>`;
  }
  // crops (crops.py, PW-721) and fuels (fuels.py, PW-722)
  const cr = P.crops;
  if (cr) {
    h += `<h2>Crops <span class="muted" style="font-weight:normal;font-size:12px">(${esc(cr.mode)} mode; staple share on peopled land ${Math.round(100 * cr.know_mean_peopled)}%)</span></h2>`;
    for (const [cid, hs] of Object.entries(cr.stocks)) {
      h += `<h3>${esc(hs.label)}${hs.fantasy ? ` <span class="muted">(fantasy crop, ${esc(cr.mode)} mode only)</span>` : ''} <a href="index.html?run=${encodeURIComponent(result.id)}&layer=${encodeURIComponent('crop: ' + cid)}" target="_blank" style="font-weight:normal;font-size:12px">(on the globe)</a></h3>
        <div class="muted">${hs.wild_mkm2} Mkm² of wild range; grown over ${hs.grown_mkm2} Mkm² (known over ${hs.known_mkm2}); crossed the sea ${hs.crossed} times. Date drawn: ${fmt(hs.date_drawn_kyr)} ago (anchor ${fmt(hs.anchor_kyr)}).</div>
        ${(hs.tamed || []).map((t) => `<div>${t.first ? 'First cultivated' : 'Cultivated again, on its own,'} ~${fmt(t.ago_kyr)} ago by the ${sw(t.line)}${esc(t.people)} on ${esc(t.landmass_name)} <span class="muted">(${t.lat}, ${t.lon})</span></div>`).join('') || `<div class="err">Never cultivated: ${esc(hs.never || '')}</div>`}`;
    }
  }
  const fu = result.meta?.fuels || result.fuels;
  if (fu) {
    h += `<h2>Fuels <span class="muted" style="font-weight:normal;font-size:12px">(share of each people's cooking fuel, by heads)</span></h2><table class="grid"><tr><th></th>${fu.names.map((k) => `<th>${esc(k)}</th>`).join('')}</tr>` +
      [['world', fu.summary.world], ...Object.entries(fu.summary.by_biome), ...Object.entries(fu.summary.by_line).slice(0, 12)]
        .map(([k, v]) => `<tr><td>${esc(k)}</td>${fu.names.map((f) => `<td>${Math.round(100 * v[f])}%</td>`).join('')}</tr>`).join('') + '</table>';
  }
  // the map
  if (P.ascii?.rows) {
    const col = Object.fromEntries(Object.entries(P.ascii.letters).map(([ch, id]) => [ch, L[id]?.color || '#ccc']));
    const rows = P.ascii.rows.map((row) => [...row].map((c) => c === ' ' ? ' ' : c === '.' ? '<span style="color:#556">·</span>' : c === '#' ? '<span style="color:#cde">#</span>'
      : c === '+' ? '<span style="color:#fff">+</span>' : `<span style="color:${col[c] || '#ccc'}">${esc(c)}</span>`).join('')).join('\n');
    h += `<h2>Present day <span class="muted">(each letter a people in its colour; + mixed, · unpeopled land, # ice)</span></h2><pre class="map">${rows}</pre>`;
  }
  // mixing, wishes
  h += `<div class="cols"><div><h2>Mixing zones</h2><table class="t"><tr><th>Mkm²</th><th>where</th><th>peoples</th></tr>
    ${(P.mixing_zones || []).slice(0, 12).map((z) => `<tr><td class="n">${z.area_mkm2}</td><td class="muted">${z.lat}, ${z.lon}</td><td>${z.lines.map(nm).join(', ')}</td></tr>`).join('')}</table></div>
    <div><h2>Wishes</h2><table class="t">${(P.wishes || []).map((w) => `<tr><td>${nm(w.a)} ${esc(w.want)} ${w.b ? nm(w.b) : ''}</td><td><span class="bars" style="width:${Math.round(60 * w.score)}px"></span> ${w.score}</td></tr>`).join('')}</table></div></div>`;
  // stories
  h += `<h2>Stories</h2><div class="cards">${lines.filter((l) => l.story).map((l) => `<div class="card"><b>${sw(l.id)}${esc(l.name)}</b>
    <div class="muted" style="font-size:11px">${l.leaf ? 'lives today' : l.ended_kyr != null ? `gone ${fmt(l.ended_kyr)} ago` : ''} · ${esc(Object.entries(l.demography || {}).map(([k, v]) => `${k} ${v}`).join(', '))}</div>
    <div style="margin-top:4px">${esc(l.story)}</div></div>`).join('')}</div>`;
  el.innerHTML = h;
  bind();
}
function discoverySvg(lms, L) {  // each landmass on a log time axis, a dot per arrival, the first larger
  const rows = lms.filter((m) => m.area_mkm2 >= 0.3 && m.arrivals?.length).slice(0, 12);
  if (!rows.length) return '';
  const W = 560, X0 = 150, RH = 18, H = 24 + rows.length * RH;
  const lo = Math.log10(0.1), hi = Math.log10(20000), x = (k) => X0 + (1 - (Math.log10(Math.max(k, 0.1)) - lo) / (hi - lo)) * (W - X0 - 10);
  let s = `<svg width="${W}" height="${H}" style="display:block;margin-bottom:6px"><g class="axis">`;
  for (const k of [1, 10, 100, 1000, 10000]) s += `<line x1="${x(k)}" x2="${x(k)}" y1="14" y2="${H}" stroke="#1f2836"/><text x="${x(k)}" y="11" text-anchor="middle">${fmt(k)}</text>`;
  s += '</g>';
  rows.forEach((m, i) => {
    const y = 24 + i * RH;
    s += `<text x="4" y="${y + 4}">${esc(m.name.replace(/^the /, '').replace(/ \(.*\)$/, '').slice(0, 24))}</text>`;
    m.arrivals.forEach((a, j) => { s += `<circle cx="${x(a.ago_kyr)}" cy="${y}" r="${j ? 3 : 5}" fill="${L[a.by]?.color || '#888'}" opacity="${j ? 0.8 : 1}" ${j ? '' : 'stroke="#fff"'}><title>${esc(L[a.by]?.name || a.by)} ${fmt(a.ago_kyr)} ago (${esc(a.how)})</title></circle>`; });
  });
  return s + '</svg>';
}

// ---- load, save, run -----------------------------------------------------------------------------------
const status = (msg, err) => { $('status').innerHTML = err ? `<span class="err">${esc(msg)}</span>` : esc(msg); };
async function listTrees(pick) {
  try {
    const r = await (await fetch('../api/lineage-trees')).json();
    $('trees').innerHTML = r.trees.map((t) => `<option value="${t.name}" ${t.name === pick ? 'selected' : ''}>${t.name} (${t.kind})</option>`).join('');
  } catch { status('no server API: load or download files only', true); }
}
async function loadTree(name) {
  const r = await fetch(`../api/lineage-tree?name=${encodeURIComponent(name)}`);
  const j = await r.json();
  if (!r.ok) return status(j.error || r.status, true);
  T = j; T.wish = T.wish || []; T.use = T.use || []; sel = null; $('saveName').value = name === 'dnd' ? 'my-peoples' : name;
  redraw(); status(`loaded ${name}: ${T.lineage.length} peoples`);
}
$('load').onclick = () => loadTree($('trees').value);
$('save').onclick = async () => {
  const name = $('saveName').value.trim();
  const r = await fetch(`../api/lineage-tree?name=${encodeURIComponent(name)}`, { method: 'POST', body: JSON.stringify(T) });
  const j = await r.json();
  if (!r.ok) return status(j.error, true);
  status(`saved ${name}`); listTrees(name);
};
$('download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(T, null, 1)], { type: 'application/json' }));
  a.download = `${$('saveName').value.trim() || 'peoples'}.json`; a.click();
};
$('upload').onchange = async (e) => {
  try { T = JSON.parse(await e.target.files[0].text()); T.wish = T.wish || []; T.use = T.use || []; sel = null; redraw(); status('loaded file'); }
  catch (err) { status(`not a tree: ${err}`, true); }
};
$('run').onclick = async () => {
  const ref = $('world').value;
  if (!ref) return status('pick a finished world (none has its time zoom stored: make a time zoom and finish a world from it in the viewer)', true);
  const target = ref.startsWith('tz:') ? { timezoom: ref.slice(3) } : { world: ref };
  $('globe').hidden = true;
  status('running… (~20 s a try at L6, ~1 min at L7)');
  $('run').disabled = true;
  try {
    const r = await fetch('../api/lineages', { method: 'POST', body: JSON.stringify({ ...target, raw: T, tries: +$('tries').value }) });
    const j = await r.json();
    if (!r.ok) return status(j.error, true);
    for (;;) {  // queued on the server's job queue: poll it
      await new Promise((res) => setTimeout(res, 1500));
      const s = await (await fetch(`../api/jobs/${j.job}`, { cache: 'no-store' })).json();
      if (s.status === 'error') return status(s.error, true);
      if (s.status === 'done') { await listWorlds(); await showResult(s.run); showTab('results'); break; }
      status(`${s.status}: ${Math.round(100 * (s.progress || 0))}% ${s.message || ''}`);
    }
  } finally { $('run').disabled = false; }
};
async function showResult(id) {
  const run = await (await fetch(`../runs/${id}/run.json`, { cache: 'no-store' })).json();
  result = { id, ...run.meta };
  status(`run ${id}`);
  const g = $('globe');
  g.href = `index.html?run=${encodeURIComponent(id)}&layer=peoples`; g.hidden = false;
  redraw();
}
// the world picker: finished worlds whose time zoom is still stored, newest first; ?world= / ?timezoom= name one not listed
async function listWorlds() {
  const get = async (u) => { try { return await (await fetch(u, { cache: 'no-store' })).json(); } catch { return []; } };
  const [worlds, runs] = await Promise.all([get('../worlds/index.json'), get('../runs/index.json')]);
  const tzs = new Set(runs.filter((r) => r.kind === 'timezoom' && !r.phase).map((r) => r.dir));
  peoplesRuns = runs.filter((r) => r.phase === 'lineages').sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  const have = new Set(peoplesRuns.map((r) => r.world));
  const ok = worlds.filter((w) => w.timezoom && tzs.has(w.timezoom)).sort((a, b) => b.created.localeCompare(a.created));
  const opts = ok.map((w) => `<option value="${esc(w.id)}">${esc(w.id)} · ${esc(w.name)}${have.has(w.id) ? ' (has peoples)' : ''}</option>`);
  const want = q.get('world'), tz = q.get('timezoom');
  if (want && !ok.some((w) => w.id === want)) opts.unshift(`<option value="${esc(want)}">${esc(want)} (not runnable?)</option>`);
  if (tz) opts.unshift(`<option value="tz:${esc(tz)}">time zoom ${esc(tz)}</option>`);
  const cur = $('world').value;
  $('world').innerHTML = (opts.length ? '' : '<option value="">(no finished world with its time zoom)</option>') + opts.join('');
  if (cur) $('world').value = cur;
  if (want) $('world').value = want;
  $('world').onchange = () => { if (tab === 'results') { result = null; redraw(); } };
  if (tz) $('world').value = 'tz:' + tz;
}
(async () => {
  await listTrees(q.get('tree') || 'dnd');
  await listWorlds();
  await loadTree(q.get('tree') || 'dnd').catch(() => status('could not load the tree', true));
  if (q.get('run')) await showResult(q.get('run'));
  if (q.get('sel') && byId()[q.get('sel')]) sel = q.get('sel');  // (?sel=<id>: open a line in the tree's side panel)
  showTab(tab);
})();
</script>
