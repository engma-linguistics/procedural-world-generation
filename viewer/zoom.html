<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regional Zoom</title>
<style>
  :root {
    --bg: #0b0f17; --panel: rgba(18, 24, 36, 0.92); --text: #dfe6f0; --muted: #8b97a8;
    --accent: #7cc4ff; --border: #2a3446;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
  #c.drag { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
  #controls { top: 12px; left: 12px; width: 280px; max-height: calc(100vh - 24px); overflow-y: auto; }
  #info { top: 12px; right: 12px; width: 260px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #legend { bottom: 12px; left: 304px; max-width: calc(100vw - 600px); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  #legend:empty { display: none; }
  #scale { bottom: 12px; right: 12px; font-size: 12px; }
  #scale .bar { height: 6px; border: 1px solid var(--text); border-top: none; margin-top: 2px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
  select { width: 100%; background: #111827; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { background: #111827; color: var(--text); border: 1px solid var(--border); padding: 3px 8px;
    border-radius: 4px; cursor: pointer; font-size: 12px; }
  .seg button.on { background: var(--accent); color: #06121f; border-color: var(--accent); }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .muted { color: var(--muted); }
  code { background: #111827; padding: 1px 4px; border-radius: 3px; font-size: 11px; word-break: break-all; }
  .grad { height: 10px; width: 220px; border-radius: 2px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { padding: 1px 0; vertical-align: top; }
  td:first-child { color: var(--muted); padding-right: 8px; white-space: nowrap; }
  a { color: var(--accent); }
  body.embedded #info { top: 56px; }  /* inside the globe viewer's tab: room for its tab bar */
  #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--muted); text-align: center; }
  #tip { position: fixed; z-index: 5; pointer-events: none; display: none; max-width: 300px;
    font-size: 12px; padding: 8px 10px; }
  #tip.pinned { pointer-events: auto; border-color: var(--accent); }
  #tip h3 { font-size: 13px; margin: 0 0 4px; }
  #tip .x { float: right; cursor: pointer; color: var(--muted); margin-left: 8px; }
  .mk { display: inline-block; vertical-align: -1px; margin-right: 4px; }
  @media (max-width: 800px) { #info { display: none; } #legend { left: 12px; bottom: 60px; max-width: calc(100vw - 24px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>

<div id="controls" class="panel">
  <h1>Regional Zoom</h1>
  <div class="row" style="gap:6px;display:flex"><select id="zoomSel" style="flex:1;min-width:0"></select>
    <button id="delBtn" title="Delete this zoom from disk">Delete</button></div>
  <div class="muted" id="srcNote" style="margin-top:4px"></div>
  <div class="muted" style="margin-top:4px">make one: on the Globe tab, click a cell and press Zoom (or double-click a cell), or
    <code>uv run python -m planet zoom &lt;world&gt; --lat L --lon L</code></div>

  <h2>Layer</h2>
  <div class="row seg" id="layerSeg"></div>
  <label id="seasonRow" style="margin-top:6px;display:none" title="Temperature and rain over the year, or in July / January (rain: the April-September / October-March half-year, as a rate per year)">
    season <select id="season" style="flex: none; width: auto; padding: 1px">
      <option value="">year</option><option value="jul">July</option><option value="jan">January</option></select></label>

  <h2>Overlays</h2>
  <label><input type="checkbox" id="rivers" checked> Rivers and lakes (on map layers)</label>
  <label><input type="checkbox" id="falls" checked> Waterfalls <span class="muted" id="fallsN"></span></label>
  <label><input type="checkbox" id="volc" checked> Volcanoes <span class="muted" id="volcN"></span></label>
  <label id="cloudsRow" title="Clouds on the satellite view: patches covering the season's cloud share (the world's, interpolated); the shapes are made up"><input type="checkbox" id="clouds"> Clouds (satellite view)</label>
  <label><input type="checkbox" id="smooth" checked> Smooth when magnified</label>

  <h2>About this zoom</h2>
  <div id="about" class="muted">&mdash;</div>
  <p class="muted" style="margin-top:10px">Scroll to zoom, drag to pan, double-click to reset.
    <a href="index.html" target="_top" id="globeLink">Globe viewer</a></p>
</div>

<div id="info" class="panel"><span class="muted">Hover the map.</span></div>
<div id="legend" class="panel"></div>
<div id="tip" class="panel"></div>
<div id="scale" class="panel"><span id="scaleLbl"></span><div class="bar" id="scaleBar"></div></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const R_KM = 6371;
const LAYERS = [
  ['satellite', 'Satellite'], ['height', 'Height'], ['shade', 'Hillshade'], ['rivers', 'Rivers'],
  ['rock', 'Rock'], ['surface_rock', 'Surface rock'], ['climate', 'Climate'], ['biome', 'Biome'], ['landform', 'Landform'],
  ['vegetation', 'Vegetation'], ['tree_cover', 'Tree cover'], ['canopy_height', 'Canopy height'], ['npp', 'NPP'],
  ['fire_return', 'Fire return'], ['lai', 'Leaf area'],
  ['precipitation', 'Rain'], ['temperature', 'Temperature'], ['ice', 'Ice'],
  ['radiation_index', 'Sun on slopes'], ['twi', 'Wetness index'], ['coarse', 'Coarse cells'],
];
// layers that need data the zoom may not have (zooms made before them): their button is hidden
const NEEDS = { vegetation: 'vegetation', tree_cover: 'tree_cover', canopy_height: 'canopy_height', npp: 'npp',
  fire_return: 'fire_return', lai: 'lai', radiation_index: 'radiation_index', twi: 'twi', landform: 'landform' };
const CATEGORICAL = ['rock', 'surface_rock', 'climate', 'biome', 'landform', 'vegetation'];
// the temperature / rain season: '' the year, 'jul' / 'jan' the half-years (zooms with *_jul / *_jan layers)
const SEASON_NAMES = { '': 'year', jul: 'July', jan: 'January' };
const state = { meta: null, L: null, layer: 'satellite', season: '', imgs: {}, shade: null,
  view: { s: 1, x: 0, y: 0 }, off: document.createElement('canvas') };
const canvas = $('c'), ctx = canvas.getContext('2d');
let START_MARK = new URLSearchParams(location.search).get('mark');  // (the first zoom loaded only)
let START_PX = new URLSearchParams(location.search).get('px');
if (window.top !== window) document.body.classList.add('embedded');

// ------------------------------------------------------------ helpers
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function ramp(stops, v) {
  if (v <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (v <= stops[i][0]) {
      const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (v - a) / (b - a);
      return [ca[0] + t * (cb[0] - ca[0]), ca[1] + t * (cb[1] - ca[1]), ca[2] + t * (cb[2] - ca[2])];
    }
  }
  return stops[stops.length - 1][1];
}
const SEA = [[-7000, [12, 28, 70]], [-4000, [20, 48, 102]], [-1500, [34, 78, 140]], [-200, [64, 124, 182]], [0, [104, 164, 206]]];
const RAIN = [[0, [150, 90, 40]], [250, [215, 180, 110]], [600, [190, 210, 120]], [1200, [80, 170, 110]], [2500, [30, 110, 160]], [4000, [40, 40, 140]]];
const ICE_RGB = [206, 228, 250];  // glaciers on the hillshade and height layers: blue-white
const ICE_T = [[0, [150, 190, 230]], [100, [190, 215, 245]], [500, [120, 160, 225]], [1500, [60, 90, 190]], [3000, [40, 40, 130]]];
const TEMP = [[-30, [60, 40, 140]], [-10, [80, 120, 220]], [0, [190, 230, 250]], [10, [120, 200, 120]], [20, [240, 210, 90]], [30, [220, 70, 40]]];
// vegetation and terrain ramps (the globe's colours for the vegetation layers): [value, rgb], units
const RAMPS = {
  tree_cover: [[[0, [232, 220, 176]], [10, [205, 210, 138]], [30, [143, 184, 95]], [60, [63, 143, 63]], [90, [31, 90, 42]]], '% tree canopy cover'],
  canopy_height: [[[0, [239, 230, 200]], [2, [201, 207, 138]], [8, [143, 184, 95]], [20, [79, 143, 69]], [35, [42, 106, 58]], [50, [18, 63, 42]]], 'm, tallest layer'],
  npp: [[[0, [242, 234, 208]], [100, [227, 210, 138]], [300, [185, 200, 95]], [600, [111, 175, 69]], [900, [47, 138, 58]], [1300, [15, 90, 42]]], 'g C/m&sup2;/yr net primary productivity'],
  lai: [[[0, [239, 230, 200]], [1, [207, 210, 138]], [2.5, [143, 191, 90]], [4, [79, 154, 69]], [6, [31, 106, 50]]], 'm&sup2; of leaf per m&sup2;, year'],
  // (fire return on a log scale: years between fires; 0 = never)
  fire_return: [[[0, [58, 42, 42]], [0.5, [232, 80, 58]], [1, [240, 154, 58]], [1.5, [242, 211, 106]], [2, [201, 214, 160]], [2.7, [143, 176, 160]], [3.5, [79, 111, 128]]], 'years between fires (log scale: 3, 10, 30, 100, 1000; grey: none)'],
  radiation_index: [[[0.4, [40, 50, 110]], [0.8, [120, 140, 190]], [1, [225, 225, 215]], [1.2, [240, 190, 90]], [1.6, [200, 80, 30]]], "the year's sunshine on the slope / flat ground (poleward slopes darker)"],
  twi: [[[4, [200, 170, 120]], [8, [225, 220, 190]], [11, [150, 200, 210]], [14, [60, 140, 200]], [18, [20, 50, 140]]], 'topographic wetness index ln(a / tan slope) (dry ridges to wet hollows)'],
};
const DECODE = { float32: Float32Array, uint8: Uint8Array, int8: Int8Array, uint16: Uint16Array, int16: Int16Array };
const fmt = (v, d = 0) => (v == null || Number.isNaN(v) ? '-' : Number(v).toFixed(d));

async function getJSON(url) {
  try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? r.json() : null; } catch { return null; }
}
function loadImage(url) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = url; });
}

// ------------------------------------------------------------ loading
async function init() {
  const idx = (await getJSON('../zooms/index.json')) || [];
  const sel = $('zoomSel');
  if (!idx.length) {
    sel.innerHTML = '<option>(no zooms yet)</option>';
    $('msg').innerHTML = 'No zooms found in <code>zooms/</code>.<br>Make one with <code>uv run python -m planet zoom &lt;world&gt; --lat L --lon L</code>';
    return;
  }
  // grouped by where each zoom came from: a run at some time (via a sliced world), or a world
  const groups = new Map();
  for (const z of idx) {
    const wname = z.world_name || z.name.slice(0, z.name.lastIndexOf(': '));
    // a sliced world is named "<run name> @ <t> Myr"
    const key = z.source_run ? `${wname} · run ${z.source_run}` : `${wname} · world ${z.world}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(`<option value="${z.id}" title="${z.name}">${z.id} &middot; ${fmt(z.center.lat, 1)}, ${fmt(z.center.lon, 1)} &middot; ${z.size_km} km @ ${fmt(z.res_km, 1)} km</option>`);
  }
  sel.innerHTML = [...groups].map(([k, opts]) => `<optgroup label="${k.replace(/"/g, '&quot;')}">${opts.join('')}</optgroup>`).join('');
  const p = new URLSearchParams(location.search);
  if (p.get('layer') && LAYERS.some((l) => l[0] === p.get('layer'))) state.layer = p.get('layer');
  const want = p.get('id');
  // opened from the globe tab: show the newest zoom of what the globe shows (the index is newest first)
  const src = p.get('run') ? ['source_run', p.get('run')] : p.get('world') ? ['world', p.get('world')] : null;
  const mine = src ? idx.filter((z) => z[src[0]] === src[1]) : [];
  if (want && idx.some((z) => z.id === want)) sel.value = want;
  else if (mine.length) sel.value = mine[0].id;
  if (src) $('srcNote').textContent = mine.length
    ? `${mine.length} zoom${mine.length > 1 ? 's' : ''} of this ${src[0] === 'world' ? 'world' : 'run'} (all zooms are in the list)`
    : `No zooms of this ${src[0] === 'world' ? 'world' : 'run'} yet; showing another. All zooms are in the list.`;
  sel.onchange = () => load(sel.value);
  $('delBtn').onclick = async () => {
    if (!state.meta || !confirm(`Delete zoom ${state.meta.id} (${state.meta.name})?\nThis removes it from disk.`)) return;
    const r = await fetch(`../zooms/${state.meta.id}`, { method: 'DELETE' });
    if (!r.ok) { alert(`Delete failed (HTTP ${r.status}). Is the viewer running via 'python -m planet serve'?`); return; }
    history.replaceState(null, '', '?');
    location.reload();
  };
  $('layerSeg').innerHTML = LAYERS.map(([k, n]) => `<button data-v="${k}">${n}</button>`).join('');
  $('layerSeg').onclick = (e) => { if (e.target.dataset.v) { state.layer = e.target.dataset.v; render(); syncURL(); } };
  if (p.get('season') in SEASON_NAMES) state.season = p.get('season');
  for (const o of ['rivers', 'falls', 'volc']) if (p.get(o) === '0') $(o).checked = false;  // e.g. ?rivers=0
  $('season').value = state.season;
  $('season').onchange = () => { state.season = $('season').value; render(); syncURL(); };
  $('rivers').onchange = render;
  if (p.get('clouds') === '1') $('clouds').checked = true;
  $('clouds').onchange = () => { render(); syncURL(); };
  $('falls').onchange = () => { render(); hideTip(); };
  $('volc').onchange = () => { render(); hideTip(); };
  $('smooth').onchange = draw;
  await load(sel.value);
}

function syncURL() {
  const p = new URLSearchParams({ id: state.meta.id, layer: state.layer });
  if (state.season) p.set('season', state.season);
  if ($('clouds').checked) p.set('clouds', '1');
  history.replaceState(null, '', '?' + p);
}

async function load(id) {
  $('msg').textContent = 'loading ' + id + '...';
  const base = `../zooms/${id}/`;
  const meta = await getJSON(base + 'zoom.json');
  if (!meta) { $('msg').textContent = 'could not read ' + base + 'zoom.json'; return; }
  // one file per layer (zooms/<id>/layers/<name>.bin), all small: load them all
  const L = {};
  await Promise.all(Object.entries(meta.layers).map(async ([k, spec]) => {
    const buf = await (await fetch(base + spec.file, { cache: 'no-store' })).arrayBuffer();
    const raw = new (DECODE[spec.dtype] || Uint8Array)(buf), sc = spec.scale ?? 1, of = spec.offset ?? 0;
    // (scaled layers: real units, store.decode)
    L[k] = sc === 1 && !of ? raw : Float32Array.from(raw, (v) => v * sc + of);
  }));
  state.meta = meta; state.L = L; state.imgs = {};
  for (const b of $('layerSeg').children) b.style.display = NEEDS[b.dataset.v] && !L[NEEDS[b.dataset.v]] ? 'none' : '';
  if (NEEDS[state.layer] && !L[NEEDS[state.layer]]) state.layer = 'satellite';
  state.marks = markers(meta);
  hideTip();
  const [rel, coarse] = await Promise.all([loadImage(base + meta.files.preview).catch(() => null),
    loadImage(base + meta.files.coarse).catch(() => null)]);
  state.imgs.coarse = coarse;
  // the satellite view (planet/satellite.py): unshaded true colour, year (each hemisphere's summer), July, January
  state.sat = {};
  await Promise.all(Object.entries({ '': 'satellite', jul: 'satellite_jul', jan: 'satellite_jan' }).map(async ([s, f]) => {
    const im = meta.files[f] ? await loadImage(base + meta.files[f]).catch(() => null) : null;
    if (!im) return;
    const cv = document.createElement('canvas'); cv.width = meta.nx; cv.height = meta.ny;
    const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0);
    state.sat[s] = cx.getImageData(0, 0, meta.nx, meta.ny).data;
  }));
  state.cloudNoise = null;
  $('cloudsRow').style.display = L.cloud_jul ? '' : 'none';
  state.shade = hillshade(L.elevation, meta.nx, meta.ny, meta.res_km);
  $('msg').textContent = '';
  about();
  resetView();
  render();
  syncURL();
  // ?px=row,col fills the info panel for that pixel, as hovering it would (the first zoom loaded only)
  const pxq = (START_PX || '').split(',').map(Number);
  START_PX = null;
  if (pxq.length === 2 && pxq.every(Number.isFinite)) {
    const v = state.view;
    hover({ clientX: v.x + (pxq[1] + 0.5) * v.s, clientY: v.y + (pxq[0] + 0.5) * v.s });
  }
  // ?mark=fall:0 or ?mark=volcano:2 opens that marker's card (falls highest first)
  const mk = (START_MARK || '').split(':');
  START_MARK = null;
  const o = mk.length === 2 ? (mk[0] === 'fall' ? state.marks.falls : state.marks.volc)[+mk[1]] : null;
  if (o) {
    const v = state.view;
    showTip(o, { clientX: v.x + o.c * v.s, clientY: v.y + o.r * v.s }, true);
  }
}

function hillshade(h, nx, ny, res) {
  const out = new Float32Array(nx * ny), d = res * 1000, ex = 2.0;
  const az = 315 * Math.PI / 180, alt = 40 * Math.PI / 180;
  const lx = Math.sin(az) * Math.cos(alt), ly = Math.cos(az) * Math.cos(alt), lz = Math.sin(alt);
  for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) {
    const i = r * nx + c;
    const hl = h[r * nx + Math.max(c - 1, 0)], hr = h[r * nx + Math.min(c + 1, nx - 1)];
    const hu = h[Math.max(r - 1, 0) * nx + c], hd = h[Math.min(r + 1, ny - 1) * nx + c];
    const dx = ex * (hr - hl) / (2 * d), dy = ex * (hu - hd) / (2 * d);  // north = up
    out[i] = Math.max(0, (-dx * lx - dy * ly + lz) / Math.sqrt(1 + dx * dx + dy * dy));
  }
  return out;
}

// a delta's Galloway weights (planet/coast.py): what reworks its sediment
const DELTA_FORM = { fingers: "bird's foot", funnels: 'tidal funnels', fan: 'fan' };
function deltaLine(d) {
  if (!d.weights) return `${fmt(d.discharge_m3s)} m&sup3;/s, plain ${fmt(d.plain_radius_km)} km`;
  const w = d.weights, bar = (k, c) => `<span title="${k} ${fmt(100 * w[k])}%" style="display:inline-block;height:8px;width:${Math.round(60 * w[k])}px;background:${c}"></span>`;
  return `<b>${d.type}</b>${d.lat_lon ? ` at ${d.lat_lon[0]}, ${d.lat_lon[1]}` : ''}<br>
    <span style="white-space:nowrap">${bar('river', '#3b7dd8')}${bar('wave', '#e0b050')}${bar('tide', '#5fb59a')}</span>
    river ${fmt(100 * w.river)}% &middot; wave ${fmt(100 * w.wave)}% &middot; tide ${fmt(100 * w.tide)}%<br>
    ${fmt(d.discharge_m3s)} m&sup3;/s, ${fmt(d.sediment_mt_yr.river, 1)} Mt/yr of sediment; waves ${fmt(d.wave_power_kw_m, 1)} kW/m,
    tides ${fmt(d.tide_range_m, 1)} m; ${d.mouths} mouth${d.mouths === 1 ? '' : 's'}, ${DELTA_FORM[d.form] || d.form}` +
    (d.marine_layers === false ? ' <span class="muted">(world has no wave/tide layers)</span>' : '');
}

function about() {
  const m = state.meta, s = m.stats, sw = m.source_world;
  $('about').innerHTML = `<table>
    <tr><td>source</td><td>${sw.source_run
      ? `<a href="index.html?run=${sw.source_run}&t=${sw.t_myr}" target="_top" title="Open the run at this time">${sw.name || 'run ' + sw.source_run + ' @ ' + sw.t_myr + ' Myr'}</a><br>run ${sw.source_run} @ ${sw.t_myr} Myr, sliced as world <a href="index.html?world=${sw.id}.json" target="_top">${sw.id}</a>`
      : `world <a href="index.html?world=${sw.id}.json" target="_top">${sw.id}</a><br>${sw.name || ''}`}</td></tr>
    <tr><td>centre</td><td>${fmt(m.center.lat, 2)}, ${fmt(m.center.lon, 2)}</td></tr>
    <tr><td>size</td><td>${m.size_km} km, ${m.nx}&times;${m.ny} px @ ${fmt(m.res_km, 2)} km</td></tr>
    <tr><td>seed</td><td>${m.seed}</td></tr>
    <tr><td>land</td><td>${s.land_pct}% (coarse ${s.coarse_land_pct}%)</td></tr>
    <tr><td>elevation</td><td>${fmt(s.min_m)} .. ${fmt(s.max_m)} m</td></tr>
    <tr><td>mean</td><td>${fmt(s.mean_elev_m)} m (coarse ${fmt(s.coarse_mean_elev_m)} m)</td></tr>
    <tr><td>largest river</td><td>${fmt(s.max_discharge_m3s)} m&sup3;/s</td></tr>
    <tr><td>lakes</td><td>${s.lakes}</td></tr>
    ${(s.waterfalls || []).length ? `<tr><td>biggest falls</td><td>${s.waterfalls.slice(0, 3).map((w) =>
      `${fmt(w.height_m)} m over ${fmt(w.length_km, 1)} km, ${fmt(w.discharge_m3s)} m&sup3;/s${w.from_lake ? ' (lake outlet)' : ''}${w.gorge_km ? `, gorge ${fmt(w.gorge_km, 1)} km` : ''} at ${w.lat}, ${w.lon}`).join('<br>')}</td></tr>` : ''}
    ${(s.deltas || []).length ? `<tr><td>deltas</td><td>${s.deltas.slice(0, 4).map((d) => deltaLine(d)).join('<br>')}</td></tr>` : ''}
    <tr><td>made in</td><td>${m.generated_in_s} s</td></tr>
    <tr><td>files</td><td><a href="../zooms/${m.id}/heightmap.png">heightmap.png</a> (16-bit: ${fmt(m.heightmap.min_m)}..${fmt(m.heightmap.max_m)} m)<br>

  const rivers = $('rivers').checked, minArea = 500 * Math.max(m.res_km / 2, 1), wide = (2 / m.res_km) ** 2;

  // scale bar: a round number of km about 120 px long
  const kmPerPx = m.res_km / v.s, target = 120 * kmPerPx;
  const p10 = Math.pow(10, Math.floor(Math.log10(target)));
  const nice = [1, 2, 5, 10].map((f) => f * p10).filter((x) => x <= target).pop() || p10;
  $('scaleLbl').textContent = `${nice} km`;
  $('scaleBar').style.width = `${nice / kmPerPx}px`;
}

// ------------------------------------------------------------ hover / pan / zoom
function pixelAt(ev) {
  const v = state.view, m = state.meta;
  const c = Math.floor((ev.clientX - v.x) / v.s), r = Math.floor((ev.clientY - v.y) / v.s);
  return c >= 0 && r >= 0 && c < m.nx && r < m.ny ? [r, c] : null;
}

function latlon(xkm, ykm) {
  const m = state.meta, la = m.center.lat * Math.PI / 180, lo = m.center.lon * Math.PI / 180;
  const C = [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)];
  let E = [-C[1], C[0], 0]; const ne = Math.hypot(E[0], E[1]) || 1; E = ne < 1e-9 ? [0, 1, 0] : [E[0] / ne, E[1] / ne, 0];
  const N = [C[1] * E[2] - C[2] * E[1], C[2] * E[0] - C[0] * E[2], C[0] * E[1] - C[1] * E[0]];
  const rho = Math.hypot(xkm, ykm) / R_KM, az = Math.atan2(xkm, ykm);
  const p = [0, 1, 2].map((j) => Math.cos(rho) * C[j] + Math.sin(rho) * (Math.sin(az) * E[j] + Math.cos(az) * N[j]));
  return [Math.asin(p[2]) * 180 / Math.PI, Math.atan2(p[1], p[0]) * 180 / Math.PI];
}

function hover(ev) {
  if (!state.meta) return;
  const rc = pixelAt(ev);
  if (!rc) { $('info').innerHTML = '<span class="muted">Hover the map.</span>'; return; }
  const [r, c] = rc, m = state.meta, L = state.L, i = r * m.nx + c, lg = m.legend;
  const x = (c + 0.5 - m.nx / 2) * m.res_km, y = (m.ny / 2 - r - 0.5) * m.res_km;
  const [la, lo] = latlon(x, y);
  const name = (list, id) => (list.find((e) => e.id === id) || {}).name || id;
  const kop = lg.koppen.find((e) => e.id === L.climate[i]) || {};
  const wet = ['land', 'sea', 'lake'][L.water[i]];
  $('info').innerHTML = `<table>
    <tr><td>lat, lon</td><td>${fmt(la, 3)}, ${fmt(lo, 3)}</td></tr>
    <tr><td>x, y</td><td>${fmt(x, 1)}, ${fmt(y, 1)} km</td></tr>
    <tr><td>elevation</td><td>${fmt(L.elevation[i])} m${L.water[i] === 2 ? ` (lake ${fmt(L.lake_depth[i])} m deep)` : ''}</td></tr>
    <tr><td>surface</td><td>${wet}${L.ice[i] > 0 ? ', glacier' : ''}${L.wetland && L.wetland[i] === 1 ? ', coastal marsh' : L.wetland && L.wetland[i] === 2 ? ', wetland' : ''}</td></tr>
    <tr><td>rock</td><td>${name(lg.rocks, L.rock[i])}</td></tr>
    <tr><td>exposed</td><td>${name(lg.rocks, L.surface_rock[i])}</td></tr>
    <tr><td>climate</td><td>${kop.code || ''} ${kop.name || ''}</td></tr>
    <tr><td>biome</td><td>${name(lg.biomes, L.biome[i])}</td></tr>
    ${vegRows(i)}
    <tr><td>temperature</td><td>${fmt(L.temperature[i], 1)} &deg;C${L.temperature_jul ? ` <span class="muted">(Jul ${fmt(L.temperature_jul[i])}, Jan ${fmt(L.temperature_jan[i])})</span>` : ''}</td></tr>
    <tr><td>rain</td><td>${fmt(L.precipitation[i])} mm/yr${L.precipitation_jul ? ` <span class="muted">(Apr-Sep ${fmt(L.precipitation_jul[i] / 2)}, Oct-Mar ${fmt(L.precipitation_jan[i] / 2)} mm)</span>` : ''}</td></tr>
    ${L.radiation_index && L.water[i] === 0 ? `<tr><td>terrain</td><td>sun ${fmt(100 * L.radiation_index[i])}% of flat &middot; wetness ${fmt(L.twi[i], 1)}${L.river_dist[i] < 255 ? ` &middot; river ${fmt(L.river_dist[i] * m.res_km, 1)} km` : ''}</td></tr>` : ''}
    <tr><td>river</td><td>${L.water[i] === 0 ? `${fmt(L.discharge[i], L.discharge[i] < 10 ? 1 : 0)} m&sup3;/s, ${fmt(L.drainage_area[i])} km&sup2;` : '-'}</td></tr>
  </table>`;
}

// the zoom's vegetation at pixel i: named type, structure, productivity, fire (zoom_vegetation)
function vegRows(i) {
  const L = state.L, lg = state.meta.legend;
  if (!L.vegetation || L.water[i] !== 0) return '';
  const t = (lg.vegetation?.types || [])[L.vegetation[i]];
  const fr = L.fire_return[i];
  return `<tr><td>vegetation</td><td>${t ? t.name : '?'}</td></tr>
    <tr><td>plants</td><td>trees ${fmt(L.tree_cover[i])}%, cover ${fmt(L.plant_cover[i])}%${L.canopy_height[i] > 0 ? `, canopy ${fmt(L.canopy_height[i])} m` : ''}<br>
      NPP ${fmt(L.npp[i])} g C/m&sup2;/yr, LAI ${fmt(L.lai[i], 1)}<br>${fr > 0 ? `fires every ~${fr < 10 ? fmt(fr) : fmt(Math.round(fr / 10) * 10)} yr` : 'no fires'}</td></tr>`;
}

let drag = null;
canvas.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y }; canvas.classList.add('drag'); });
addEventListener('mouseup', () => { const d = drag; setTimeout(() => { if (drag === d) drag = null; }, 0); canvas.classList.remove('drag'); });
addEventListener('mousemove', (e) => {
  if (drag) {
    state.view.x = drag.vx + e.clientX - drag.x; state.view.y = drag.vy + e.clientY - drag.y; draw();
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 3) { drag.moved = true; if (pinned) hideTip(); }
  }
  if (e.target === canvas) {
    hover(e);
    if (!drag && !pinned) { const o = pick(e); if (o) showTip(o, e, false); else hideTip(); }
    canvas.style.cursor = !drag && pick(e) ? 'pointer' : '';
  }
});
canvas.addEventListener('click', (e) => {
  if (drag && drag.moved) return;
  const o = pick(e);
  if (o) showTip(o, e, true); else if (pinned) hideTip();
});
canvas.addEventListener('mouseleave', () => { if (!pinned) hideTip(); });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const v = state.view, f = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.min(Math.max(v.s * f, 0.2), 40);
  v.x = e.clientX - (e.clientX - v.x) * ns / v.s; v.y = e.clientY - (e.clientY - v.y) * ns / v.s; v.s = ns;
  if (pinned) hideTip();
  draw();
}, { passive: false });
canvas.addEventListener('dblclick', () => { resetView(); draw(); });
addEventListener('resize', draw);

init();
</script>
</body>
</html>
